[build]
  publish = "."
  command = "true"
  # 這個 Netlify 站其實只負責跑 netlify/functions/ 底下那幾支 Function
  # （github-proxy 等），跟後台其他內容（content/ 底下的案例/章節資料、
  # admin/index.html 本身）完全無關——但 Netlify 預設是「repo 裡任何
  # 檔案一變動就整個重新部署」，導致每次在後台按「儲存並發布」（背後
  # 其實是對 Internal-Pages 這個 repo 推一到多筆 git commit）都會白白
  # 觸發一次完整重新部署，一次部署約 15 credits，一天之內就能把
  # Personal plan 一整個月 1000 credits 的額度燒光（2026-08-25 實際發生
  # 過，Production deploys 65 次吃掉 975 credits，Function 呼叫本身
  # 4,777 次只吃 1 credit）。
  # 這行指令的意思：跟上一次「真的有部署」的那個 commit 比，如果
  # netlify.toml 或 netlify/ 資料夾（Function 原始碼）完全沒有變動，
  # 這個指令就會用 --quiet 安靜地找不到差異、結束碼是 0——Netlify 看到
  # 結束碼 0 就會跳過這次部署，不算 credits；只要真的改到 Function
  # 程式碼本身，指令才會找到差異、結束碼非 0，Netlify 才會照常建置部署。
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml netlify/"

[functions]
  directory = "netlify/functions"
