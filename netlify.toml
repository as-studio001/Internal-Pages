[build]
  publish = "."
  command = "true"
  # 2026-08-25 曾經加過一個 ignore 指令，想省掉「後台隨便存個內容就整個
  # 重新部署」白燒的 Netlify credits（部署一次約 15 credits，Function
  # 呼叫本身很便宜）。2026-08-28 移除：發現這個 ignore 規則把「真的該
  # 部署」的 commit 也一起擋掉了（Netlify 的部署紀錄整批顯示
  # Skipped，包括故意去改 netlify/functions/github-proxy.js、要觸發真正
  # 部署的那幾次），導致 github-proxy.js 新增的 createBlob／commitBlobs
  # 動作、ALLOWED_REPOS 白名單更新，遲遲沒有真的上線，造成「一次存多張
  # 照片就存檔失敗（[createBlob] unknown action）」——比省下的 credits
  # 嚴重得多。目前這個規則的判斷邏輯有問題（或跟這個 Netlify 專案目前
  # 的版本不相容，實際原因還沒查清楚），先移除、恢復「一有 push 就照常
  # 重新部署」，確保 Function 程式碼的改動一定會真的上線，額度優化之後
  # 再另外處理，不要在這個問題還沒查清楚之前又重新加回去。

[functions]
  directory = "netlify/functions"
