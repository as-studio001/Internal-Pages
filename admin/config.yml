backend:
  name: git-gateway
  branch: main

# 案例照片統一存放在 images/<slug>/ 底下，slug 由下面表單裡的
# 「網址代號」欄位決定，跟現有的 images/laogu-fang/ 是同一套規則
media_folder: "/images/{{slug}}"
public_folder: "/images/{{slug}}"

collections:
  - name: "projects"
    label: "建築案例"
    label_singular: "案例"
    folder: "content/projects"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: title
    extension: "json"
    format: "json"
    summary: "{{title}} — {{ledeMeta}}"
    fields:
      - label: "網址代號（slug）"
        name: "slug"
        widget: "string"
        hint: "只能用英文小寫、數字、連字號，例如 laogu-fang。決定這個案例的網址與照片資料夾名稱，建立後請不要再更改，否則舊連結會失效。"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "只能用小寫英文字母、數字、連字號（-）"]

      - label: "案名"
        name: "title"
        widget: "string"

      - label: "副標（地點／年份／類型）"
        name: "ledeMeta"
        widget: "string"
        required: false
        hint: "例如：台南市 / 台灣 / 2025 / 展覽空間"

      - label: "分類標籤（選填）"
        name: "tag"
        widget: "string"
        required: false

      - label: "主視覺大圖"
        name: "hero"
        widget: "image"

      - label: "內文段落"
        name: "paragraphs"
        widget: "list"
        hint: "依順序排列的文字段落，會跟下面的內文照片自動交錯排版"
        field: { label: "段落文字", name: "text", widget: "text" }

      - label: "內文照片"
        name: "photos"
        widget: "list"
        hint: "依順序排列，系統會依每張照片的實際比例、以及跟旁邊照片的搭配，自動決定要並排還是獨立全幅顯示，不需要手動排版"
        summary: "{{fields.caption}}"
        fields:
          - { label: "照片", name: "src", widget: "image" }
          - { label: "圖說（選填）", name: "caption", widget: "string", required: false }

      - label: "基地位置"
        name: "map"
        widget: "object"
        fields:
          - { label: "地址", name: "address", widget: "string" }
          - { label: "緯度 lat", name: "lat", widget: "number", value_type: "float" }
          - { label: "經度 lng", name: "lng", widget: "number", value_type: "float" }
          - label: "地圖縮放層級"
            name: "zoom"
            widget: "number"
            value_type: "int"
            default: 17
            hint: "15~19 之間，數字越大顯示範圍越小、越貼近地面"

      - label: "設計研究"
        name: "designResearch"
        widget: "list"
        required: false
        hint: "手稿、模型等設計發展過程，一段文字接一組照片"
        summary: "{{fields.body}}"
        fields:
          - { label: "文字說明", name: "body", widget: "text", required: false }
          - label: "照片"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "照片", name: "src", widget: "image" }
              - { label: "圖說（選填）", name: "caption", widget: "string", required: false }

      - label: "施工過程"
        name: "process"
        widget: "list"
        required: false
        hint: "施工現場紀錄，一段文字接一組照片，依施工階段順序排列"
        summary: "{{fields.body}}"
        fields:
          - { label: "文字說明", name: "body", widget: "text", required: false }
          - label: "照片"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "照片", name: "src", widget: "image" }
              - { label: "圖說（選填）", name: "caption", widget: "string", required: false }

      - label: "圖面"
        name: "drawings"
        widget: "list"
        required: false
        hint: "平面圖、剖面圖、立面圖等技術圖說"
        summary: "{{fields.caption}}"
        fields:
          - { label: "圖面", name: "src", widget: "image" }
          - { label: "圖說（選填）", name: "caption", widget: "string", required: false }

  # 主網站（asarch）的宣言／章節文字跟案例卡片，寫進 content/site/ 底下
  # 幾個固定檔案（不像案例是一筆一筆新增，這幾份內容各自只有一份）。
  # 主網站在瀏覽器端直接抓這幾個 JSON 檔案顯示，存檔後很快就會反映在
  # 主網站上，不需要重新部署主網站。每段文字都有中/簡/英/日/韓 5 個
  # 欄位，用自訂的「lang5」欄位（在 admin/index.html 裡註冊），填好中文
  # 後可以按「自動翻譯其他語言」自動帶入其他 4 種語言草稿，再自己微調。
  - name: "site"
    label: "主網站內容"
    files:
      - name: "declaration"
        label: "首頁宣言"
        file: "content/site/declaration.json"
        fields:
          - label: "標題（兩行）"
            name: "headline"
            widget: "list"
            min: 2
            max: 2
            field: { label: "這一行", name: "line", widget: "lang5" }
          - label: "內文段落"
            name: "paragraphs"
            widget: "list"
            field: { label: "這一段", name: "text", widget: "lang5" }

      - name: "chapter-restore"
        label: "章節：原型修復"
        file: "content/site/chapter-restore.json"
        fields:
          - { label: "章節標題", name: "title", widget: "lang5" }
          - { label: "論述文字", name: "description", widget: "lang5" }
          - label: "案例卡片"
            name: "cases"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "照片", name: "image", widget: "image" }
              - { label: "連結網址", name: "href", widget: "string" }
              - { label: "標題", name: "label", widget: "lang5" }

      - name: "chapter-detail"
        label: "章節：原型細部"
        file: "content/site/chapter-detail.json"
        fields:
          - { label: "章節標題", name: "title", widget: "lang5" }
          - { label: "論述文字", name: "description", widget: "lang5" }
          - label: "案例卡片"
            name: "cases"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "照片", name: "image", widget: "image" }
              - { label: "連結網址", name: "href", widget: "string" }
              - { label: "標題", name: "label", widget: "lang5" }

      - name: "chapter-exhibit"
        label: "章節：原型展覽"
        file: "content/site/chapter-exhibit.json"
        fields:
          - { label: "章節標題", name: "title", widget: "lang5" }
          - label: "論述文字"
            name: "description"
            widget: "lang5"
            hint: "這個章節的案例卡片目前有相簿彈窗效果，還沒開放後台編輯，只有文字可以改"

      - name: "chapter-digital"
        label: "章節：原型數位"
        file: "content/site/chapter-digital.json"
        fields:
          - { label: "章節標題", name: "title", widget: "lang5" }
          - { label: "論述文字", name: "description", widget: "lang5" }
          - label: "案例卡片"
            name: "cases"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "照片", name: "image", widget: "image" }
              - { label: "連結網址", name: "href", widget: "string" }
              - { label: "標題", name: "label", widget: "lang5" }
