function renderSiteEditor(){
  const ed = state.editingSite;
  const isHero = ed.meta && ed.meta.name === "hero";
  app.innerHTML = `${renderTopBar()}<div class="wrap${isHero ? " wrap-wide" : ""}">${siteEditorHtml(ed)}</div>`;
  document.getElementById("logoutBtn").addEventListener("click", logout);
  document.getElementById("backBtn").addEventListener("click", closeSiteEditor);

  bindPathInputs(ed, app);
  bindLang5Blocks(ed, app);

  if(isHero){
    bindHeroEditorEvents(ed);
  } else if(ed.meta && ed.meta.name === "declaration"){
    document.getElementById("addParaBtn").addEventListener("click", () => {
      ed.item.paragraphs = ed.item.paragraphs || [];
      ed.item.paragraphs.push({ "zh-Hant":"", "zh-Hans":"", en:"", ja:"", ko:"" });
      rerenderCurrentEditor();
    });
    app.querySelectorAll("[data-remove-para]").forEach(btn => {
      btn.addEventListener("click", () => {
        ed.item.paragraphs.splice(parseInt(btn.dataset.removePara, 10), 1);
        rerenderCurrentEditor();
      });
    });
  } else {
    // 章節（restore/detail/exhibit/digital）共通的三組照片
    if("heroPhoto" in ed.item) bindCoverDropEvents(ed, "heroPhoto", "images/site");
    bindCoverDropEvents(ed, "mainPhoto", "images/site");
    bindImageList(ed, "thumbnails", "thumbnailsList", "images/site");

    if(Array.isArray(ed.item.cases)){
      ed.item.cases.forEach((c, i) => {
        bindCoverDropEvents(ed, `cases.${i}.image`, "images/site");
      });
      app.querySelectorAll("[data-remove-case]").forEach(btn => {
        btn.addEventListener("click", () => {
          ed.item.cases.splice(parseInt(btn.dataset.removeCase, 10), 1);
          rerenderCurrentEditor();
        });
      });
      const addCaseBtn = document.getElementById("addCaseBtn");
      if(addCaseBtn) addCaseBtn.addEventListener("click", () => {
        ed.item.cases.push({ image: "", href: "", label: { "zh-Hant":"", "zh-Hans":"", en:"", ja:"", ko:"" } });
        rerenderCurrentEditor();
      });
    }
  }

  document.getElementById("saveBtn").addEventListener("click", () => saveSiteEditor(ed));
}

async function saveSiteEditor(ed){
  const title = (ed.item.title && ed.item.title["zh-Hant"]) || "";
  if(ed.isNew && !title.trim()){ toast("請至少填寫章節標題", true); return; }

  try{
    setLoading(true, "儲存中…");

    if(ed.isNew){
      setLoading(true, "產生章節編號中…");
      const existingSlugs = (state.customChapters || []).map((c) => c.slug);
      const slug = "chapter-" + (await generateUniqueSlug(title, existingSlugs, "custom"));
      ed.meta = { name: slug, label: title, file: `content/site/${slug}.json` };
    }

    setLoading(true, "儲存中…");
    await flushPendingUploads(ed, "images/site");
    const json = JSON.stringify(ed.item, null, 2) + "\n";
    const res = await ghPutFile(ed.meta.file, utf8ToBase64(json), `Update ${ed.meta.name} via admin`, ed.sha);
    ed.sha = res.content.sha;

    if(ed.isNew){
      setLoading(true, "同步章節清單中…");
      await regenerateExtraChaptersManifest();
      state.customChapters = null; // 回列表時重新載入，才會看到新章節
      ed.isNew = false;
      toast("已發布，主網站幾分鐘內會更新");
      closeSiteEditor();
      return;
    }

    toast("已發布，主網站幾分鐘內會更新");
  }catch(err){
    toast("儲存失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

/* ============================================================
   首頁最上方文字（SECTION 1）的視覺化編輯器——右邊面板每個輸入框/
   滑塊改動時，同時做兩件事：寫進 ed.item（存檔時會用到）、postMessage
   一份 patch 給 iframe 即時預覽。iframe 裡拖曳位置/縮放的結果則是反過來
   由 iframe postMessage 回這裡（見下面全域的 message 監聽），寫回
   ed.item 並更新「目前位置／縮放」那行唯讀文字。
   ============================================================ */
function heroPreviewPatch(item){
  return {
    line1: item.line1, line1Weight: item.line1Weight, line1LetterSpacing: item.line1LetterSpacing,
    line2: item.line2, line2Weight: item.line2Weight, line2LetterSpacing: item.line2LetterSpacing,
    lineGap: item.lineGap, scale: item.scale, offsetX: item.offsetX, offsetY: item.offsetY,
  };
}

function postHeroPreview(patch){
  const iframe = document.getElementById("heroPreviewFrame");
  if(iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: "hero-preview-set", patch }, "*");
}

function updateHeroPosReadout(ed){
  const el = document.getElementById("heroPosReadout");
  if(el) el.textContent = `水平 ${ed.item.offsetX || "1cm"}／垂直 ${ed.item.offsetY || "-25vh"}／縮放 ${ed.item.scale != null ? ed.item.scale : 1}×`;
}

/* ------------------------------------------------------------
   上一步／下一步（Ctrl+Z／Ctrl+Y）——歷史紀錄只存在 ed.history 這個
   session 內的記憶體陣列，關掉編輯器或重新整理頁面就會消失（跟
   ed.item 本身一樣，還沒按「儲存並發布」都只是暫存）。每個「一次性
   的改動」（拖曳/縮放放開滑鼠、滑桿放開、文字框失焦、下拉選單選擇、
   按重設）都算一步，不是每個 input 事件都算——不然拖滑桿拖到一半
   放開前的每個中間值都會變成一步，上一步會變得幾乎沒用。
   ------------------------------------------------------------ */
function cloneHeroItem(item){ return JSON.parse(JSON.stringify(item)); }

function pushHeroHistory(ed){
  if(!ed.history) ed.history = { past: [], future: [] };
  ed.history.past.push(cloneHeroItem(ed.item));
  if(ed.history.past.length > 50) ed.history.past.shift(); // 上限，避免無止盡累積
  ed.history.future = []; // 邊改邊做新動作，原本能重做的「下一步」就失效了
  updateHeroUndoRedoButtons(ed);
}

function updateHeroUndoRedoButtons(ed){
  const undoBtn = document.getElementById("heroUndoBtn");
  const redoBtn = document.getElementById("heroRedoBtn");
  if(undoBtn) undoBtn.disabled = !(ed.history && ed.history.past.length);
  if(redoBtn) redoBtn.disabled = !(ed.history && ed.history.future.length);
}

// 復原/取消復原不重畫整個編輯器（那樣會連 iframe 一起重建，害它重新
// 整個載入一次），只把右邊面板每個欄位的值/唯讀文字改回對應的內容，
// 再用平常同一套 postHeroPreview 把整包資料重推給 iframe。
function refreshHeroFormFields(ed){
  const setVal = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
  const setText = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  const it = ed.item;
  setVal("heroLine1", it.line1 || "");
  setVal("heroLine1Weight", it.line1Weight || "600");
  const ls1 = it.line1LetterSpacing != null ? it.line1LetterSpacing : 0.15;
  setVal("heroLine1LetterSpacing", ls1);
  setText("heroLine1LetterSpacingVal", ls1.toFixed(2));
  setVal("heroLine2", it.line2 || "");
  setVal("heroLine2Weight", it.line2Weight || "400");
  const ls2 = it.line2LetterSpacing != null ? it.line2LetterSpacing : 0.3;
  setVal("heroLine2LetterSpacing", ls2);
  setText("heroLine2LetterSpacingVal", ls2.toFixed(2));
  const gap = it.lineGap != null ? it.lineGap : 1.25;
  setVal("heroLineGap", gap);
  setText("heroLineGapVal", gap.toFixed(2));
  updateHeroPosReadout(ed);
  updateHeroUndoRedoButtons(ed);
}

function undoHeroChange(ed){
  if(!ed.history || !ed.history.past.length) return;
  ed.history.future.push(cloneHeroItem(ed.item));
  ed.item = ed.history.past.pop();
  refreshHeroFormFields(ed);
  postHeroPreview(heroPreviewPatch(ed.item));
}

function redoHeroChange(ed){
  if(!ed.history || !ed.history.future.length) return;
  ed.history.past.push(cloneHeroItem(ed.item));
  ed.item = ed.history.future.pop();
  refreshHeroFormFields(ed);
  postHeroPreview(heroPreviewPatch(ed.item));
}

// 固定掛著、鍵盤快捷鍵只在正在編輯 hero 時才生效，其他畫面（案例編輯器
// 的 contentEditable、其他表單輸入框）的瀏覽器原生 Ctrl+Z/Y 行為不受
// 影響。在瀏覽器焦點還在 iframe 裡（例如剛拖完文字，焦點還沒切回外層）
// 時按 Ctrl+Z/Y，這個監聽器收不到（keydown 不會跨 iframe 邊界往上
// 傳），要靠 HeroText.tsx 自己也監聽、用 postMessage 轉告這裡，見下面
// message 監聽的 hero-preview-undo/redo 分支。
window.addEventListener("keydown", (e) => {
  const ed = state.editingSite;
  if(!ed || !ed.meta || ed.meta.name !== "hero") return;
  const key = e.key ? e.key.toLowerCase() : "";
  const isUndo = (e.ctrlKey || e.metaKey) && !e.shiftKey && key === "z";
  const isRedo = (e.ctrlKey || e.metaKey) && (key === "y" || (key === "z" && e.shiftKey));
  if(!isUndo && !isRedo) return;
  e.preventDefault();
  if(isUndo) undoHeroChange(ed); else redoHeroChange(ed);
});

// 量外層框框（heroPreviewViewport）目前實際渲染出來多大，把固定
// HERO_PREVIEW_REF_W×HERO_PREVIEW_REF_H（16:9，代表典型桌機）的 iframe
// 縮放到剛好「鋪滿」框框——取寬度縮放比例、高度縮放比例中較大的那個
// （Math.max，不是 Math.min），框框長寬比跟 16:9 不一樣時，會有一部分
// 超出框框邊界，靠外層框框的 overflow:hidden 裁掉，不會留黑邊、也不會
// 變形拉伸。
//
// 2026-08-25 從「配合框框長寬比動態算高度」改回固定 16:9 参考尺寸：
// 動態算高度雖然不會留黑邊，但底圖照片用 object-cover（照容器長寬比
// 裁切）、文字位置用 vh（相對視窗高度）都是「畫面比例不同、算出來的
// 結果就不同」的東西——讓 iframe 內部模擬的比例跟著框框（會因為瀏覽器
// 視窗寬度、面板換行而變動）漂移，會導致「預覽看到的照片裁切方式／
// 文字相對位置」跟「真正桌機訪客看到的」對不起來，沒辦法拿來精準對位，
// 比留黑邊更嚴重。固定參考尺寸＋裁切多出來的部分，才能同時做到「不留
// 黑邊」跟「看到的部分位置一定準」。
//
// 框框大小會因為視窗寬度、面板換行而變，所以視窗 resize 時也要重算
// 一次，不能只在一開始算一次就好。
function layoutHeroPreview(){
  const viewport = document.getElementById("heroPreviewViewport");
  const iframe = document.getElementById("heroPreviewFrame");
  if(!viewport || !iframe) return;
  const boxW = viewport.clientWidth;
  const boxH = viewport.clientHeight;
  if(boxW <= 0 || boxH <= 0) return;
  const scale = Math.max(boxW / HERO_PREVIEW_REF_W, boxH / HERO_PREVIEW_REF_H);
  const offsetX = (boxW - HERO_PREVIEW_REF_W * scale) / 2;
  const offsetY = (boxH - HERO_PREVIEW_REF_H * scale) / 2;
  iframe.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

// 固定掛著、不用開關——只有目前正在編輯 hero 才會真的重算，其他情況
// 直接略過，不會影響別的畫面（跟下面 message 監聽同一種寫法）。
window.addEventListener("resize", () => {
  const ed = state.editingSite;
  if(ed && ed.meta && ed.meta.name === "hero") layoutHeroPreview();
});

function bindHeroEditorEvents(ed){
  if(!ed.history) ed.history = { past: [], future: [] };
  layoutHeroPreview();
  updateHeroUndoRedoButtons(ed);

  // input 事件每打一個字/拖一格滑桿就會連續觸發很多次，只在「這一連串
  // 動作的第一次」補一筆歷史紀錄（snapshotted 這個旗標記錄「已經補過
  // 了」），change 事件（放開滑鼠／欄位失焦／下拉選單選好）代表這一串
  // 動作結束，才把旗標重設，讓下一次改動重新補一筆——這樣一次「把滑桿
  // 拖到底」只算一步，不是拖過的每一格都算一步。
  const bindText = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    let snapshotted = false;
    el.addEventListener("input", () => {
      if(!snapshotted){ pushHeroHistory(ed); snapshotted = true; }
      ed.item[key] = el.value;
      postHeroPreview({ [key]: el.value });
    });
    el.addEventListener("change", () => { snapshotted = false; });
  };
  const bindRange = (id, valId, key) => {
    const el = document.getElementById(id);
    const valEl = document.getElementById(valId);
    if(!el) return;
    let snapshotted = false;
    el.addEventListener("input", () => {
      if(!snapshotted){ pushHeroHistory(ed); snapshotted = true; }
      const v = parseFloat(el.value);
      ed.item[key] = v;
      if(valEl) valEl.textContent = v.toFixed(2);
      postHeroPreview({ [key]: v });
    });
    el.addEventListener("change", () => { snapshotted = false; });
  };

  bindText("heroLine1", "line1");
  bindText("heroLine1Weight", "line1Weight");
  bindText("heroLine2", "line2");
  bindText("heroLine2Weight", "line2Weight");
  bindRange("heroLine1LetterSpacing", "heroLine1LetterSpacingVal", "line1LetterSpacing");
  bindRange("heroLine2LetterSpacing", "heroLine2LetterSpacingVal", "line2LetterSpacing");
  bindRange("heroLineGap", "heroLineGapVal", "lineGap");

  const undoBtn = document.getElementById("heroUndoBtn");
  if(undoBtn) undoBtn.addEventListener("click", () => undoHeroChange(ed));
  const redoBtn = document.getElementById("heroRedoBtn");
  if(redoBtn) redoBtn.addEventListener("click", () => redoHeroChange(ed));

  const resetBtn = document.getElementById("heroResetBtn");
  if(resetBtn) resetBtn.addEventListener("click", () => {
    if(!confirm("要把位置跟縮放重設回預設值嗎？（水平 1cm／垂直 -25vh／縮放 1 倍，右邊面板的其他文字設定不會被動到，這步也還沒存檔，可以用「上一步」復原）")) return;
    pushHeroHistory(ed);
    ed.item.offsetX = "1cm";
    ed.item.offsetY = "-25vh";
    ed.item.scale = 1;
    updateHeroPosReadout(ed);
    postHeroPreview({ offsetX: "1cm", offsetY: "-25vh", scale: 1 });
  });
}

// 固定掛著、不用開關——只有 state.editingSite 正好是 hero 這筆、而且
// 訊息真的來自 hero 那個 iframe 時才會處理，其他情況（沒開這個編輯器、
// 或訊息來自別的 iframe，例如案例編輯器自己的即時預覽）都直接略過，
// 不會互相干擾（asarch 跟這個後台雖然是同一個 origin，但用不同的
// message type 字串區分，不會跟 cms-edit 等案例編輯器的訊息搞混）。
window.addEventListener("message", (e) => {
  const ed = state.editingSite;
  if(!ed || !ed.meta || ed.meta.name !== "hero") return;
  if(!e.data) return;
  const iframe = document.getElementById("heroPreviewFrame");
  if(!iframe || e.source !== iframe.contentWindow) return;
  if(e.data.type === "hero-preview-ready"){
    // iframe 剛載入完成（或使用者在裡面重新整理過），把目前編輯到一半、
    // 還沒存檔的內容整包重新推過去，確保預覽跟右邊表單看到的是同一份
    // 資料，不是 hero.json 上一次存檔的舊內容。
    postHeroPreview(heroPreviewPatch(ed.item));
    return;
  }
  if(e.data.type === "hero-preview-change" && e.data.patch){
    // 拖曳/縮放一次手勢只會在放開滑鼠那一刻送一次這個訊息（不是拖曳
    // 過程中每一格都送），所以這裡補一筆歷史紀錄就正好是「一步」，
    // 不用像面板的滑桿/文字框那樣另外做旗標去重。
    pushHeroHistory(ed);
    Object.assign(ed.item, e.data.patch);
    updateHeroPosReadout(ed);
    return;
  }
  if(e.data.type === "hero-preview-undo"){
    // 焦點還在 iframe 裡（例如剛拖完文字）按 Ctrl+Z，這個外層頁面的
    // keydown 監聽收不到，改由 HeroText.tsx 自己攔截、postMessage 過來。
    undoHeroChange(ed);
    return;
  }
  if(e.data.type === "hero-preview-redo"){
    redoHeroChange(ed);
  }
});

/* ============================================================
   主網頁：入口跟其他分頁一樣先是一張卡片，點進去才整頁打開現成的
   「圓點位置編輯器.html」（獨立、自包含的視覺化工具，不是這個後台自己
   重做的一套）——只用 iframe 把它嵌進編輯畫面，工具本身的匯入（貼上
   建築事務所首頁.dc.html 完整內容）／同步（複製出更新後的完整檔案內容，
   貼回去覆蓋）都在工具自己裡面完成，不經過這個後台的存檔機制，也不寫
   GitHub。
   ============================================================ */
function homepageListHtml(){
  return `
    <div class="item-grid">
      <div class="item-card" data-edit-homepage="1">
        <div class="thumb empty" style="background:#201f1d;color:#fff;">首頁</div>
        <div class="info">
          <div class="t">首頁圓點與連線</div>
          <div class="m">圓點位置編輯器</div>
        </div>
      </div>
    </div>
  `;
}

function bindHomepageListEvents(){
  const el = document.getElementById("tabContent");
  const card = el.querySelector("[data-edit-homepage]");
  if(card) card.addEventListener("click", openHomepageEditor);
}

function openHomepageEditor(){ state.editingHomepage = true; render(); }
function closeHomepageEditor(){
  window.removeEventListener("message", handleHomepageSyncMessage);
  state.editingHomepage = false;
  render();
}

// 「圓點位置編輯器」自己完全不知道怎麼寫 GitHub（沒有密鑰），它的「自動
// 推送」按鈕只是把整份更新好的檔案內容用 postMessage 丟過來，實際的寫入
// 動作在這裡執行——直接覆蓋 asstudiowebsite 的「建築事務所首頁.dc.html」
// 跟「index.html」兩個檔案（這兩個檔案目前是各自獨立、內容要一致，見
// asstudiowebsite 的 CLAUDE.md 說明，所以兩個都要一起更新，不能只改一個）。
// 寫完/失敗都會用 postMessage 把結果傳回 iframe，讓工具自己的 UI 顯示
// 結果，不是在後台這邊彈提示——使用者的注意力這時候是在 iframe 裡。
async function handleHomepageSyncMessage(e){
  const data = e.data || {};
  if(data.type !== "sc-homepage-sync") return;
  const iframe = document.getElementById("homepageEditorIframe");
  const respond = (ok, message) => {
    if(iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: "sc-homepage-sync-result", ok, message }, "*");
  };
  const targets = ["建築事務所首頁.dc.html", "index.html"];
  try{
    setLoading(true, "推送主網頁程式碼中…");
    for(const filename of targets){
      setLoading(true, `推送 ${filename} 中…`);
      const existing = await fetchAsstudiowebsitePublic(filename);
      await ghPutFile(filename, utf8ToBase64(data.fileText), `Update homepage ${filename} via 圓點位置編輯器`, existing.sha, "asstudiowebsite");
    }
    respond(true, "已推送，建築事務所首頁.dc.html 跟 index.html 都更新了，網站幾分鐘內會上線");
  }catch(err){
    respond(false, err.message);
  }finally{
    setLoading(false);
  }
}

function renderHomepageEditor(){
  app.innerHTML = `
    ${renderTopBar()}
    <div class="wrap wrap-wide">
      <div class="editor">
        <div class="editor-head">
          <button class="back-link" id="backBtn">← 回到主網頁列表</button>
        </div>
        <div class="field-hint" style="margin-bottom:14px;">
          這是編輯主網頁（首頁）圓點與連線位置的視覺化工具，跟後台其他編輯畫面不是同一套系統：
          先按工具裡的「從主網頁匯入」→「自動抓取目前網站內容」；編輯完按「同步到主網頁」，
          裡面會有一顆「自動推送到 asstudiowebsite」，按下去會直接覆蓋
          <strong>建築事務所首頁.dc.html 跟 index.html 兩個檔案</strong>（兩個一起更新，不用再自己複製貼上兩次）。
          這一步需要 Netlify 那邊能正常寫入 asstudiowebsite，如果目前額度/部署還沒解決，會推送失敗，退回用「複製全部」手動貼上即可。
        </div>
        <iframe id="homepageEditorIframe" src="./圓點位置編輯器.html" style="width:100%; height:85vh; min-height:640px; border:1px solid var(--line); border-radius:8px;"></iframe>
      </div>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", closeHomepageEditor);
  window.addEventListener("message", handleHomepageSyncMessage);
}
/* ============================================================
   啟動
   ============================================================ */
(async function init(){
  if(SETUP_INCOMPLETE){ render(); return; }

  // 帶著邀請信/忘記密碼連結進來時，Supabase 用網址 hash 帶 token，
  // 客戶端套件會自動讀取並建立好 session——這裡先確認一次再繼續，
  // render() 裡的 isInviteOrRecoveryLink() 判斷會決定要不要先強制設密碼。
  const { data } = await sb.auth.getSession();
  authSession = data.session;

  if(authSession && !isInviteOrRecoveryLink()){
    try{
      setLoading(true, "載入中…");
      state.user = { email: authSession.user.email };
      await loadCaseList();
    }catch(err){
      toast(err.message || "載入失敗", true);
    }finally{
      setLoading(false);
    }
  }
  render();
})();
</script>
