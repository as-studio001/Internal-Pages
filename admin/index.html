<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>案例後台</title>
</head>
<body>
<!-- Decap CMS 的 script 一定要放在 <body> 裡（不能在 <head>），
     它初始化時會直接操作 document.body，放在 <head> 執行時 body
     還不存在，會直接整個掛掉、CMS/h/createClass 都不會被定義出來 -->

<!-- 邀請信／忘記密碼信裡的連結會帶 #invite_token=.../#recovery_token=...
     這種網址雜湊參數，一定要在 decap-cms.js 之前載入 Netlify Identity
     widget，讓它先讀到這個參數並跳出設密碼視窗——如果晚一步載入，
     Decap CMS 自己的路由會先把網址雜湊清成 #/，邀請連結就永遠失效、
     只會看到普通的登入畫面 -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
<script>
  var h = window.h;
  var createClass = window.createClass;

  // 後台編輯的照片在還沒存檔前，路徑指向的是暫存的草稿檔案，要透過
  // getAsset() 才能拿到瀏覽器可以直接顯示的網址；已經存檔過的照片
  // getAsset() 也一樣能正確解析回 repo 裡的真實路徑，兩種情況都適用。
  function resolveImagePaths(getAsset, data) {
    function resolve(path) {
      if (!path) return path;
      var asset = getAsset(path);
      return asset ? asset.toString() : path;
    }
    function resolvePhotoList(list) {
      return (list || []).map(function (item) {
        return Object.assign({}, item, { src: resolve(item.src) });
      });
    }
    var out = Object.assign({}, data);
    out.hero = resolve(out.hero);
    out.photos = resolvePhotoList(out.photos);
    out.drawings = resolvePhotoList(out.drawings);
    ["designResearch", "process"].forEach(function (key) {
      out[key] = (out[key] || []).map(function (step) {
        return Object.assign({}, step, { photos: resolvePhotoList(step.photos) });
      });
    });
    return out;
  }

  var ProjectPreview = createClass({
    postToFrame: function () {
      var iframe = this.refs.frame;
      if (!iframe || !iframe.contentWindow) return;
      var data = this.props.entry.get("data").toJS();
      var resolved = resolveImagePaths(this.props.getAsset, data);
      iframe.contentWindow.postMessage({ type: "cms-preview", project: resolved }, "*");
    },
    componentDidMount: function () {
      this.postToFrame();
    },
    componentDidUpdate: function () {
      this.postToFrame();
    },
    render: function () {
      return h("iframe", {
        ref: "frame",
        src: "../index.html?preview=1",
        style: { width: "100%", height: "100%", border: "0", background: "#0a0a0a" },
        onLoad: this.postToFrame,
      });
    },
  });

  CMS.registerPreviewTemplate("projects", ProjectPreview);

  // ==========================================================
  // 「lang5」自訂欄位：中/簡/英/日/韓 5 個文字框 + 一顆「自動翻譯其他
  // 語言」按鈕。按下去會拿「中文（繁體）」欄位的內容，透過免費、不用
  // 金鑰的 Google 翻譯端點翻成其他 4 種語言、自動填入對應欄位——這是
  // 未經審核的機器翻譯草稿，填完務必自己看過、微調用詞，不要直接發布。
  // ==========================================================
  var LANG5_LANGS = [
    ["zh-Hant", "中文（繁體）"],
    ["zh-Hans", "中文（簡體）"],
    ["en", "English"],
    ["ja", "日本語"],
    ["ko", "한국어"],
  ];

  function lang5Get(value, key) {
    if (!value) return "";
    if (typeof value.get === "function") return value.get(key) || "";
    return value[key] || "";
  }

  function lang5Set(value, key, v) {
    if (value && typeof value.set === "function") return value.set(key, v);
    var obj = Object.assign({}, value || {});
    obj[key] = v;
    return obj;
  }

  var Lang5Control = createClass({
    getInitialState: function () {
      return { translating: false };
    },
    onChangeField: function (key, e) {
      this.props.onChange(lang5Set(this.props.value, key, e.target.value));
    },
    translateAll: function () {
      var source = lang5Get(this.props.value, "zh-Hant");
      if (!source) {
        window.alert("請先填寫「中文（繁體）」欄位，再按自動翻譯");
        return;
      }
      var targets = ["zh-Hans", "en", "ja", "ko"];
      var self = this;
      this.setState({ translating: true });
      Promise.all(
        targets.map(function (t) {
          var url =
            "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=" +
            t +
            "&dt=t&q=" +
            encodeURIComponent(source);
          return fetch(url)
            .then(function (r) {
              return r.json();
            })
            .then(function (json) {
              return (json[0] || [])
                .map(function (seg) {
                  return seg[0];
                })
                .join("");
            })
            .catch(function () {
              return "";
            });
        })
      ).then(function (results) {
        var next = self.props.value;
        targets.forEach(function (t, i) {
          if (results[i]) next = lang5Set(next, t, results[i]);
        });
        self.setState({ translating: false });
        self.props.onChange(next);
      });
    },
    render: function () {
      var value = this.props.value;
      var self = this;
      var rows = LANG5_LANGS.map(function (pair) {
        var key = pair[0];
        var label = pair[1];
        return h(
          "div",
          { key: key, style: { marginBottom: "8px" } },
          h(
            "label",
            { style: { display: "block", fontSize: "12px", color: "#666", marginBottom: "2px" } },
            label
          ),
          h("textarea", {
            value: lang5Get(value, key),
            onChange: self.onChangeField.bind(self, key),
            rows: 3,
            style: { width: "100%", fontFamily: "inherit", padding: "6px", boxSizing: "border-box" },
          })
        );
      });
      return h(
        "div",
        { style: { border: "1px solid #ddd", borderRadius: "6px", padding: "10px" } },
        h(
          "button",
          {
            type: "button",
            onClick: this.translateAll,
            disabled: this.state.translating,
            style: {
              marginBottom: "10px",
              padding: "6px 12px",
              background: "#1a1a1a",
              color: "#fff",
              border: "none",
              borderRadius: "4px",
              cursor: "pointer",
            },
          },
          this.state.translating ? "翻譯中…" : "自動翻譯其他語言"
        ),
        rows
      );
    },
  });

  var Lang5Preview = createClass({
    render: function () {
      return h("div", {}, lang5Get(this.props.value, "zh-Hant"));
    },
  });

  CMS.registerWidget("lang5", Lang5Control, Lang5Preview);

  // ==========================================================
  // 主網站內容（宣言／各章節）的預覽——外觀比照 asarch 真實主網站的
  // 深色底、襯線字，讓後台編輯時大致看得出前台會長怎樣。
  // ==========================================================
  var SitePreview = createClass({
    render: function () {
      var data = this.props.entry.get("data").toJS();
      var getAsset = this.props.getAsset;
      var children = [];

      if (data.headline) {
        children.push(
          h(
            "h1",
            {
              key: "headline",
              style: { fontFamily: "serif", fontSize: "26px", lineHeight: 1.7, marginBottom: "24px", fontWeight: 400 },
            },
            (data.headline || [])
              .map(function (item) {
                return item && item["zh-Hant"];
              })
              .join("　")
          )
        );
      }
      if (data.paragraphs) {
        children.push(
          h(
            "div",
            { key: "paragraphs", style: { maxWidth: "640px" } },
            (data.paragraphs || []).map(function (p, i) {
              return h(
                "p",
                { key: i, style: { marginBottom: "14px", lineHeight: 2, color: "#ddd" } },
                p && p["zh-Hant"]
              );
            })
          )
        );
      }
      if (data.title) {
        children.push(
          h(
            "h2",
            { key: "title", style: { fontFamily: "serif", fontSize: "22px", marginBottom: "14px", fontWeight: 400 } },
            data.title["zh-Hant"]
          )
        );
      }
      if (data.description) {
        children.push(
          h(
            "p",
            { key: "desc", style: { lineHeight: 2, marginBottom: "28px", maxWidth: "640px", color: "#ddd" } },
            data.description["zh-Hant"]
          )
        );
      }
      if (data.cases) {
        children.push(
          h(
            "div",
            { key: "cases", style: { display: "flex", flexWrap: "wrap", gap: "20px" } },
            (data.cases || []).map(function (c, i) {
              var src = "";
              if (c.image) {
                var asset = getAsset(c.image);
                src = asset ? asset.toString() : c.image;
              }
              return h(
                "div",
                { key: i, style: { width: "160px", textAlign: "center" } },
                h("img", {
                  src: src,
                  style: { width: "100%", aspectRatio: "4 / 3", objectFit: "cover", display: "block" },
                }),
                h(
                  "p",
                  { style: { marginTop: "10px", fontFamily: "serif", fontSize: "14px", color: "#fff" } },
                  c.label ? c.label["zh-Hant"] : ""
                )
              );
            })
          )
        );
      }

      return h(
        "div",
        {
          style: {
            background: "#0a0a0a",
            color: "#fff",
            padding: "40px",
            minHeight: "100%",
            boxSizing: "border-box",
          },
        },
        children
      );
    },
  });

  ["declaration", "chapter-restore", "chapter-detail", "chapter-exhibit", "chapter-digital"].forEach(function (name) {
    CMS.registerPreviewTemplate(name, SitePreview);
  });
</script>
</body>
</html>
