/* ============================================================
   案例即時預覽的編輯（點文字改文字、點照片換照片）——iframe 裡真的
   在跑 index.html + render.js，跟真正上線的頁面是同一套渲染邏輯，
   不是另外做一份長得像的介面。文字用 contenteditable 直接改，改完
   iframe 內部自己就會顯示新文字，不需要通知後台重畫；照片沒辦法
   「直接改」，點下去會回報給這裡，由後台負責挑檔案、暫存預覽網址，
   再把整份內容重新 po 回 iframe 重畫一次。
   ============================================================ */
window.addEventListener("message", (e) => {
  if(!e.data) return;

  const ed = state.editingCase;
  if(!ed) return;
  if(e.data.type === "cms-edit"){
    handleCaseEdit(ed, e.data);
    if(ed.isNew) refreshNewCaseGuide(ed);
    return;
  }
  if(e.data.type === "cms-rendered"){
    // 四個分區各自都是完整的一份頁面，隨便挑一個（固定用「內容」那個）
    // 重畫完的當下去要自動排版就好，不用四個都各要一次
    const contentFrame = document.getElementById("preview_content");
    if(ed.pendingAutoLayoutRequest && contentFrame && e.source === contentFrame.contentWindow){
      ed.pendingAutoLayoutRequest = false;
      contentFrame.contentWindow.postMessage({ type: "cms-compute-auto-layout" }, "*");
    }
    // 每個分區各自的 iframe 只在自己第一次重畫完之後把不相關的部分藏起來
    // （之後的重畫不用再藏一次，藏起來的狀態本來就會一直維持著）
    CASE_PREVIEW_BLOCKS.forEach((block) => {
      const frame = document.getElementById("preview_" + block.key);
      if(frame && e.source === frame.contentWindow && !ed._previewFocused[block.key]){
        ed._previewFocused[block.key] = true;
        frame.contentWindow.postMessage({ type: "cms-focus-section", key: block.key }, "*");
      }
    });
    return;
  }
  if(e.data.type === "cms-content-height"){
    // 裁切完之後把 iframe 的框高貼著剩下的內容調整，不要留一大截空白，
    // 之後內容變動（多打一段文字之類）也會再收到一次、跟著重新調整
    CASE_PREVIEW_BLOCKS.forEach((block) => {
      const frame = document.getElementById("preview_" + block.key);
      if(frame && e.source === frame.contentWindow){
        frame.style.height = Math.max(120, e.data.height) + "px";
      }
    });
    return;
  }
  if(e.data.type === "cms-auto-layout"){
    ed.item.photoLayout = e.data.layout;
    refreshPhotoGroups(ed);
    return;
  }
});

function postCaseProjectToIframe(ed){
  const data = resolveCaseForPreview(ed.item, ed.pendingUploads);
  CASE_PREVIEW_BLOCKS.forEach((block) => {
    const iframe = document.getElementById("preview_" + block.key);
    if(iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: "cms-preview", project: data }, "*");
  });
}

function resolveCaseForPreview(item, pendingUploads){
  const clone = JSON.parse(JSON.stringify(item));
  const resolve = (v) => (pendingUploads[v] ? pendingUploads[v].previewUrl : v);
  clone.hero = resolve(clone.hero);
  clone.externalUrlCover = resolve(clone.externalUrlCover);
  (clone.photos || []).forEach((p) => { p.src = resolve(p.src); });
  (clone.drawings || []).forEach((p) => { p.src = resolve(p.src); });
  (clone.detailPhotos || []).forEach((p) => { p.src = resolve(p.src); });
  return clone;
}

/* 在即時預覽裡點照片換掉之後，下面清單裡對應那張縮圖也要跟著換，
   不然要等使用者剛好觸發別的重畫（例如新增另一張照片）才會更新，
   看起來像沒生效 */
function syncCompactThumb(containerId, photoIndex, newSrc){
  const img = document.querySelector(`#${containerId} [data-photo-index="${photoIndex}"] .thumb img`);
  if(img) img.src = newSrc;
}

/* ============================================================
   照片排版：預設完全自動（跟以前一樣，系統依照片比例決定並排/全幅、
   平均分散在文字裡），使用者不用管。只有想微調時才進來調——「這組
   照片要接在第幾段文字後面」「兩張並排時左右比例怎麼分」，其餘（單張
   全幅、多張直式照片並排…）維持自動判斷，不用使用者操心。
   ============================================================ */
function getValidPhotoLayout(ed){
  const layout = ed.item.photoLayout;
  const photos = ed.item.photos || [];
  if(!Array.isArray(layout) || layout.length === 0) return null;
  const seen = new Set();
  for(const g of layout){
    if(!Array.isArray(g.photos) || g.photos.length === 0) return null;
    for(const i of g.photos){
      if(typeof i !== "number" || i < 0 || i >= photos.length || seen.has(i)) return null;
      seen.add(i);
    }
  }
  return seen.size === photos.length ? layout : null;
}

/* 照片排版還沒產生過、或因為照片張數變了而失效時，跟 iframe 要一份
   自動排版當起點（要等 iframe 那份照片比例真的量測完才能算，所以先
   立 flag，等 cms-rendered 回報再送 cms-compute-auto-layout） */
function ensurePhotoLayout(ed){
  if((ed.item.photos || []).length < 2) return;
  if(getValidPhotoLayout(ed)) return;
  ed.pendingAutoLayoutRequest = true;
  postCaseProjectToIframe(ed);
}

/* 固定的 15 種照片排版模板（跟 js/render.js 的 TEMPLATE_DEFS 一一對應，
   這裡只需要顯示用的名稱跟需要幾張照片）——選模板點選就好，不是自由
   拖拉調整大小/位置，避免排版跑掉。 */
const PHOTO_TEMPLATES = [
  { id: "solo", label: "單張全幅", count: 1 },
  { id: "pair-50-50", label: "左右對半", count: 2 },
  { id: "pair-60-40", label: "左大右小 60/40", count: 2 },
  { id: "pair-40-60", label: "右大左小 40/60", count: 2 },
  { id: "pair-70-30", label: "左大右小 70/30", count: 2 },
  { id: "pair-30-70", label: "右大左小 30/70", count: 2 },
  { id: "pair-portrait", label: "兩張直式並排", count: 2 },
  { id: "triple-even", label: "三張橫向均分", count: 3 },
  { id: "triple-portrait", label: "三張直式並排", count: 3 },
  { id: "quad-even", label: "四張橫向均分", count: 4 },
  { id: "quad-portrait", label: "四張直式並排", count: 4 },
  { id: "big-left-stack-right", label: "左大＋右側疊兩小", count: 3 },
  { id: "big-right-stack-left", label: "右大＋左側疊兩小", count: 3 },
  { id: "big-top-stack-bottom", label: "上大＋下方並排兩小", count: 3 },
  { id: "big-bottom-stack-top", label: "下大＋上方並排兩小", count: 3 },
];

/* 排版模板選擇整合在「內文照片」清單裡（不是另一個獨立面板）：清單
   本身就依目前的分組（getValidPhotoLayout）畫成一張一張的「群組卡」，
   每張卡片＝最後會並排在同一整排的照片，卡片上直接有模板下拉選單，
   一整排是一個選擇單位，跟預覽裡最終呈現的樣子一一對應。 */
function setGroupTemplate(ed, groupIndex, templateId){
  const layout = getValidPhotoLayout(ed);
  if(!layout || !layout[groupIndex]) return;
  if(templateId){
    layout[groupIndex].template = templateId;
  } else {
    delete layout[groupIndex].template;
  }
}

function photoGroupCardHtml(ed, g, gi, photos, paragraphs){
  const matching = PHOTO_TEMPLATES.filter((t) => t.count === g.photos.length);
  const current = g.template || "";
  return `
    <div class="photo-group-card" data-group-index="${gi}">
      <div class="photo-group-thumbs">
        ${g.photos.map((i) => `
          <div class="photo-row" data-photo-index="${i}" draggable="true">
            <span class="drag-handle" title="拖曳調整順序／跟別組交換">⠿</span>
            <div class="thumb">${mediaThumbHtml(resolveSrc(ed.pendingUploads, photos[i].src))}</div>
            <input type="text" data-path="photos.${i}.caption" value="${esc(photos[i].caption || "")}" placeholder="圖說（選填）">
            <button type="button" class="row-remove-btn" data-remove-photo="${i}" title="移除">×</button>
          </div>
        `).join("")}
      </div>
      <div class="photo-group-controls">
        <label>這一整排的版型
          <select data-group-template="${gi}">
            <option value="">自動判斷（依比例決定並排或全幅）</option>
            ${matching.map((t) => `<option value="${t.id}" ${current === t.id ? "selected" : ""}>${t.label}</option>`).join("")}
          </select>
        </label>
        <label>接在
          <select data-group-after="${gi}">
            <option value="0" ${g.afterParagraph === 0 ? "selected" : ""}>最前面</option>
            ${paragraphs.map((_, pi) => `<option value="${pi + 1}" ${g.afterParagraph === pi + 1 ? "selected" : ""}>第 ${pi + 1} 段文字後</option>`).join("")}
          </select>
        </label>
      </div>
    </div>
  `;
}

function photoGroupsHtml(ed){
  const photos = ed.item.photos || [];
  if(photos.length === 0){
    return `
      <div class="photo-list-drop" id="photosList">
        <div class="photo-list">
          <button type="button" class="add-photo-btn" data-add-photo="1">${iconUpload()}<span>新增照片</span></button>
        </div>
      </div>
    `;
  }
  const layout = getValidPhotoLayout(ed);
  const paragraphs = ed.item.paragraphs || [];
  const groupsHtml = layout
    ? layout.map((g, gi) => photoGroupCardHtml(ed, g, gi, photos, paragraphs)).join("")
    : `<div class="empty-note">正在自動排版中…</div>`;
  return `
    <div class="photo-list-drop" id="photosList">
      <div class="photo-groups">${groupsHtml}</div>
      <button type="button" class="add-photo-btn" data-add-photo="1">${iconUpload()}<span>新增照片</span></button>
    </div>
  `;
}

function bindPhotoGroups(ed){
  const wrap = document.getElementById("photosList");
  if(!wrap) return;

  // 新增/刪除/拖曳排序照片都只重畫「內文照片」這一小塊＋用既有的 iframe
  // 重新排版，不整個重畫案例編輯畫面——不然連 4 個預覽框都要跟著重新
  //載入一次，會很卡。
  const refresh = () => {
    delete ed.item.photoLayout; // 張數或順序變了，舊分組跟著失效，回退重新自動排一次
    refreshPhotoGroups(ed);
    ensurePhotoLayout(ed);
  };

  wrap.querySelectorAll("[data-remove-photo]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.removePhoto, 10);
      ed.item.photos.splice(i, 1);
      refresh();
    });
  });

  const addBtn = wrap.querySelector("[data-add-photo]");
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = "image/*,video/*"; fileInput.multiple = true; fileInput.style.display = "none";
  addBtn.after(fileInput);
  addBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => addPhotoFiles(ed, "photos", Array.from(fileInput.files), refresh));
  ["dragover","dragenter"].forEach(evt => wrap.addEventListener(evt, e => { e.preventDefault(); wrap.classList.add("drag-over"); }));
  ["dragleave","drop"].forEach(evt => wrap.addEventListener(evt, e => { e.preventDefault(); wrap.classList.remove("drag-over"); }));
  wrap.addEventListener("drop", e => {
    const files = Array.from(e.dataTransfer.files || []).filter(isImageOrVideoFile);
    if(files.length) addPhotoFiles(ed, "photos", files, refresh);
  });

  // 照片可以跨群組拖曳交換順序——直接動底層陣列順序，分組整個交給
  // 自動排版重新算一次，不用另外處理「合併/拆開群組」的邏輯
  let dragIndex = null;
  wrap.querySelectorAll("[data-photo-index]").forEach((row) => {
    row.addEventListener("dragstart", () => { dragIndex = parseInt(row.dataset.photoIndex, 10); });
    row.addEventListener("dragover", (e) => { e.preventDefault(); e.stopPropagation(); row.classList.add("drag-target"); });
    row.addEventListener("dragleave", () => row.classList.remove("drag-target"));
    row.addEventListener("drop", (e) => {
      e.stopPropagation();
      row.classList.remove("drag-target");
      const toIndex = parseInt(row.dataset.photoIndex, 10);
      if(dragIndex == null || dragIndex === toIndex) return;
      reorderPhotos(ed, "photos", dragIndex, toIndex);
      dragIndex = null;
      refresh();
    });
  });

  wrap.querySelectorAll("[data-group-template]").forEach((sel) => {
    sel.addEventListener("change", () => {
      setGroupTemplate(ed, Number(sel.dataset.groupTemplate), sel.value);
      postCaseProjectToIframe(ed);
    });
  });
  wrap.querySelectorAll("[data-group-after]").forEach((sel) => {
    sel.addEventListener("change", () => {
      const layout = getValidPhotoLayout(ed);
      const gi = Number(sel.dataset.groupAfter);
      if(layout && layout[gi]) layout[gi].afterParagraph = Number(sel.value);
      postCaseProjectToIframe(ed);
    });
  });
}

function refreshPhotoGroups(ed){
  const block = document.getElementById("photosFieldBlock");
  if(!block) return;
  block.innerHTML = photoGroupsHtml(ed);
  bindPhotoGroups(ed);
  bindPathInputs(ed, block); // 圖說輸入框是新插入的 DOM，要重新綁一次才會有作用
}

function pickImageFile(cb){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*,video/*";
  input.addEventListener("change", () => { if(input.files[0]) cb(input.files[0]); });
  input.click();
}

function handleCaseEdit(ed, data){
  if(data.field === "title"){ ed.item.title = data.value; return; }
  if(data.field === "ledeMeta"){ ed.item.ledeMeta = data.value; return; }
  if(data.field === "paragraph"){
    ed.item.paragraphs = ed.item.paragraphs || [];
    ed.item.paragraphs[data.index] = data.value;
    const ta = document.getElementById("paragraphsText");
    if(ta) ta.value = ed.item.paragraphs.join("\n\n");
    return;
  }
  if(data.field === "hero-replace"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      ed.pendingUploads[key] = { file, previewUrl: URL.createObjectURL(file) };
      ed.item.hero = key;
      postCaseProjectToIframe(ed);
    });
    return;
  }
  if(data.field === "hero-position"){
    // 拖曳結束後，iframe 裡的照片位置早就已經即時更新過了，這裡只是
    // 把最終結果記到 ed.item 裡準備存檔，不用整個重畫 iframe。
    ed.item.heroPosition = data.value;
    return;
  }
  if(data.field === "external-cover-replace"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      ed.pendingUploads[key] = { file, previewUrl: URL.createObjectURL(file) };
      ed.item.externalUrlCover = key;
      postCaseProjectToIframe(ed);
    });
    return;
  }
  if(data.field === "external-cover-position"){
    ed.item.externalUrlCoverPosition = data.value;
    return;
  }
  if(data.field === "photo-replace"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      const previewUrl = URL.createObjectURL(file);
      ed.pendingUploads[key] = { file, previewUrl };
      ed.item.photos[data.index].src = key;
      postCaseProjectToIframe(ed);
      syncCompactThumb("photosList", data.index, previewUrl);
    });
    return;
  }
  if(data.field === "gallery-photo-replace"){
    // More in Detail 底下「照片」「圖面」兩區都是同樣的扁平陣列
    // ({src, caption})，data.kind 是 "detailPhotos" 或 "drawings"。
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      const previewUrl = URL.createObjectURL(file);
      ed.pendingUploads[key] = { file, previewUrl };
      ed.item[data.kind][data.photoIndex].src = key;
      syncCompactThumb(data.kind === "drawings" ? "drawingsList" : "detailPhotosList", data.photoIndex, previewUrl);
      postCaseProjectToIframe(ed);
    });
    return;
  }
  // 以下這幾種是「新增全新內容」——直接在即時預覽裡按「+」就能開始，
  // 不用先跑去下面的清單新增第一筆才有東西可以點。走跟清單上那些
  // 「新增」按鈕完全一樣的路徑（rerenderCurrentEditor 整個重畫，
  // iframe 會跟著重新載入、自動同步最新內容）。
  if(data.field === "paragraph-add"){
    ed.item.paragraphs = ed.item.paragraphs || [];
    ed.item.paragraphs.push("");
    rerenderCurrentEditor();
    return;
  }
  if(data.field === "photo-add"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      ed.pendingUploads[key] = { file, previewUrl: URL.createObjectURL(file) };
      ed.item.photos = ed.item.photos || [];
      ed.item.photos.push({ src: key, caption: "" });
      rerenderCurrentEditor();
    });
    return;
  }
  if(data.field === "gallery-photo-add"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      ed.pendingUploads[key] = { file, previewUrl: URL.createObjectURL(file) };
      ed.item[data.kind] = ed.item[data.kind] || [];
      ed.item[data.kind].push({ src: key, caption: "" });
      rerenderCurrentEditor();
    });
    return;
  }
}

function renderCaseEditor(){
  const ed = state.editingCase;
  if(ed.item.type === "external"){ renderExternalCaseEditor(ed); return; }
  app.innerHTML = `${renderTopBar()}<div class="wrap">${caseEditorHtml(ed)}</div>`;
  document.getElementById("logoutBtn").addEventListener("click", logout);
  document.getElementById("backBtn").addEventListener("click", closeCaseEditor);
  document.getElementById("convertTypeBtn").addEventListener("click", () => convertCaseType(ed, "external"));
  const deleteBtn = document.getElementById("deleteBtn");
  if(deleteBtn) deleteBtn.addEventListener("click", deleteCurrentCase);

  bindPathInputs(ed, app);

  // 四個分區各自一個 iframe，各自載入完就送目前內容過去，並且只在「這個
  // iframe 自己第一次」渲染完後捲到自己負責的區塊——不用使用者自己找，
  // 之後使用者在裡面手動滾動看別的部分也不會被強制拉回去。
  // 每次整頁重畫（開啟編輯器、或新增段落/照片這類會整個重畫的操作）都是
  // 全新的 4 個 iframe，「已經裁切過」的狀態要重置，不然新 iframe 永遠
  // 不會裁切、會整頁露出來
  ed._previewFocused = {};
  CASE_PREVIEW_BLOCKS.forEach((block) => {
    const frame = document.getElementById("preview_" + block.key);
    if(!frame) return;
    frame.addEventListener("load", () => postCaseProjectToIframe(ed));
  });

  document.getElementById("paragraphsText").addEventListener("input", (e) => {
    ed.item.paragraphs = e.target.value
      .split(/\n\s*\n/)
      .map((s) => s.trim())
      .filter(Boolean);
    postCaseProjectToIframe(ed);
    if(ed.isNew) refreshNewCaseGuide(ed);
  });

  const folder = () => `images/${ed.item.slug || "tmp"}`;
  const externalPicker = document.querySelector("[data-external-case-picker]");
  if(externalPicker){
    externalPicker.addEventListener("change", () => {
      const picked = (state.cases || []).find((it) => it.slug === externalPicker.value);
      if(!picked) return;
      ed.item.externalUrl = picked.externalUrl || "";
      ed.item.externalUrlCover = picked.hero || "";
      rerenderCurrentEditor();
    });
  }
  bindPhotoGroups(ed);
  bindPhotoList(ed, "drawings", "drawingsList", folder(), () => refreshDrawingsList(ed, folder()));
  bindPhotoList(ed, "detailPhotos", "detailPhotosList", folder(), () => refreshDetailPhotosList(ed, folder()));

  ensurePhotoLayout(ed);

  document.getElementById("saveBtn").addEventListener("click", () => saveCaseEditor(ed));
}

/* 新案例不用自己打網址代號（slug）——這是給網址跟照片資料夾用的內部
   代號，一般使用者不需要理解這個概念，存檔時用案名自動翻成英文、轉成
   網址格式，重複的話自動加編號 */
// existingSlugs：要避開撞名的既有 slug 清單；fallbackBase：翻譯失敗時用的
// 預設前綴（案例用「case」、子頁面用「page」）。案例／子頁面兩種「新增」流程
// 共用同一套「用標題自動翻譯出英文網址代號」邏輯，只是各自傳進不同的既有
// 清單跟預設前綴。
async function generateUniqueSlug(title, existingSlugs, fallbackBase){
  let base = "";
  try{
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=en&dt=t&q=" + encodeURIComponent(title);
    const r = await fetch(url);
    const j = await r.json();
    base = (j[0] || []).map((seg) => seg[0]).join("");
  }catch(e){ /* 翻譯失敗就退回用預設前綴的編號 */ }
  base = base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  if(!base) base = fallbackBase || "item";
  const existing = new Set(existingSlugs || []);
  let slug = base;
  let i = 2;
  while(existing.has(slug)){
    slug = `${base}-${i}`;
    i++;
  }
  return slug;
}

async function saveCaseEditor(ed){
  if(!ed.item.title){ toast("請至少填寫案名", true); return; }

  let slug;
  if(ed.isNew){
    try{
      setLoading(true, "產生案例編號中…");
      slug = await generateUniqueSlug(ed.item.title, (state.cases || []).map((c) => c.slug), "case");
    }catch(err){
      toast("建立案例失敗：" + err.message, true);
      setLoading(false);
      return;
    }
  } else {
    // 保險：正常情況下兩種編輯畫面（一般子網頁／外部連結網頁）都會渲染
    // #f_slug 這個唯讀欄位，這裡退回 ed.item.slug 是防止未來畫面改版時
    // 漏放這個欄位又沒人發現——沒有這個保險的話，讀不到元素會直接丟出
    // TypeError，儲存流程整個中斷、畫面上卻沒有任何錯誤提示。
    const slugEl = document.getElementById("f_slug");
    slug = slugEl ? slugEl.value.trim() : ed.item.slug;
  }
  ed.item.slug = slug;

  const publishedEl = app.querySelector("[data-published-toggle]");
  ed.item.published = publishedEl ? publishedEl.checked : true;

  // 下架的案例不該出現在任何章節的卡片列表裡——不管畫面上章節勾選框
  // 目前是什麼狀態，實際同步一律當作「什麼都沒勾」，讓下面的
  // toRemove 邏輯把它從所有已連結的章節移除。畫面上的勾選框保留原樣
  // （不強制取消勾選），這樣重新勾選「上架」時，使用者不用重新勾一次
  // 想要的章節。
  const selectedChapters = ed.item.published
    ? Array.from(app.querySelectorAll("[data-add-to-chapter]:checked")).map((el) => el.dataset.addToChapter)
    : [];
  const originalChapters = ed.linkedChapters || [];
  const toAdd = selectedChapters.filter((c) => !originalChapters.includes(c));
  const toRemove = originalChapters.filter((c) => !selectedChapters.includes(c));

  try{
    setLoading(true, "儲存中…");
    await flushPendingUploads(ed, `images/${slug}`);

    let cardThumbnail = null;
    if(selectedChapters.length){
      setLoading(true, "產生章節卡片縮圖中…");
      try{
        cardThumbnail = await ensureCardThumbnail(ed);
      }catch(e){
        console.error("ensureCardThumbnail failed", e);
        // 縮圖產生失敗不該擋住整個存檔流程，退回用原始大圖當卡片圖
      }
    }

    setLoading(true, "儲存中…");
    const json = JSON.stringify(ed.item, null, 2) + "\n";
    await ghPutFile(`content/projects/${slug}.json`, utf8ToBase64(json), `Update case ${slug} via admin`, ed.sha);

    if(selectedChapters.length || toRemove.length){
      let label = { "zh-Hant": ed.item.title };
      if(selectedChapters.length){
        setLoading(true, "翻譯案例卡片標題中…");
        label = await translateCaseCardLabel(ed.item.title);
      }
      setLoading(true, "同步主網站章節中…");
      // 同一個案例在不同章節可能連的是不同網址（見 caseHrefForChapter
      // ——原型數位這種 preferExternal 章節連外部網址，其他章節連內頁），
      // 所以 href 要在迴圈裡逐章節算，不能在外面算一次共用。不只是「新
      // 勾選的章節」才同步——本來就勾選、這次繼續勾選的章節也要一起跑
      // 一次，這樣縮圖/標題改了才會真的反映到章節卡片上（見
      // addCaseCardToChapter 的說明：已存在的卡片會被更新，不是靜默跳過）。
      // 如果這次存檔把「外部連結網址」改掉了（該章節的 href 因此變了），
      // 已經連結的章節卡片是用舊網址比對的，要先用舊網址移除，不然會
      // 留下一筆用舊網址、更新不到的孤兒卡片，而不是把它換成新網址。
      for(const chName of selectedChapters){
        const meta = CASE_CARD_CHAPTERS.find((c) => c.name === chName);
        if(!meta) continue;
        const href = caseHrefForChapter(ed.item, meta);
        const oldEntry = (ed.linkedChapterHrefs || []).find((e) => e.name === chName);
        const oldHref = oldEntry ? oldEntry.href : href;
        const card = {
          image: `https://as-studio001.github.io/Internal-Pages/${cardThumbnail || ed.item.hero}`,
          href,
          label,
        };
        if(oldHref !== href) await removeCaseCardFromChapter(meta, oldHref);
        await addCaseCardToChapter(meta, card);
      }
      for(const chName of toRemove){
        const meta = CASE_CARD_CHAPTERS.find((c) => c.name === chName);
        if(!meta) continue;
        const oldEntry = (ed.linkedChapterHrefs || []).find((e) => e.name === chName);
        const oldHref = oldEntry ? oldEntry.href : caseHrefForChapter(ed.item, meta);
        await removeCaseCardFromChapter(meta, oldHref);
      }
    }

    setLoading(true, "同步漢堡選單中…");
    await regenerateCaseLinksManifest();

    toast("已發布，網站幾分鐘內會更新");
    setLoading(true, "重新載入清單中…");
    await loadCaseList();
    closeCaseEditor();
  }catch(err){
    toast("儲存失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

// 案例勾選同步進章節卡片時，把繁中標題自動翻成其他 4 語言，寫進卡片的
// label——跟 lang5Html 那顆「自動翻譯其他語言」按鈕背後（見上面的
// translateLang5）用同一個 Google Translate 端點，只是這裡不依賴編輯器
// 狀態（ed/basePath/setPath），純粹字串進、Lang5 物件出，因為呼叫點在
// 存檔流程裡，不是使用者手動按鈕觸發。
//
// 2026-08-26：改成每次同步都重新翻譯，而不是仰賴「使用者事後自己跑去
// 章節編輯器手動翻譯」——因為那樣翻的譯文存不住：這張案例只要之後被
// 重新存檔一次（哪怕只是改內文，沒動標題），下面 addCaseCardToChapter
// 就會把整筆卡片（含手動翻好的譯文）直接覆蓋掉，變回只有繁中。這裡讓
// 翻譯永遠伴隨同步一起發生，跟目前標題保持同步，不會過期也不會被覆蓋
// 掉。單一語言翻譯失敗就先用繁中頂著那個語言欄位，不留空白。
async function translateCaseCardLabel(title){
  const label = { "zh-Hant": title };
  const targets = ["zh-Hans", "en", "ja", "ko"];
  await Promise.all(targets.map(async (t) => {
    try{
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=" + t + "&dt=t&q=" + encodeURIComponent(title);
      const r = await fetch(url);
      const json = await r.json();
      const translated = (json[0] || []).map(seg => seg[0]).join("");
      label[t] = translated || title;
    }catch(e){
      label[t] = title;
    }
  }));
  return label;
}

// 把一張案例卡片加進（或更新）某個章節的 cases 清單——用連結（href）當
// 比對依據：清單裡已經有相同連結的卡片，就整筆換成最新內容（縮圖、標題
// 可能改過了），不是靜默跳過；沒有的話才新增。內容如果完全沒變就不寫檔，
// 避免每次案例存檔（就算只是改內文，沒動到縮圖/標題）都留下一筆沒意義
// 的 chapter commit。
// 2026-08-25 修正：原本存在相同連結就直接 return 不更新，導致案例的
// 縮圖/標題改了之後，已經連結到章節的卡片永遠停留在「第一次勾選當下」
// 的舊內容——這是「原型建築（asarch）頁面上舊案例縮圖換不掉」問題的
// 根本原因，因為 asarch 是讀這裡的章節卡片資料，不是直接讀案例本身。
async function addCaseCardToChapter(meta, card){
  const { json, sha } = await ghGetFile(meta.file);
  json.cases = json.cases || [];
  const idx = json.cases.findIndex((c) => c.href === card.href);
  if(idx !== -1 && JSON.stringify(json.cases[idx]) === JSON.stringify(card)) return;
  if(idx === -1) json.cases.push(card);
  else json.cases[idx] = card;
  const body = JSON.stringify(json, null, 2) + "\n";
  await ghPutFile(meta.file, utf8ToBase64(body), `${idx === -1 ? "Add" : "Update"} case card via admin`, sha);
}

/* 取消勾選某個章節時，把對應的卡片從那個章節移除——這樣「顯示在主網站
   章節」這排勾選框就是雙向的：勾上會加、取消勾選會移除，不用再跑去
   「主網站內容」手動刪 */
async function removeCaseCardFromChapter(meta, href){
  const { json, sha } = await ghGetFile(meta.file);
  const cases = json.cases || [];
  const next = cases.filter((c) => c.href !== href);
  if(next.length === cases.length) return;
  json.cases = next;
  const body = JSON.stringify(json, null, 2) + "\n";
  await ghPutFile(meta.file, utf8ToBase64(body), `Remove case card via admin`, sha);
}

// 原型建築網站（asarch）漢堡選單裡的案例連結不再另外開一個編輯區維護，
// 而是每次案例存檔／刪除後，直接照目前實際狀況重新產生這份清單——但
// 不是「隨便一筆案例」都算：只有連結到 CASE_CARD_CHAPTERS 裡
// hamburger:true 那幾個章節的案例才會進漢堡選單（原型數位是
// hamburger:false，就算案例有勾選連結原型數位，也不會單靠這樣就出現在
// 選單裡）。新增/移除章節連結，漢堡選單就自動跟著多一條/少一條，不需要
// 額外手動同步。asarch 那邊讀這個檔案失敗時會退回它自己原始碼裡的一份
// 備援清單（只有「原型首頁」是永遠固定的那一條，不在這份清單裡）。
async function regenerateCaseLinksManifest(){
  try{
    const eligibleHrefs = new Set();
    for(const meta of CASE_CARD_CHAPTERS){
      if(!meta.hamburger) continue;
      try{
        const { json } = await ghGetFile(meta.file);
        (json.cases || []).forEach((c) => eligibleHrefs.add(c.href));
      }catch(e){ /* 忽略單一章節讀取失敗，不擋住整個重新產生流程 */ }
    }
    const entries = await ghListDir("content/projects");
    const files = entries.filter(e => e.type === "file" && e.name.endsWith(".json"));
    const items = await Promise.all(files.map(async f => {
      try{
        const { json } = await ghGetFile(f.path);
        return { slug: json.slug || f.name.replace(/\.json$/, ""), title: json.title || "", externalUrl: json.externalUrl || "", type: json.type || "subpage" };
      }catch(e){ return null; }
    }));
    const links = items
      .filter(it => it && it.title)
      .map(it => ({ label: it.title, href: caseTargetHref(it.slug, it.externalUrl, it.type) }))
      .filter((l) => eligibleHrefs.has(l.href));
    const body = JSON.stringify({ links }, null, 2) + "\n";
    let sha = null;
    try{
      const existing = await ghGetFile("content/site/case-links.json");
      sha = existing.sha;
      // 內容跟現有的完全一樣就不寫——這步幾乎每次案例存檔／刪除都會跑，
      // 但大部分時候（例如只是改案例內文，沒動到任何章節連結）算出來的
      // 清單其實跟已經存在的一模一樣，不寫就能省一次 Netlify 呼叫，也
      // 少留一筆沒意義的 commit（跟 addCaseCardToChapter 同一種省法）。
      // 比對用解析後的物件（existing.json），不直接比對檔案原始字串，
      // 避免因為格式化差異（例如換行符號）誤判成「內容不一樣」。
      if(JSON.stringify(existing.json.links || []) === JSON.stringify(links)) return;
    }catch(e){ /* 檔案還不存在就當新建，sha 留 null，一定要寫 */ }
    await ghPutFile("content/site/case-links.json", utf8ToBase64(body), "Regenerate hamburger-menu case links via admin", sha);
  }catch(e){
    // 這份清單同步失敗不該擋住案例本身的存檔/刪除流程，記錄下來就好
    console.error("regenerateCaseLinksManifest failed", e);
  }
}

async function deleteCurrentCase(){
  if(!confirm("確定要刪除這個案例嗎？這個動作沒辦法復原。")) return;
  const ed = state.editingCase;
  try{
    setLoading(true, "刪除中…");
    await ghDeleteFile(`content/projects/${ed.item.slug}.json`, `Delete case ${ed.item.slug} via admin`, ed.sha);
    // 案例檔案刪掉了，但如果它本來有連結章節，那些章節的 CASES 卡片
    // 不會自己跟著消失——不清掉的話，卡片會變成一張連到已經不存在的
    // 案例的孤兒卡片，前台點下去會看到「找不到這個案例」。
    for(const chName of (ed.linkedChapters || [])){
      const meta = CASE_CARD_CHAPTERS.find((c) => c.name === chName);
      if(!meta) continue;
      const oldEntry = (ed.linkedChapterHrefs || []).find((e) => e.name === chName);
      const href = oldEntry ? oldEntry.href : caseHrefForChapter(ed.item, meta);
      await removeCaseCardFromChapter(meta, href);
    }
    await regenerateCaseLinksManifest();
    toast("已刪除");
    await loadCaseList();
    closeCaseEditor();
  }catch(err){
    toast("刪除失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

/* ============================================================
   子頁面編輯器（原型教學等，content/subpages/<slug>.json）——做法比照
   「主網站內容」章節編輯器，不是案例編輯器：一般的表單欄位（拖拉/點擊
   上傳照片、文字輸入框），不是即時預覽 iframe。子頁面的 .dc.html 原始
   檔在另一個 repo（asstudiowebsite），沒辦法像案例編輯器那樣直接嵌一個
   會即時重繪的頁面進來，而且維護者操作習慣也是比較直覺的表單，所以照
   章節編輯器的模式做：coverDropHtml／bindCoverDropEvents（單張照片拖拉
   上傳，跟 heroPhoto／mainPhoto 同一個元件）、imageListHtml／bindImageList
   （多張照片清單，跟章節 thumbnails 同一個元件）、data-path 文字欄位
   （bindPathInputs 直接寫回 ed.item，不用整頁重畫）。

   這次只把「橫向滑塊畫廊」跟「內文段落」做進來（見 teaching.json 的
   schema），時間軸／手風琴／案例輪播／得獎清單這些只有少數子頁才有的
   特殊模組還沒做，之後要做哪一頁再個別設計。
   ============================================================ */
// uploadAsset() 只回傳相對於「這個後台」repo 的路徑（例如
// "images/subpages/teaching/xxx.jpg"），子頁面實際部署在另一個 repo／
// 網域（asstudiowebsite），畫廊照片的舊資料則是相對於「子頁面自己網站」
// 的路徑（例如 "uploads/實習.jpg"）——兩種相對路徑的基準網址不一樣，不能
// 都用 resolveSrc()／rawUrl()（那個只認得 Internal-Pages 自己的網址），
// 這裡另外寫一個專門給子頁面用的版本，正確分流三種情況。
function resolveSubpagePhotoSrc(ed, value){
  if(!value) return "";
  if(ed.pendingUploads[value]) return ed.pendingUploads[value].previewUrl;
  if(/^https?:\/\//.test(value)) return value;
  return `${SUBPAGE_SITE_BASE}/${value.split("/").map(encodeURIComponent).join("/")}`;
}

// 存檔前把「剛剛才上傳、現在是相對於後台 repo 的路徑」轉成完整網址，
// 否則子頁面渲染時會把它當成相對於子頁面自己網站的路徑去抓、404——
// 已經是完整網址、或子頁面自己網站既有的相對路徑（不是這次上傳產生的）
// 都不受影響，用固定的資料夾前綴（跟 saveSubpageEditor 傳給
// flushPendingUploads 的 folder 一致）判斷是不是「這次上傳的」。
const SUBPAGE_ASSET_PREFIX = "images/subpages/";
function absolutizeSubpageAssetPaths(obj){
  if(Array.isArray(obj)){
    obj.forEach((v, i) => {
      if(typeof v === "string" && v.startsWith(SUBPAGE_ASSET_PREFIX)) obj[i] = "https://as-studio001.github.io/Internal-Pages/" + v;
      else if(v && typeof v === "object") absolutizeSubpageAssetPaths(v);
    });
    return;
  }
  if(obj && typeof obj === "object"){
    Object.keys(obj).forEach((k) => {
      const v = obj[k];
      if(typeof v === "string" && v.startsWith(SUBPAGE_ASSET_PREFIX)) obj[k] = "https://as-studio001.github.io/Internal-Pages/" + v;
      else if(v && typeof v === "object") absolutizeSubpageAssetPaths(v);
    });
  }
}

// 捲動目標下拉選單的選項：用內文段落（sections）目前的中文標題當選項文字，
// 值還是存段落的 id（跟原本文字框存的東西一樣，畫面上只是換成挑標題、
// 不用自己記/打 id）。如果目前存的 target 對不到任何一段（例如段落被刪
// 掉、改過 id），額外加一個選項把原始值原封不動列出來，不會靜默把資料
// 洗掉，讓維護者自己決定要不要換掉。
function sectionOptionLabel(s, si){
  if(s.type === "heading") return s.text || "（空白標題）";
  return (SECTION_TYPE_LABELS[s.type] || s.type) + " #" + si;
}

// 捲動目標下拉選單的選項：內容段落（不含 sections[0] 照片滑塊本身，捲到自己
// 沒有意義）都可以當目標，標題段落用它自己的文字當選項文字比較好認，其他
// 類型用「類型名稱 + 第幾段」代替（它們沒有單一一行文字可以代表自己）。
function galleryTargetOptionsHtml(ed, currentTarget){
  const secs = getPath(ed.item, "sections") || [];
  const contentSecs = secs.slice(1).map((s, i) => ({ s, si: i + 1 }));
  const known = contentSecs.some(({ s }) => s.id === currentTarget);
  const options = [`<option value="">（不捲動）</option>`];
  contentSecs.forEach(({ s, si }) => {
    options.push(`<option value="${esc(s.id)}" ${s.id === currentTarget ? "selected" : ""}>${esc(sectionOptionLabel(s, si))}</option>`);
  });
  if(currentTarget && !known){
    options.push(`<option value="${esc(currentTarget)}" selected>${esc(currentTarget)}（找不到對應段落）</option>`);
  }
  return options.join("");
}

// 通用的「拖曳調整順序」小工具：container 底下每個符合 itemSelector 的直接
// 子元素都可以被拖曳，但只能從 handleSelector 那個把手開始拖（用 dragstart
// 時判斷事件目標是不是在把手裡面，不是就 preventDefault 擋掉），避免點文字框
// /文字時不小心也觸發拖曳。拖曳中即時把元素在 DOM 裡搬動位置，讓使用者立刻
// 看到排列結果；放開滑鼠（drop）才讀最終的 DOM 順序（每個項目的 data-sort-key）
// 回傳給 onReorder 去更新實際資料。不依賴任何外部套件，純 HTML5 原生 API。
function makeSortable(container, itemSelector, handleSelector, onReorder){
  if(!container) return;
  let dragEl = null;
  const items = () => Array.from(container.children).filter((el) => el.matches(itemSelector));
  // 讀目前 DOM 的順序存起來，drop 觸發時呼叫一次；如果 drop 沒觸發（見下面
  // dragend 的說明），dragEl 還留著，dragend 收尾時也會呼叫到這裡，用「畫面
  // 上已經拖成的樣子」補救性存一次，避免看起來排好了、資料卻沒真的存到。
  const commitOrder = () => {
    if(!dragEl) return;
    onReorder(items().map((el) => el.dataset.sortKey));
  };
  items().forEach((el) => {
    // 一開始不是 draggable，只有真的按住「把手」才暫時打開，放開/拖完就關掉——
    // 子頁面編輯器有兩層拖曳（段落本身、段落內的小標題/內文/照片互相嵌套），
    // 如果兩層同時都是 draggable=true，瀏覽器對「巢狀 draggable 元素」原生支援
    // 並不穩定（實測會整個卡住、dragover/drop 完全不觸發），所以任何時刻最多
    // 只讓使用者剛按下把手的那一層變成 draggable，兩層不會同時成立。
    // 另外每個事件都呼叫 e.stopPropagation()：nested 兩層各自都掛了同一組
    // 監聽器，drag 事件會往上冒泡，不擋住的話內層的 dragstart/dragover/drop
    // 會連外層（例如段落卡片本身）的同一套邏輯也一起觸發，把外層的 dragEl
    // 弄亂。
    el.draggable = false;
    const handle = el.querySelector(handleSelector);
    if(handle){
      handle.addEventListener("mousedown", (e) => { el.draggable = true; e.stopPropagation(); });
    }
    el.addEventListener("dragstart", (e) => {
      e.stopPropagation();
      dragEl = el;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", ""); }catch(err){ /* Firefox 需要至少設一次資料才會真的啟動拖曳 */ }
    });
    el.addEventListener("dragend", (e) => {
      e.stopPropagation();
      // 保險機制：正常情況 drop 事件會先呼叫 commitOrder() 把新順序存起來、
      // 順便把 dragEl 清空，這裡的 commitOrder() 因為 dragEl 已經是 null
      // 直接跳過，不會重複存兩次。但如果放開滑鼠那一刻游標剛好落在沒有正確
      // 接受 drop 的位置（drop 事件沒觸發），dragEl 這時還留著——因為
      // dragover 全程都在即時搬動 DOM，畫面上其實已經是排序後的樣子，資料
      // 卻還沒存到，兩邊會兜不起來（使用者以為排好了，其實存檔會存回舊順序）。
      // 這裡補呼叫一次 commitOrder()，用「畫面上已經拖成的樣子」存一次，
      // 確保放開滑鼠之後，看起來的樣子永遠等於真的存下來的東西。
      commitOrder();
      el.draggable = false;
      el.classList.remove("dragging");
      dragEl = null;
    });
    el.addEventListener("mouseup", (e) => { el.draggable = false; e.stopPropagation(); });
    // dragenter 也要擋（不只 dragover）：瀏覽器在游標剛進入一個新元素的那一刻
    // 先發 dragenter，沒被擋下來的話，有些情況下那個元素還沒被視為合法的放置
    // 目標，要等下一次 dragover 才會生效——兩個都擋才穩，尤其在項目高度差很大
    // （拖過去的路徑上一路都在同一個很高的項目範圍內，dragover 事件很密集但
    // 都對著同一個元素）時比較不會出現放開滑鼠卻沒有觸發 drop 的狀況。
    el.addEventListener("dragenter", (e) => {
      if(!dragEl || dragEl === el) return;
      e.preventDefault();
      e.stopPropagation();
    });
    el.addEventListener("dragover", (e) => {
      if(!dragEl || dragEl === el) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = el.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      el.parentNode.insertBefore(dragEl, before ? el : el.nextSibling);
    });
  });
  container.addEventListener("dragenter", (e) => { if(dragEl) e.preventDefault(); });
  container.addEventListener("dragover", (e) => { if(dragEl) e.preventDefault(); });
  container.addEventListener("drop", (e) => {
    if(!dragEl) return;
    e.preventDefault();
    e.stopPropagation();
    commitOrder();
    dragEl = null; // 已經處理過，等一下 dragend 的 commitOrder() 會因為 dragEl 是 null 直接跳過
  });
}

// 段落是「一段一種功能」的扁平清單，不是「段落包多個區塊」——小標題／內文／
// 照片／垂直時間軸／水平時間軸／案例資訊卡／得獎清單，每段自己選一種，可以
// 自由新增任意數量、任意順序。sections[0] 固定是照片滑塊（gallery-slider），
// 不在這份可新增的類型清單裡，也不能被拖到別的位置或刪除——見
// gallerySectionCardHtml，它的排版跟編輯方式都跟其他段落完全不同，獨立處理。
const SECTION_TYPE_LABELS = {
  heading: "小標題",
  body: "內文",
  photos: "照片",
  "timeline-vertical": "垂直時間軸",
  "timeline-horizontal": "水平時間軸",
  "case-card": "案例資訊卡",
  "award-list": "得獎清單"
};
const SECTION_TYPE_OPTIONS = Object.keys(SECTION_TYPE_LABELS);

function blankSection(type){
  const id = "sc-section-custom-" + Date.now() + "-" + uid();
  if(type === "photos") return { id, type, layout: "grid", images: [] };
  if(type === "timeline-vertical" || type === "timeline-horizontal") return { id, type, items: [] };
  if(type === "case-card") return { id, type, title: "", photos: [], specZh: "", specEn: "" };
  if(type === "award-list") return { id, type, items: [] };
  return { id, type, text: "" };
}

// 垂直/水平時間軸段落裡「一筆一筆」的年份/標題/說明（或時期/事件/說明）——
// 跟照片滑塊、段落都是同一種「可新增/移除的清單」模式，獨立成小函式，兩種
// 時間軸共用同一份，差別只在傳進來的欄位定義（fields）。
function timelineItemsHtml(si, items, fields){
  const rows = items.map((it, ii) => `
    <div class="step-card" data-item-index="${ii}" style="margin-bottom:10px;">
      <div class="step-card-head">
        <span class="step-label">第 ${ii + 1} 筆</span>
        <button type="button" class="row-remove-btn" data-remove-titem="${ii}" title="移除">×</button>
      </div>
      ${fields.map(([key, label]) => `
        <div class="field-block" style="margin-bottom:8px;">
          <label>${label}</label>
          <input type="text" data-path="sections.${si}.items.${ii}.${key}" value="${esc(it[key] || "")}">
        </div>
      `).join("")}
    </div>
  `).join("");
  return `
    <div id="timelineItems_${si}">
      ${rows}
      <button type="button" class="add-photo-btn" data-add-titem="1">${iconUpload()}<span>新增一筆</span></button>
    </div>
  `;
}

function bindTimelineItems(ed, si){
  const container = document.getElementById(`timelineItems_${si}`);
  if(!container) return;
  const section = getPath(ed.item, `sections.${si}`);
  const items = section.items || (section.items = []);
  container.querySelectorAll("[data-remove-titem]").forEach((btn) => {
    btn.addEventListener("click", () => {
      items.splice(parseInt(btn.dataset.removeTitem, 10), 1);
      rerenderCurrentEditor();
    });
  });
  const addBtn = container.querySelector("[data-add-titem]");
  if(addBtn) addBtn.addEventListener("click", () => {
    items.push({});
    rerenderCurrentEditor();
  });
}

// 得獎清單逐筆的表單：num/year/name/tier/link 都是文字輸入框，photo 用跟
// 滑塊同一套 coverDropHtml 單張換圖元件。
function awardListItemsHtml(ed, si, items){
  const rows = items.map((it, ii) => `
    <div class="step-card award-item-row" data-item-index="${ii}" data-sort-key="${ii}" style="margin-bottom:10px;">
      <div class="step-card-head">
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="award-item-drag-handle" title="拖曳調整順序" style="cursor:grab; opacity:.5;">⠿</span>
          <span class="step-label">第 ${ii + 1} 筆${it.name ? "　" + esc(it.name) : ""}</span>
        </span>
        <button type="button" class="row-remove-btn" data-remove-awarditem="${ii}" title="移除">×</button>
      </div>
      <div style="display:flex; gap:14px; align-items:flex-start;">
        ${coverDropHtml(`sections.${si}.items.${ii}.photo`, resolveSubpagePhotoSrc(ed, it.photo), true)}
        <div style="flex:1">
          <div class="two-col">
            <div>
              <label>編號</label>
              <input type="text" data-path="sections.${si}.items.${ii}.num" value="${esc(it.num || "")}">
            </div>
            <div>
              <label>年份</label>
              <input type="text" data-path="sections.${si}.items.${ii}.year" value="${esc(it.year || "")}">
            </div>
          </div>
          <div class="field-block" style="margin-top:10px;">
            <label>獎項名稱</label>
            <input type="text" data-path="sections.${si}.items.${ii}.name" value="${esc(it.name || "")}">
          </div>
          <div class="two-col" style="margin-top:10px;">
            <div>
              <label>級別（例如「首獎」「佳作」，選填）</label>
              <input type="text" data-path="sections.${si}.items.${ii}.tier" value="${esc(it.tier || "")}">
            </div>
            <div>
              <label>連結網址（選填，沒填就顯示純文字）</label>
              <input type="text" data-path="sections.${si}.items.${ii}.link" value="${esc(it.link || "")}" placeholder="https://...">
            </div>
          </div>
        </div>
      </div>
    </div>
  `).join("");
  return `
    <div id="awardItems_${si}">
      ${rows}
      <button type="button" class="add-photo-btn" data-add-awarditem="1">${iconUpload()}<span>新增一筆</span></button>
    </div>
  `;
}

function bindAwardListItems(ed, si){
  const container = document.getElementById(`awardItems_${si}`);
  if(!container) return;
  const section = getPath(ed.item, `sections.${si}`);
  const items = section.items || (section.items = []);
  const folder = `${SUBPAGE_ASSET_PREFIX}${ed.slug}`;
  items.forEach((it, ii) => bindCoverDropEvents(ed, `sections.${si}.items.${ii}.photo`, folder));
  container.querySelectorAll("[data-remove-awarditem]").forEach((btn) => {
    btn.addEventListener("click", () => {
      items.splice(parseInt(btn.dataset.removeAwarditem, 10), 1);
      rerenderCurrentEditor();
    });
  });
  const addBtn = container.querySelector("[data-add-awarditem]");
  if(addBtn) addBtn.addEventListener("click", () => {
    items.push({ num: String(items.length + 1).padStart(2, "0"), year: "", name: "", tier: "", photo: "", link: "" });
    rerenderCurrentEditor();
  });
  // 拖曳調整清單順序：每筆的表單欄位（data-path、縮圖 id...）都是照它在陣列
  // 裡的位置（ii）編出來的，拖完一定要整頁重畫才會全部對到新順序，跟段落／
  // 時間軸拖曳排序是同一個道理。
  makeSortable(container, ".award-item-row", ".award-item-drag-handle", (newOrder) => {
    const reordered = newOrder.map((idxStr) => items[parseInt(idxStr, 10)]);
    items.length = 0;
    items.push(...reordered);
    rerenderCurrentEditor();
  });
}

// 每段的表單欄位，依 type 分派——heading/body 是文字輸入、photos/case-card
// 是圖片清單、timeline-*/award-list 是逐筆可增減清單。
function sectionFieldsHtml(ed, si, s){
  const type = s.type;
  if(type === "heading"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>標題文字</label>
        <input type="text" data-path="sections.${si}.text" value="${esc(s.text || "")}">
      </div>
      <div class="field-block" style="margin-bottom:0;">
        <label>大小</label>
        <select data-path="sections.${si}.level" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
          <option value="h2" ${s.level !== "h3" ? "selected" : ""}>一般標題</option>
          <option value="h3" ${s.level === "h3" ? "selected" : ""}>小標題（穿插在中間用的子標題）</option>
        </select>
      </div>
    `;
  }
  if(type === "body"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>內文文字</label>
        <textarea data-path="sections.${si}.text" style="min-height:120px">${esc(s.text || "")}</textarea>
      </div>
      <div class="field-block" style="margin-bottom:0;">
        <label>樣式</label>
        <select data-path="sections.${si}.style" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
          <option value="" ${s.style !== "emphasis" ? "selected" : ""}>一般內文</option>
          <option value="emphasis" ${s.style === "emphasis" ? "selected" : ""}>強調段（結語，字級更大、粗體、灰階）</option>
        </select>
      </div>
    `;
  }
  if(type === "photos"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>排版方式</label>
        <select data-path="sections.${si}.layout" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
          <option value="grid" ${s.layout !== "stack" ? "selected" : ""}>格狀排列（適合多張照片）</option>
          <option value="stack" ${s.layout === "stack" ? "selected" : ""}>直式堆疊（適合手繪圖這類要看清楚全圖的直式圖）</option>
        </select>
      </div>
      ${imageListHtml(ed, `sections.${si}.images`, `sectionPhotos_${si}`)}
    `;
  }
  if(type === "timeline-vertical") return timelineItemsHtml(si, s.items || [], [["year", "年份"], ["title", "標題"], ["desc", "說明"]]);
  if(type === "timeline-horizontal") return timelineItemsHtml(si, s.items || [], [["period", "時期"], ["event", "事件"], ["desc", "說明"]]);
  if(type === "case-card"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>案名</label>
        <input type="text" data-path="sections.${si}.title" value="${esc(s.title || "")}">
      </div>
      <div class="field-block" style="margin-bottom:10px;">
        <div class="label">照片（選填，展開卡片時顯示在規格文字上方）</div>
        ${imageListHtml(ed, `sections.${si}.photos`, `sectionCardPhotos_${si}`)}
      </div>
      <div class="field-block" style="margin-bottom:10px;">
        <label>中文規格（一行一項，例如「建築類型 / 住宅」，換行就會分行顯示）</label>
        <textarea data-path="sections.${si}.specZh" style="min-height:100px">${esc(s.specZh || "")}</textarea>
      </div>
      <div class="field-block">
        <label>英文規格（選填）</label>
        <textarea data-path="sections.${si}.specEn" style="min-height:100px">${esc(s.specEn || "")}</textarea>
      </div>
    `;
  }
  if(type === "award-list") return awardListItemsHtml(ed, si, s.items || []);
  return "";
}

// 照片滑塊固定當第 1 段：排版（橫向 hover-expand）、欄位都跟其他段落完全
// 不同，獨立一個卡片渲染，不透過 sectionFieldsHtml 那套 type 分派；也不能
// 被拖到別的位置或刪除，只有滑塊本身（items）可以自由增減。
function gallerySectionCardHtml(ed, gallerySection){
  const items = gallerySection.items || [];
  const rows = items.map((it, ii) => `
    <div class="step-card" data-gallery-index="${ii}">
      <div class="step-card-head">
        <span class="step-label">滑塊 ${ii + 1}</span>
        <button type="button" class="row-remove-btn" data-remove-gallery="${ii}" title="移除這個滑塊">×</button>
      </div>
      <div style="display:flex; gap:14px; align-items:flex-start;">
        ${coverDropHtml(`sections.0.items.${ii}.photo`, resolveSubpagePhotoSrc(ed, it.photo), true)}
        <div style="flex:1">
          <div class="two-col">
            <div>
              <label>編號</label>
              <input type="text" data-path="sections.0.items.${ii}.num" value="${esc(it.num || "")}">
            </div>
            <div>
              <label>捲動目標（點這個滑塊要捲到哪一段，選填）</label>
              <select data-path="sections.0.items.${ii}.target" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">${galleryTargetOptionsHtml(ed, it.target || "")}</select>
            </div>
          </div>
          <div class="two-col" style="margin-top:12px">
            <div>
              <label>中文標題</label>
              <input type="text" data-path="sections.0.items.${ii}.zh" value="${esc(it.zh || "")}">
            </div>
            <div>
              <label>英文副標</label>
              <input type="text" data-path="sections.0.items.${ii}.en" value="${esc(it.en || "")}">
            </div>
          </div>
        </div>
      </div>
    </div>
  `).join("");
  return `
    <div class="step-card section-card" data-section-fixed="gallery">
      <div class="step-card-head">
        <span class="step-label">第 1 段・照片滑塊（固定在最前面）</span>
      </div>
      <div id="galleryItemsList">
        ${rows}
        <button type="button" class="add-step-btn" data-add-gallery="1">${iconUpload()}<span>新增滑塊</span></button>
      </div>
    </div>
  `;
}

function bindGallerySection(ed){
  const gallerySection = getPath(ed.item, "sections.0");
  if(!gallerySection) return;
  const items = gallerySection.items || (gallerySection.items = []);
  const container = document.getElementById("galleryItemsList");
  if(!container) return;
  const folder = `${SUBPAGE_ASSET_PREFIX}${ed.slug}`;
  items.forEach((it, ii) => bindCoverDropEvents(ed, `sections.0.items.${ii}.photo`, folder));
  container.querySelectorAll("[data-remove-gallery]").forEach((btn) => {
    btn.addEventListener("click", () => {
      items.splice(parseInt(btn.dataset.removeGallery, 10), 1);
      rerenderCurrentEditor();
    });
  });
  const addBtn = container.querySelector("[data-add-gallery]");
  if(addBtn) addBtn.addEventListener("click", () => {
    const num = String(items.length + 1).padStart(2, "0");
    items.push({ num, zh: "", en: "", target: "", photo: "", textOverride: "#ffffff" });
    rerenderCurrentEditor();
  });
}

function sectionCardHtml(ed, si, s){
  const type = s.type;
  return `
    <div class="step-card section-card" data-section-index="${si}" data-sort-key="${si}">
      <div class="step-card-head">
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="section-drag-handle" title="拖曳調整段落順序">⠿</span>
          <span class="step-label">第 ${si + 1} 段・${SECTION_TYPE_LABELS[type] || type}</span>
        </span>
        <button type="button" class="row-remove-btn" data-remove-section="${si}" title="移除這段">×</button>
      </div>
      ${sectionFieldsHtml(ed, si, s)}
    </div>
  `;
}

function sectionsHtml(ed){
  const secs = getPath(ed.item, "sections") || [];
  const gallerySection = secs[0];
  const contentSections = secs.slice(1);
  const galleryCard = gallerySection ? gallerySectionCardHtml(ed, gallerySection) : "";
  const contentCards = contentSections.map((s, i) => sectionCardHtml(ed, i + 1, s)).join("");
  return `
    ${galleryCard}
    <div id="contentSectionsList">${contentCards}</div>
    <div style="display:flex; gap:8px; align-items:center; margin-top:10px;">
      <select id="addSectionType" style="padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
        ${SECTION_TYPE_OPTIONS.map((t) => `<option value="${t}">${SECTION_TYPE_LABELS[t]}</option>`).join("")}
      </select>
      <button type="button" class="add-step-btn" data-add-section="1">${iconUpload()}<span>新增段落</span></button>
    </div>
  `;
}

function bindSections(ed){
  const secs = getPath(ed.item, "sections") || [];
  const contentSections = secs.slice(1);
  const folder = `${SUBPAGE_ASSET_PREFIX}${ed.slug}`;
  const contentContainer = document.getElementById("contentSectionsList");

  contentSections.forEach((s, i) => {
    const si = i + 1;
    if(s.type === "photos") bindImageList(ed, `sections.${si}.images`, `sectionPhotos_${si}`, folder);
    if(s.type === "case-card") bindImageList(ed, `sections.${si}.photos`, `sectionCardPhotos_${si}`, folder);
    if(s.type === "timeline-vertical" || s.type === "timeline-horizontal") bindTimelineItems(ed, si);
    if(s.type === "award-list") bindAwardListItems(ed, si);
  });

  if(contentContainer){
    contentContainer.querySelectorAll("[data-remove-section]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if(!confirm("確定要移除這一段嗎？")) return;
        secs.splice(parseInt(btn.dataset.removeSection, 10), 1);
        rerenderCurrentEditor();
      });
    });
    // 段落彼此之間的順序調整：sections[0]（照片滑塊）固定不參與這個拖曳容器，
    // 永遠留在最前面；「第 N 段」標籤跟每段表單欄位的 id 都是按陣列位置編
    // 出來的，拖完一定要整頁重畫。
    makeSortable(contentContainer, ".section-card", ".section-drag-handle", (newOrder) => {
      const reordered = newOrder.map((idxStr) => secs[parseInt(idxStr, 10)]);
      secs.length = 1;
      secs.push(...reordered);
      rerenderCurrentEditor();
    });

function renderSubpageEditor(){
  const ed = state.editingSubpage;
  app.innerHTML = `
    ${renderTopBar()}
    <div class="wrap wrap-wide">${subpageEditorHtml(ed)}</div>
  `;
  document.getElementById("backBtn").addEventListener("click", closeSubpageEditor);
  bindPathInputs(ed, app);
  bindGallerySection(ed);
  bindSections(ed);
  const refreshBtn = document.getElementById("refreshPreviewBtn");
  if(refreshBtn) refreshBtn.addEventListener("click", () => {
    const frame = document.getElementById("subpagePublishedPreview");
    if(!frame) return;
    // 跨網域（admin 跟子頁面網站不同源）不能直接呼叫 iframe 內部的 reload()，
    // 改成在網址後面加一個每次都不同的參數逼瀏覽器真的重新抓一次，不要因為
    // 網址字串完全沒變、又剛好命中瀏覽器快取而看起來像沒重新整理。
    const base = frame.dataset.baseSrc || frame.src;
    frame.dataset.baseSrc = base;
    const sep = base.includes("?") ? "&" : "?";
    frame.src = base + sep + "_r=" + Date.now();
  });
  document.getElementById("saveSubpageBtn").addEventListener("click", () => saveSubpageEditor(ed));
  const deleteBtn = document.getElementById("deleteSubpageBtn");
  if(deleteBtn) deleteBtn.addEventListener("click", deleteCurrentSubpage);
}

// 刪除子頁面：一定會刪掉 Internal-Pages 裡的 JSON 資料（這步用的是一直
// 都穩定的預設路徑寫入，不受跨 repo 問題影響）；asstudiowebsite 上對應
// 的 .dc.html 用「盡量刪、刪不掉不擋住整個操作」的方式處理——找不到檔案
// （代表原本就沒真的建立成功，例如卡在額度問題那段期間新增的頁面）或
// 跨 repo 動作失敗，都只會在結果提示裡註明，需要的話使用者自己去
// asstudiowebsite 手動確認/清掉，不會因為這一步失敗導致連 Internal-Pages
// 那份都刪不掉。照片（images/subpages/<slug>/ 底下的檔案）不會一併清掉，
// 跟案例刪除目前的行為一致，是已知、可接受的殘留。
async function deleteCurrentSubpage(){
  if(!confirm("確定要刪除這個子頁面嗎？這個動作沒辦法復原。")) return;
  const ed = state.editingSubpage;
  try{
    setLoading(true, "刪除中…");
    await ghDeleteFile(`content/subpages/${ed.slug}.json`, `Delete subpage ${ed.slug} via admin`, ed.sha);

    let dcHtmlWarning = "";
    const filename = `${ed.item.title}.dc.html`;
    try{
      const { sha: dcSha } = await ghGetFileRaw(filename, "asstudiowebsite");
      await ghDeleteFile(filename, `Delete subpage ${filename} via admin`, dcSha, "asstudiowebsite");
    }catch(e){
      dcHtmlWarning = `；但 asstudiowebsite 上的「${filename}」沒有一併清掉（可能本來就沒建立成功，或跨 repo 動作有問題），需要的話請自行到 GitHub 確認`;
    }

    toast("已刪除" + dcHtmlWarning, !!dcHtmlWarning);
    state.subpages = null;
    closeSubpageEditor();
  }catch(err){
    toast("刪除失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

// 這份內嵌複本要記得跟著手動更新，不然新建的子頁面會停留在舊版樣板。

<!-- PAGE TRANSITION PRELOADER (arriving from homepage)：跟首頁自己第一次進站播放的
     是同一支影片（uploads/網頁前導片.mp4），只在真的從首頁節點點進來時才播——由首頁
     點擊節點當下設定的 sessionStorage 旗標 scTransitionIn 決定，直接重新整理/直接
     輸入網址/瀏覽器上一頁都不會播（讀不到旗標就立刻移除遮罩） -->
<div id="sc-arrival-overlay" style="position:fixed; inset:0; z-index:99999; background:#ffffff; display:flex; align-items:center; justify-content:center; transition:opacity 0.6s ease;">
  <video id="sc-arrival-video" autoplay muted playsinline preload="auto" style="width:100%; height:100%; object-fit:cover;">
    <source src="uploads/網頁前導片.mp4" type="video/mp4">

</div>
<script>
(function () {
  var overlay = document.getElementById('sc-arrival-overlay');
  var vid = document.getElementById('sc-arrival-video');
  if (!overlay || !vid) return;

  var flag;
  try { flag = sessionStorage.getItem('scTransitionIn'); } catch (err) { flag = null; }
  if (flag !== '1') { overlay.remove(); return; }
  try { sessionStorage.removeItem('scTransitionIn'); } catch (err) {}

  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    overlay.style.opacity = '0';
    setTimeout(function () { overlay.remove(); }, 600);
  }
  vid.addEventListener('ended', reveal);
  vid.addEventListener('error', reveal);
  setTimeout(reveal, 15000);
})();

  scrollToSection(id) {
    if (!id) return;
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  toggleDarkMode() {
    this.setState(s => ({ isDarkMode: !s.isDarkMode }));
  }

  toggleMaterialMenu() {
    this.setState(s => ({ showMaterialMenu: !s.showMaterialMenu }));
  }

  componentDidMount() {
    fetch('https://as-studio001.github.io/Internal-Pages/content/subpages/origin.json', { cache: 'no-store' })
      .then((res) => (res.ok ? res.json() : null))
      .then((json) => {
        if (!json) return;
        this.setState({ data: json }, () => {
          this._teardownSectionWidgets();
          this._setupSectionWidgets();
        });
      })
      .catch(() => {});

    this._onDocMouseDown = (e) => {
      const inMenu = e.target && e.target.closest && e.target.closest('[data-menu-box]');
      if (!inMenu && this.state.showMaterialMenu) this.setState({ showMaterialMenu: false });
    };
    document.addEventListener('mousedown', this._onDocMouseDown);

    this._sizeGallerySquare = () => {
      const gallery = document.getElementById('sc-gallery');
      if (!gallery) return;
      const totalWidth = gallery.clientWidth;
      if (!totalWidth) return;
      const HOVER_FLEX = 4;
      const panelCount = document.querySelectorAll('.sc-gallery-panel').length;
      if (!panelCount) return;
      const totalFlexUnits = HOVER_FLEX + (panelCount - 1);
      const squareSize = Math.round(totalWidth * HOVER_FLEX / totalFlexUnits);
      gallery.style.height = squareSize + 'px';

      const numOffset = -(squareSize - 48);
      let styleEl = document.getElementById('sc-gallery-dynamic-style');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'sc-gallery-dynamic-style';
        document.body.appendChild(styleEl);
      }
      styleEl.textContent =
        '.sc-gallery-num { transform: translateY(' + numOffset + 'px) rotate(0deg); }' +
        '.sc-gallery-panel:hover .sc-gallery-num { transform: translateY(0) rotate(-90deg); }';

      document.querySelectorAll('.sc-gallery-panel[data-photo="true"]').forEach((panel) => {
        panel.style.backgroundSize = squareSize + 'px ' + squareSize + 'px';
      });
    };
    this._sizeGallerySquare();
    window.addEventListener('resize', this._sizeGallerySquare);

    (() => {
      const container = document.getElementById('sc-cursor-chain');
      const gallery = document.getElementById('sc-gallery');
      if (!container || !gallery) return;

      const CHAIN_LENGTH = 7;
      const LERP = 0.35;
      const dots = [];
      for (let i = 0; i < CHAIN_LENGTH; i++) {
        const size = Math.max(3, 14 - i * 1.6);
        const opacity = Math.max(0.06, 0.9 - i * 0.13);
        const dotEl = document.createElement('span');
        dotEl.className = 'sc-chain-dot';
        dotEl.style.width = size + 'px';
        dotEl.style.height = size + 'px';
        dotEl.style.opacity = String(opacity);
        container.appendChild(dotEl);
        dots.push({ el: dotEl, x: 0, y: 0 });
      }

      let targetX = 0, targetY = 0;
      let active = false;

      this._onGalleryMouseMove = (e) => {
        const rect = gallery.getBoundingClientRect();
        targetX = e.clientX - rect.left;
        targetY = e.clientY - rect.top;
        if (!active) {
          active = true;
          dots.forEach((d) => { d.x = targetX; d.y = targetY; });
          container.classList.add('sc-visible');
        }
      };
      this._onGalleryMouseLeave = () => {
        active = false;
        container.classList.remove('sc-visible');
      };
      gallery.addEventListener('mousemove', this._onGalleryMouseMove);
      gallery.addEventListener('mouseleave', this._onGalleryMouseLeave);

      const animateChain = () => {
        if (active) {
          let prevX = targetX, prevY = targetY;
          dots.forEach((d) => {
            d.x += (prevX - d.x) * LERP;
            d.y += (prevY - d.y) * LERP;
            d.el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px) translate(-50%,-50%)';
            prevX = d.x; prevY = d.y;
          });
        }
        this._chainRAF = requestAnimationFrame(animateChain);
      };
      animateChain();
    })();

    this._setupSectionWidgets();
  }

  _setupSectionWidgets() {
    this._setupVerticalTimelines();
    this._setupHorizontalTimelines();
    this._setupAccordionCards();
  }

  _teardownSectionWidgets() {
    if (this._onVTimelineScroll) window.removeEventListener('scroll', this._onVTimelineScroll);
    if (this._onHTimelineScroll) window.removeEventListener('scroll', this._onHTimelineScroll);
    if (this._accordionHeaders) {
      this._accordionHeaders.forEach((header) => header.removeEventListener('click', this._onAccordionHeaderClick));
    }
  }

  _setupVerticalTimelines() {
    const containers = Array.from(document.querySelectorAll('[data-sc-vtimeline]'));
    this._vTimelines = containers.map((container) => ({ container, revealIndex: 0, revealing: false }));

    const growLine = (t) => {
      const items = t.container.querySelectorAll('.sc-timeline-item');
      const line = t.container.querySelector('.sc-timeline-line');
      if (!line || !items.length || t.revealIndex <= 0) return;
      setTimeout(() => {
        const idx = Math.min(t.revealIndex, items.length) - 1;
        const dot = items[idx] && items[idx].querySelector('.sc-timeline-dot');
        if (!dot) return;
        const lineRect = line.getBoundingClientRect();
        const dotRect = dot.getBoundingClientRect();
        const distance = (dotRect.top + dotRect.height / 2) - lineRect.top;
        line.style.height = Math.max(0, distance + 151) + 'px';
      }, 620);
    };

    const revealNext = (t) => {
      const items = t.container.querySelectorAll('.sc-timeline-item');
      if (t.revealIndex >= items.length) return;
      items[t.revealIndex].classList.add('sc-visible');
      t.revealIndex++;
      growLine(t);
    };

    this._vTimelines.forEach((t) => {
      revealNext(t);
      revealNext(t);
    });

    this._onVTimelineScroll = () => {
      this._vTimelines.forEach((t) => {
        if (t.revealing) return;
        const items = t.container.querySelectorAll('.sc-timeline-item');
        if (t.revealIndex >= items.length) return;
        const rect = t.container.getBoundingClientRect();
        if (rect.top > window.innerHeight - 120) return;
        t.revealing = true;
        revealNext(t);
        setTimeout(() => { t.revealing = false; }, 150);
      });
    };
    window.addEventListener('scroll', this._onVTimelineScroll, { passive: true });
    this._onVTimelineScroll();
  }

  _setupHorizontalTimelines() {
    const containers = Array.from(document.querySelectorAll('[data-sc-htimeline]'));
    this._hTimelines = containers.map((container) => ({ container, revealed: false }));

    const reveal = (t) => {
      t.revealed = true;
      const steps = t.container.querySelectorAll('.sc-h-timeline-step');
      steps.forEach((el, i) => {
        setTimeout(() => el.classList.add('sc-visible'), i * 150);
      });
      setTimeout(() => {
        const line = t.container.querySelector('.sc-h-timeline-line');
        const track = t.container.querySelector('.sc-h-timeline-track');
        const dots = t.container.querySelectorAll('.sc-h-timeline-dot');
        if (!line || !track || dots.length < 2) return;
        const trackRect = track.getBoundingClientRect();
        const firstRect = dots[0].getBoundingClientRect();
        const lastRect = dots[dots.length - 1].getBoundingClientRect();
        const first = (firstRect.left + firstRect.width / 2) - trackRect.left;
        const last = (lastRect.left + lastRect.width / 2) - trackRect.left;
        line.style.left = first + 'px';
        line.style.width = Math.max(0, last - first) + 'px';
      }, 200);
    };

    this._onHTimelineScroll = () => {
      this._hTimelines.forEach((t) => {
        if (t.revealed) return;
        const rect = t.container.getBoundingClientRect();
        if (rect.top > window.innerHeight - 100) return;
        reveal(t);
      });
    };
    window.addEventListener('scroll', this._onHTimelineScroll, { passive: true });
    this._onHTimelineScroll();
  }

  _setupAccordionCards() {
    this._onAccordionHeaderClick = (e) => {
      const header = e.currentTarget;
      const accordion = header.closest('.sc-accordion');
      if (!accordion) return;
      const panel = accordion.querySelector('.sc-accordion-panel');
      const inner = accordion.querySelector('.sc-accordion-panel-inner');
      if (!panel || !inner) return;
      const isOpen = accordion.classList.toggle('open');
      panel.style.maxHeight = isOpen ? inner.scrollHeight + 'px' : '0px';
    };
    this._accordionHeaders = Array.from(document.querySelectorAll('.sc-accordion-header'));
    this._accordionHeaders.forEach((header) => header.addEventListener('click', this._onAccordionHeaderClick));
  }

  componentWillUnmount() {
    document.removeEventListener('mousedown', this._onDocMouseDown);
    window.removeEventListener('resize', this._sizeGallerySquare);
    if (this._chainRAF) cancelAnimationFrame(this._chainRAF);
    const gallery = document.getElementById('sc-gallery');
    if (gallery && this._onGalleryMouseMove) gallery.removeEventListener('mousemove', this._onGalleryMouseMove);
    if (gallery && this._onGalleryMouseLeave) gallery.removeEventListener('mouseleave', this._onGalleryMouseLeave);
    this._teardownSectionWidgets();
  }

  renderVals() {
    const isDarkMode = this.state.isDarkMode;
    const data = this.state.data;
    const allSections = (data && data.sections) || this._fallbackSections;
    const gallerySection = allSections[0] || { items: [] };
    const galleryItems = gallerySection.items || [];
    const contentSections = allSections.slice(1);
    return {
      isDarkMode,
      pageTitle: (data && data.title) || this.pageTitle,
      pageSubtitle: (data && data.subtitle) || '',
      hasSubtitle: !!(data && data.subtitle),
      pageIntroImage: (data && data.introImage) || '',
      hasIntroImage: !!(data && data.introImage),
      h1Margin: (data && data.subtitle) ? '0 0 12px 0' : '0 0 40px 0',
      bgColor: isDarkMode ? '#0a0a0a' : '#ffffff',
      textColor: isDarkMode ? '#ffffff' : '#1a1a1a',
      logoFilter: isDarkMode ? 'none' : 'invert(1)',
      showMaterialMenu: this.state.showMaterialMenu,
      toggleMaterialMenu: () => this.toggleMaterialMenu(),
      toggleDarkMode: () => this.toggleDarkMode(),
      galleryItems: galleryItems.map((it) => {
        const lineColor = isDarkMode ? 'rgba(255,255,255,0.8)' : 'rgba(136,136,136,0.8)';
        const hasPhoto = !!it.photo;
        return {
          ...it,
          bg: isDarkMode ? '#0a0a0a' : '#ffffff',
          text: it.textOverride || (isDarkMode ? '#ffffff' : '#1a1a1a'),
          borderLeft: '0.5px solid ' + lineColor,
          goTo: () => this.scrollToSection(it.target),
          hasPhoto,
          bgImage: hasPhoto ? "url('" + it.photo + "')" : 'none',
          bgPosition: hasPhoto ? 'left center' : '0 0',
          bgSize: hasPhoto ? '328px 328px' : 'auto'
        };
      }),
      sections: contentSections.map((s, i) => {
        const si = i + 1;
        const instanceId = 'sec' + si;
        const base = {
          ...s,
          instanceId,
          isHeading: s.type === 'heading',
          isBody: s.type === 'body',
          isPhotosGrid: s.type === 'photos' && s.layout !== 'stack',
          isPhotosStack: s.type === 'photos' && s.layout === 'stack',
          isTimelineVertical: s.type === 'timeline-vertical',
          isTimelineHorizontal: s.type === 'timeline-horizontal',
          isCaseCard: s.type === 'case-card'
        };
        if (s.type === 'heading') return { ...base, text: s.text || '', isH3: s.level === 'h3' };
        if (s.type === 'body') return { ...base, text: s.text || '', isEmphasis: s.style === 'emphasis' };
        if (s.type === 'photos') return { ...base, images: s.images || [] };
        if (s.type === 'timeline-vertical' || s.type === 'timeline-horizontal') return { ...base, items: s.items || [] };
        if (s.type === 'case-card') {
          const photos = s.photos || [];
          const specEn = s.specEn || '';
          return { ...base, title: s.title || '', photos, hasPhotos: photos.length > 0, specZh: s.specZh || '', specEn, hasSpecEn: !!specEn.trim() };
        }
        return base;
      })
    };
  }

// 直接向 asstudiowebsite（公開 repo）抓一個檔案的內容跟 sha——就是
// ghGetFileRaw(path, "asstudiowebsite")，2026-08-26 以前是獨立一份邏輯
// （只打 api.github.com，沒有 Netlify 備援）。改成直接呼叫共用的
// ghGetFileRaw 是因為：Internal-Pages 的讀取那次優化之後也改成優先直接
// 打 api.github.com（見 ghFetchPublic 附近的說明），這兩邊的呼叫其實
// 是同一個未登入額度（GitHub 的「每小時 60 次」是整個 api.github.com
// 主機、以呼叫端 IP 為單位算的，不是分 repo 各自 60 次）——這個函式原本
// 沒有退回 Netlify 的備援，額度用完時就直接失敗，使用者實際遇到「自動
// 推送到 asstudiowebsite」因為 HTTP 403 整個失敗、卡住。ghGetFileRaw
// 本身已經有「直接讀取失敗（含 403）就退回 Netlify github-proxy 重試」
// 的備援，直接沿用，不必維護兩套幾乎一樣的邏輯。
async function fetchAsstudiowebsitePublic(path){
  return ghGetFileRaw(path, "asstudiowebsite");
}

// 把一份 .dc.html 原始檔裡的 pageTitle 跟 _fallbackSections 換成目前最新的
// 標題／段落內容——不動其他任何東西（頁首/頁尾/動畫/各段落類型的排版與
// 互動邏輯，包括原型獲獎那種高度客製化的得獎清單元件，都原封不動保留）。
// 這個函式刻意不管抓資料網址：新頁面另外處理（見
// regenerateAndPushSubpageDcHtml），既有頁面的抓資料網址本來就是對的、
// slug 不會變，不需要也不應該去動它。
function applyTitleAndFallback(templateSource, title, sections){
  let html = templateSource;

  const titleRe = /pageTitle = '[^']*';/;
  if(!titleRe.test(html)) throw new Error("目標檔案找不到 pageTitle 設定，可能檔案格式跟預期的不一樣，請先手動檢查這個檔案");
  html = html.replace(titleRe, `pageTitle = ${JSON.stringify(title)};`);

  const fallbackRe = /_fallbackSections = \[[\s\S]*?\n  \];\n\n  scrollToSection\(id\)/;
  if(!fallbackRe.test(html)) throw new Error("目標檔案找不到退回內容區塊，可能檔案格式跟預期的不一樣，請先手動檢查這個檔案");
  html = html.replace(fallbackRe, `_fallbackSections = ${JSON.stringify(sections, null, 2)};\n\n  scrollToSection(id)`);

  return html;
}

// 不管新增還是更新，都會把 asstudiowebsite 對應的 .dc.html 檔案內容
// 同步成目前最新的標題／段落——不只是靠子頁面自己在瀏覽器裡即時 fetch
// JSON 顯示最新內容，是連檔案本身存的內容都跟著更新，避免以後只看檔案
// 內容以為是舊的、造成混淆（fetch 失敗時的退回內容也才不會跟真正的內容
// 兜不起來）。
//   - 新增：套用內嵌的通用樣板（沒有得獎清單這種客製元件），順便換掉抓
//     資料網址；同時把決定好的檔名記進 ed.item.dcHtmlFile，之後改標題也
//     不會跟丟要更新哪個檔案。
//   - 更新：直接抓這個頁面自己「目前」的檔案內容當樣板，只換標題／退回
//     內容兩處，保留這個頁面原本可能有的任何客製化程式碼跟版面。
async function regenerateAndPushSubpageDcHtml(ed, isNewSubpage){
  const title = ed.item.title;
  const sections = ed.item.sections || [];
  const filename = ed.item.dcHtmlFile || (SUBPAGE_PAGES[ed.slug] && SUBPAGE_PAGES[ed.slug].file) || `${title}.dc.html`;

  let templateSource, sha;
  if(isNewSubpage){
    templateSource = SUBPAGE_DC_TEMPLATE_SOURCE_HTML;
    const fetchUrlNeedle = `content/subpages/${SUBPAGE_DC_TEMPLATE_SOURCE_SLUG}.json`;
    if(!templateSource.includes(fetchUrlNeedle)) throw new Error("樣板來源檔找不到抓取資料的網址，可能樣板檔案格式已變更");
    templateSource = templateSource.split(fetchUrlNeedle).join(`content/subpages/${ed.slug}.json`);
    sha = null;
  } else {
    const existing = await fetchAsstudiowebsitePublic(filename);
    templateSource = existing.content;
    sha = existing.sha;
  }

  const html = applyTitleAndFallback(templateSource, title, sections);
  await ghPutFile(filename, utf8ToBase64(html), `${isNewSubpage ? "Add" : "Update"} subpage ${filename} via admin`, sha, "asstudiowebsite");
}

async function saveSubpageEditor(ed){
  if(!ed.item.title){ toast("請至少填寫標題", true); return; }

  const isNewSubpage = ed.isNew;

  if(isNewSubpage){
    try{
      setLoading(true, "產生子頁面代號中…");
      ed.slug = await generateUniqueSlug(ed.item.title, (state.subpages || []).map((s) => s.slug), "page");
    }catch(err){
      toast("建立子頁面失敗：" + err.message, true);
      setLoading(false);
      return;
    }
    if(/[\/\\?#%]/.test(ed.item.title)){ toast("標題不能包含 / \\ ? # % 這些符號，會被當成網址檔名的一部分", true); setLoading(false); return; }
    const filename = `${ed.item.title}.dc.html`;
    try{
      let exists = false;
      try{ await fetchAsstudiowebsitePublic(filename); exists = true; }catch(e){ /* 抓不到＝還沒有這個檔名，正常情況 */ }
      if(exists) throw new Error(`asstudiowebsite 已經有同名的「${filename}」，換個標題再試一次，避免覆蓋掉既有頁面`);
    }catch(err){
      toast("建立子頁面失敗：" + err.message, true);
      setLoading(false);
      return;
    }
    ed.item.dcHtmlFile = filename;
  }

  try{
    setLoading(true, "儲存中…");
    await flushPendingUploads(ed, `${SUBPAGE_ASSET_PREFIX}${ed.slug}`);
    absolutizeSubpageAssetPaths(ed.item);
    const json = JSON.stringify(ed.item, null, 2) + "\n";
    const res = await ghPutFile(`content/subpages/${ed.slug}.json`, utf8ToBase64(json), `${isNewSubpage ? "Add" : "Update"} subpage ${ed.slug} via admin`, ed.sha);
    ed.sha = res.content.sha;

    setLoading(true, "同步 asstudiowebsite 頁面程式碼中…");
    await regenerateAndPushSubpageDcHtml(ed, isNewSubpage);

    ed.isNew = false;
    toast(isNewSubpage ? "已建立新子頁面，網站幾分鐘內會上線" : "已發布，asstudiowebsite 的頁面程式碼也同步更新了，網站幾分鐘內會上線");
    state.subpages = null; // 下次回到清單時重新讀取，標題可能變了
    rerenderCurrentEditor(); // 新頁面存檔後 slug 才確定，重畫一次讓右側預覽區塊的提示文字跟著更新
  }catch(err){
    toast("儲存失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

/* ============================================================
   主網站內容編輯器（5 語言欄位 + 自動翻譯）
   ============================================================ */
const LANG5 = [
  ["zh-Hant", "中文（繁體）"],
  ["zh-Hans", "中文（簡體）"],
  ["en", "English"],
  ["ja", "日本語"],
  ["ko", "한국어"],
];

function lang5Html(basePath, value, blockId){
  value = value || {};
  const [zhCode, zhLabel] = LANG5[0];
  const others = LANG5.slice(1);
  return `
    <div class="lang5-block" id="${blockId}">
      <div class="lang5-row">
        <label>${zhLabel}</label>
        <textarea data-path="${basePath}.${zhCode}">${esc(value[zhCode] || "")}</textarea>
      </div>
      <details class="lang5-others">
        <summary>其他語言（簡中／英／日／韓）與自動翻譯</summary>
        <button type="button" class="translate-btn" data-translate="${esc(basePath)}">自動翻譯其他語言</button>
        ${others.map(([code, label]) => `
          <div class="lang5-row">
            <label>${label}</label>
            <textarea data-path="${basePath}.${code}">${esc(value[code] || "")}</textarea>
          </div>
        `).join("")}
      </details>
    </div>
  `;
}

async function translateLang5(ed, basePath){
  const source = getPath(ed.item, `${basePath}.zh-Hant`);
  if(!source){ toast("請先填寫「中文（繁體）」欄位，再按自動翻譯", true); return; }
  const targets = ["zh-Hans", "en", "ja", "ko"];
  try{
    setLoading(true, "翻譯中…");
    const results = await Promise.all(targets.map(async t => {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=" + t + "&dt=t&q=" + encodeURIComponent(source);
      try{
        const r = await fetch(url);
        const json = await r.json();
        return (json[0] || []).map(seg => seg[0]).join("");
      }catch(e){ return ""; }
    }));
    targets.forEach((t, i) => { if(results[i]) setPath(ed.item, `${basePath}.${t}`, results[i]); });
    rerenderCurrentEditor();
  }catch(err){
    toast("翻譯失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

function bindLang5Blocks(ed, container){
  container.querySelectorAll("[data-translate]").forEach(btn => {
    btn.addEventListener("click", () => translateLang5(ed, btn.dataset.translate));
  });
}

        <div style="display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;">

            <div class="field-block">
              <label>第一行字距（<span id="heroLine1LetterSpacingVal">${(item.line1LetterSpacing != null ? item.line1LetterSpacing : 0.15).toFixed(2)}</span>em）</label>

            <div class="field-block">
              <label>第二行文字</label>
              <input type="text" id="heroLine2" value="${esc(item.line2 || "")}" placeholder="AS.Studio">
            </div>
            <div class="field-block">
              <label>第二行粗細</label>
              <select id="heroLine2Weight">${weightOptions(item.line2Weight, "400")}</select>
            </div>
            <div class="field-block">
              <label>第二行字距（<span id="heroLine2LetterSpacingVal">${(item.line2LetterSpacing != null ? item.line2LetterSpacing : 0.3).toFixed(2)}</span>em）</label>
              <input type="range" id="heroLine2LetterSpacing" min="0" max="0.5" step="0.01" value="${item.line2LetterSpacing != null ? item.line2LetterSpacing : 0.3}" style="width:100%">
            </div>
            <div class="field-block">
              <label>行距（<span id="heroLineGapVal">${(item.lineGap != null ? item.lineGap : 1.25).toFixed(2)}</span>rem）</label>

        <div class="field-block">
