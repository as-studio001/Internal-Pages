<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理 — AS. studio</title>
<style>
:root{
  --paper:   #fbfaf8;
  --ink:     #201f1d;
  --muted:   #8a8781;
  --line:    #eae7e1;
  --accent:  #6b6355;
  --danger:  #b23b3b;
  --f-heading: 'Trebuchet MS', 'Yu Gothic', 'Meiryo', sans-serif;
  --f-body:    'Yu Gothic Light', 'Yu Gothic', 'Meiryo', sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
h1,h2,h3{ font-family:var(--f-heading); font-weight:700; letter-spacing:-0.01em; margin:0; }
input,textarea,select{ font-family:inherit; font-size:14px; }

.wrap{ max-width:1000px; margin:0 auto; padding:0 24px; }

.top-bar{ border-bottom:1px solid var(--line); padding:18px 0; margin-bottom:28px; }
.top-bar .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.top-bar .site-title{ font-family:var(--f-heading); font-weight:700; font-size:18px; }
.top-bar .site-title a{ text-decoration:none; color:var(--muted); font-weight:400; font-size:13px; margin-left:10px; }
.top-bar .user-box{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
.top-bar .user-box img{ width:26px; height:26px; border-radius:50%; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px; border-radius:5px; border:1px solid var(--line);
  background:#fff; color:var(--ink); font-size:13.5px; font-weight:600;
  transition:all .15s ease;
}
.btn:hover{ border-color:var(--ink); }
.btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn.primary:hover{ background:#000; }
.btn.danger{ color:var(--danger); border-color:#e6c9c9; }
.btn.danger:hover{ background:#fdf1f1; border-color:var(--danger); }
.btn.ghost{ border-color:transparent; background:none; color:var(--muted); padding:9px 10px; }
.btn.ghost:hover{ color:var(--ink); }
/* animate-ui 的 MessageSquareCode 圖示原本是 hover 時觸發 Framer Motion
   動畫（這個後台沒有建置流程，裝不了那套元件，只手刻了 SVG 形狀，見
   iconMessageSquareCode()）——這裡用純 CSS transition 做一個貼近的
   hover 效果：滑鼠移上去時 < > 兩個括號往外滑開一點點，模擬「打開」的
   感覺，不需要真的引入 Framer Motion。 */
#adminBotBtn .bot-icon-bracket{ transition:transform .2s ease; }
#adminBotBtn:hover .bot-icon-bracket-left{ transform:translateX(-1.5px); }
#adminBotBtn:hover .bot-icon-bracket-right{ transform:translateX(1.5px); }
.btn.small{ padding:6px 12px; font-size:12.5px; }
.btn:disabled{ opacity:.5; cursor:default; }
.btn svg{ width:15px; height:15px; flex-shrink:0; }

.login-screen{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; text-align:center; padding:40px 20px;
}
.login-screen h1{ font-size:24px; }
.login-screen p{ color:var(--muted); max-width:360px; font-size:14px; line-height:1.7; }
.login-screen input{
  width:260px; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  background:#fff; color:var(--ink); font-size:14px;
}
.login-screen input:focus{ outline:none; border-color:var(--ink); }

.tab-nav{ display:flex; gap:6px; margin-bottom:28px; border-bottom:1px solid var(--line); }
.tab-nav button{
  padding:11px 18px; background:none; border:none; border-bottom:2px solid transparent;
  font-size:14.5px; font-weight:600; color:var(--muted); margin-bottom:-1px;
}
.tab-nav button.active{ color:var(--ink); border-color:var(--ink); }
.tab-nav button:hover{ color:var(--ink); }

.item-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:20px; padding-bottom:60px; }
.item-card{
  border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer;
  background:#fff; transition:box-shadow .15s ease, transform .15s ease;
}
.item-card:hover{ box-shadow:0 6px 18px rgba(32,31,29,0.1); transform:translateY(-2px); }
.item-card .thumb{ position:relative; aspect-ratio:4/3; background:#efece5; overflow:hidden; }
.item-card .thumb img{ width:100%; height:100%; object-fit:cover; }
.item-card .thumb.empty{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
.item-card .info{ padding:12px 14px; }
.item-card .info .t{ font-size:14px; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-card .info .m{ font-size:12px; color:var(--muted); }
.add-card{
  border:1.5px dashed var(--line); border-radius:8px; aspect-ratio:4/3;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  color:var(--muted); cursor:pointer; background:none;
}
.add-card:hover{ border-color:var(--ink); color:var(--ink); }
.add-card svg{ width:26px; height:26px; }
.add-card span{ font-size:13px; font-weight:600; }

.editor{ padding-bottom:80px; }
.editor-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:12px; flex-wrap:wrap; }

/* 子頁面編輯器：左邊表單、右邊預覽，兩欄並排——右欄用 position:sticky 固定
   貼在畫面上，左邊表單往下捲動編輯到很後面的段落時，右邊預覽畫面還是留在
   看得到的地方，不用改完又捲回最上面才能對照效果。畫面窄的時候（例如筆電
   內建螢幕、或分割視窗）改回上下堆疊，並排會太擠反而更難用。 */
.wrap.wrap-wide{ max-width:1440px; }
.subpage-editor-columns{ display:flex; gap:32px; align-items:flex-start; }
.subpage-editor-left{ flex:1 1 0; min-width:0; }
.subpage-editor-right{ flex:1 1 0; min-width:0; position:sticky; top:20px; }
@media (max-width:1000px){
  .subpage-editor-columns{ flex-direction:column; }
  .subpage-editor-right{ position:static; width:100%; }
}
.back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13.5px; background:none; border:none; padding:0; }
.back-link:hover{ color:var(--ink); }
.field-block{ margin-bottom:26px; }
.field-block > label, .field-block > .label{
  display:block; font-family:var(--f-heading); font-weight:700; font-size:13px;
  letter-spacing:.02em; margin-bottom:8px; color:var(--ink);
}
.field-hint{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; }

.preview-section{ margin-bottom:44px; padding-bottom:36px; border-bottom:1px solid var(--line); }
.preview-section:last-of-type{ border-bottom:none; }
.preview-section-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.preview-section-head .label{ font-family:var(--f-heading); font-weight:700; font-size:15px; letter-spacing:.02em; color:var(--ink); }
.preview-section-num{
  display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
  background:var(--ink); color:#fff; font-size:12px; font-weight:700; flex-shrink:0;
}
.case-live-preview{ width:100%; border:1px solid var(--line); border-radius:8px; background:#0a0a0a; }
.field-block input[type=text], .field-block input[type=number], .field-block textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  background:#fff; color:var(--ink); resize:vertical;
}
.field-block input:focus, .field-block textarea:focus{ outline:none; border-color:var(--ink); }
.field-block textarea{ min-height:90px; line-height:1.7; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.three-col{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.four-col{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
@media (max-width:640px){ .two-col, .three-col, .four-col{ grid-template-columns:1fr; } }

.cover-drop{
  /* 一定要給明確的 width（不能只給 max-width）：這個容器沒有照片時，
     裡面唯一的內容 .placeholder 是 position:absolute（不算進版面計算），
     容器本身沒有任何「正常流」的內容可以撐出寬度——在 flex 版面裡（滑塊／
     得獎清單這幾個表單都是用 display:flex 把縮圖跟旁邊的文字欄位並排）
     沒有明確寬度的 flex item，寬度會塌縮到幾乎是 0px，整個上傳區塊變成
     使用者完全看不到、點不到的一個小點——曾經因為這樣被誤以為「沒有地方
     可以放照片」，其實只是版面塌陷，不是真的少了功能。 */
  aspect-ratio:16/9; width:100%; max-width:520px; border-radius:8px; overflow:hidden;
  background:#efece5; border:1.5px dashed var(--line); position:relative; cursor:pointer;
}
.cover-drop.has-image{ border-style:solid; }
.cover-drop img{ width:100%; height:100%; object-fit:cover; }
.cover-drop .placeholder{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; color:var(--muted); font-size:13px;
}
.cover-drop .placeholder svg{ width:26px; height:26px; }
.cover-drop:hover{ border-color:var(--ink); }
.cover-drop.drag-over{ border-color:var(--ink); background:rgba(107,99,85,0.08); }
.cover-drop .replace-hint{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(20,19,17,0.55); color:#fff; font-size:12.5px; opacity:0; transition:opacity .15s ease;
}
.cover-drop.has-image:hover .replace-hint{ opacity:1; }
.cover-drop.small{ width:200px; max-width:200px; aspect-ratio:4/3; flex-shrink:0; }

/* simple text list (paragraphs) */
.text-list-row{ display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
.text-list-row textarea{ flex:1; min-height:70px; }
.row-remove-btn{
  flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
  background:#fff; color:var(--muted); font-size:16px; line-height:1;
}
.row-remove-btn:hover{ color:var(--danger); border-color:var(--danger); }

/* photo list (with per-photo caption) */
.photo-list{ display:flex; flex-direction:column; gap:10px; }
.photo-list-drop{ border-radius:8px; transition:background .15s ease; }
.photo-list-drop.drag-over{ background:rgba(107,99,85,0.08); outline:1.5px dashed var(--ink); outline-offset:6px; }
.photo-row{ display:flex; gap:12px; align-items:center; transition:outline-color .15s ease; outline:2px solid transparent; outline-offset:2px; }
.photo-row.drag-target{ outline-color:var(--ink); }
.photo-row .drag-handle{ cursor:grab; color:var(--muted); font-size:16px; flex-shrink:0; }
.photo-row .thumb{ width:84px; height:63px; flex-shrink:0; border-radius:5px; overflow:hidden; background:#efece5; border:1px solid var(--line); }
.photo-row .thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-row input[type=text]{ flex:1; }
.add-photo-btn{
  align-self:flex-start; display:inline-flex; align-items:center; gap:8px;
  padding:9px 14px; border-radius:6px; border:1.5px dashed var(--line); background:none; color:var(--muted); font-size:13px; font-weight:600;
}
.add-photo-btn:hover{ border-color:var(--ink); color:var(--ink); }
.add-photo-btn svg{ width:16px; height:16px; }

/* step card：共用的卡片樣式，主網站內容／子頁面／首頁節點編輯器等
   多處清單編輯畫面都在用 */
.step-card{ border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; background:#fff; }
.step-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.step-card-head .step-label{ font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em; }
.add-step-btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:6px;
  border:1.5px dashed var(--line); background:none; color:var(--muted); font-size:13.5px; font-weight:600;
}
.add-step-btn:hover{ border-color:var(--ink); color:var(--ink); }

/* 拖曳排序（子頁面「內文段落」：段落之間、段落內的小標題／內文／照片之間都可以
   拖曳調整順序）——原生 HTML5 Drag and Drop，不依賴外部套件，見 makeSortable() */
.section-drag-handle, .block-drag-handle{
  cursor:grab; color:var(--muted); font-size:17px; line-height:1; user-select:none; flex-shrink:0;
  padding:6px 8px; margin:-6px -8px; border-radius:4px; transition:background-color .15s ease, color .15s ease;
}
.section-drag-handle:hover, .block-drag-handle:hover{ background:rgba(32,31,29,0.06); color:var(--ink); }
.section-drag-handle:active, .block-drag-handle:active{ cursor:grabbing; }
.section-card.dragging, .block-row.dragging{ opacity:.4; }
.block-row{ border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; background:var(--paper); }
.block-row-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.block-row-head .block-row-label{ font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.04em; }

/* 5-language block */
.lang5-block{ border:1px solid var(--line); border-radius:8px; padding:14px; background:#fff; }
.lang5-row{ margin-bottom:8px; }
.lang5-others{ margin-top:10px; }
.lang5-others summary{
  cursor:pointer; font-size:12px; color:var(--muted); font-weight:600; list-style:none; padding:6px 0;
}
.lang5-others summary::-webkit-details-marker{ display:none; }
.lang5-others summary::before{ content:"▸ "; }
.lang5-others[open] summary::before{ content:"▾ "; }
.lang5-others .translate-btn{ margin-top:8px; }
.lang5-row label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:3px; }
.lang5-row textarea{ min-height:56px; }
.translate-btn{
  margin-bottom:12px; padding:7px 14px; background:var(--ink); color:#fff; border:none; border-radius:5px;
  font-size:12.5px; font-weight:600;
}
.translate-btn:hover{ background:#000; }
.translate-btn:disabled{ opacity:.5; }

.case-card-editor{ border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; background:#fff; }
.case-card-editor-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }

.new-case-guide{
  border:1.5px solid var(--ink); border-radius:8px; padding:16px 18px; margin-bottom:26px; background:#fff;
}
.new-case-guide.all-done{ border-color:#2f7d4f; background:rgba(47,125,79,0.06); }
.new-case-guide-title{ font-family:var(--f-heading); font-weight:700; font-size:14px; margin-bottom:10px; }
.new-case-guide.all-done .new-case-guide-title{ color:#2f7d4f; }
.new-case-guide-list{ list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:6px; }
.new-case-guide-list li{ font-size:13.5px; color:var(--muted); }
.new-case-guide-list li.done{ color:var(--ink); text-decoration:line-through; text-decoration-color:var(--muted); }

.photo-groups{ display:flex; flex-direction:column; gap:14px; }
.photo-group-card{
  border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; background:#fff;
}
.photo-group-thumbs{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
.photo-group-thumbs .photo-row{ flex:1 1 220px; min-width:200px; margin-bottom:0; }
.photo-group-controls{ display:flex; flex-wrap:wrap; gap:16px; padding-top:10px; border-top:1px dashed var(--line); }
.photo-group-controls label{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
.photo-group-controls select{ padding:6px 8px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink); font-size:12.5px; }

.empty-note{ color:var(--muted); font-size:13px; font-style:italic; }
.chapter-picker{ display:flex; flex-wrap:wrap; gap:10px; }
.chapter-picker label{
  display:flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--line);
  border-radius:20px; font-size:13.5px; background:#fff; cursor:pointer;
}
.chapter-picker label:has(input:checked){ border-color:var(--ink); background:rgba(32,31,29,0.05); font-weight:600; }
.chapter-picker input{ margin:0; }

.save-bar{
  position:sticky; bottom:0; margin-top:32px; padding:16px 0; background:var(--paper);
  border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
}
.save-status{ font-size:12.5px; color:var(--muted); }
.save-status.err{ color:var(--danger); }

#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:6px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:999; max-width:90vw; text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.err{ background:var(--danger); }

#loadingOverlay{
  position:fixed; inset:0; background:rgba(251,250,248,0.85); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:998; font-size:14px; color:var(--muted);
}
#loadingOverlay.show{ display:flex; }

.spinner{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--ink);
  animation:spin .7s linear infinite; display:inline-block; margin-right:8px; vertical-align:-3px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingOverlay"><span class="spinner"></span><span id="loadingText">處理中…</span></div>
<div id="toast"></div>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   設定
   ============================================================ */
// 一定要在 supabase.createClient() 之前就先讀走網址上的 type=invite／
// type=recovery——supabase-js 自己也會偵測同一段網址 hash 來建立
// session，而且建立好之後會把 hash 清掉，如果我們自己判斷「這是不是
// 邀請信連結」的邏輯是等 createClient 呼叫完才去讀 location.hash，常常
// 會讀到已經被清空的網址，導致邀請信點進來直接跳過設密碼、直接登入。
let AUTH_LINK_TYPE = (/type=(invite|recovery)/.exec(location.hash) || [])[1] || null;

const REPO_OWNER = "as-studio001";
const REPO_NAME = "Internal-Pages";
const REPO_BRANCH = "main";
const RAW_BASE = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/`;

// 登入改成 email／密碼（Supabase），不用個人 GitHub 帳號——後台自己
// 「使用者管理」分頁就能寄邀請信、移除權限，不用再去 GitHub 網站設定
// Collaborators。實際寫入 GitHub 的動作也改成呼叫下面 FUNCTIONS_BASE
// 這個小後端服務（用同一組服務帳號 token 代為執行），因為登入的人
// 不再有自己的 GitHub 帳號可以直接寫。
// SUPABASE_URL / SUPABASE_ANON_KEY 是公開用的（Supabase 官方設計上
// anon key 本來就會放在前端程式碼裡，不是密鑰），FUNCTIONS_BASE 是
// 放這些 function 的 Netlify 站網址。三個都要換成實際的值才能用。
const SUPABASE_URL = "https://enjbqfgepvkpwlfqbldi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuamJxZmdlcHZrcHdsZnFibGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTUyODQsImV4cCI6MjEwMjg3MTI4NH0.7YAlMUGocaXenA6RPdDPNu60g48GgW0Nq8xAwxThilo";
// 2026-08-24：發現這裡原本寫死指向 glittering-dodol-8e2041，但這個團隊
// （as.studio arch）在 Netlify 上真正的網站其實是 zingy-bonbon-36e6c9
// （額度用完/升級都是這個網站）——glittering-dodol-8e2041 是另一個完全

function esc(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, s => ({

/* 圖片框區域(大圖/內文照片/More in Detail/外部連結封面……)全部改成
   同時支援上傳一般圖片、GIF、影片檔——GIF 本身就是 image/* 底下的
   格式，瀏覽器原生就會播放動畫，不需要額外處理；真正要另外處理的是
   影片檔，後台自己畫面上的縮圖統一走 mediaThumbHtml()：副檔名判斷是
   影片就用 <video>（靜音、自動循環播放，當縮圖單純看畫面用，跟照片
   一樣），不是就照舊用 <img>。跟前台 js/render.js 的 isVideoSrc() 邏輯
   一致，但這是純前端顯示判斷，兩邊各自獨立維護一份，不共用模組。 */
const VIDEO_EXT_RE = /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i;
function isVideoPath(path){
  return VIDEO_EXT_RE.test(String(path || ""));
}
function isVideoFile(file){
  return !!(file && file.type && file.type.startsWith("video/"));
}
function isImageOrVideoFile(file){
  return !!(file && file.type && (file.type.startsWith("image/") || file.type.startsWith("video/")));
}
function mediaThumbHtml(src, extraAttrs){
  const url = esc(src);
  const attrs = extraAttrs || "";
  if(isVideoPath(src)) return `<video src="${url}" muted loop playsinline autoplay ${attrs}></video>`;
  return `<img src="${url}" alt="" ${attrs}>`;
}
// Netlify Function／GitHub Contents API 這條上傳路徑對檔案大小很敏感
// （GitHub 那端的限制、加上 base64 編碼膨脹 1/3），照片會先自動壓縮，
// 但影片/GIF 沒辦法用同一招瘦身——上傳前先擋掉太大的檔案，給清楚的
// 錯誤訊息，總比讓它送出去、卡在後端才失敗、跳出一段看不懂的技術錯誤好。
const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;
function assertUploadSize(file){
  if(file.size > MAX_UPLOAD_BYTES){
    const mb = (file.size / 1024 / 1024).toFixed(1);
    throw new Error(`檔案太大（${mb}MB）：影片／GIF 檔上傳大小上限約 4MB，請先剪短或壓縮後再上傳，較長的完整影片建議改用「YouTube 影音連結」欄位嵌入。`);
  }
}

/* 中文輸入法打英數字時，句點／@ 這類符號有時候會被自動轉成「全形」
   （看起來很像，但是不同的字元），拿去驗證 email 格式會直接被判定
   invalid format。這裡把全形字元（U+FF01~FF5E）轉回對應的半形字元
   （兩者的 code point 固定差 0xFEE0），輸入框防呆用。 */
function normalizeFullwidth(str){
  return String(str || "").replace(/[！-～]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
}

async function callFunction(name, payload){
  const res = await fetch(`${FUNCTIONS_BASE}/${name}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + (authSession ? authSession.access_token : ""),
    },
    body: JSON.stringify(payload || {}),
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    // 把 action/repo/path 標在錯誤訊息前面（例如 "[getFile @asstudiowebsite
    // 原型原點.dc.html]"），跨 repo 動作變多之後，光看「Not Found」很難猜
    // 是哪一步、對哪個 repo/路徑失敗，這樣使用者回報錯誤畫面就能直接定位。
    const ctxParts = [];
    if(payload && payload.action) ctxParts.push(payload.action);
    if(payload && payload.repo) ctxParts.push("@" + payload.repo);
    if(payload && payload.path) ctxParts.push(payload.path);
    const ctx = ctxParts.length ? `[${ctxParts.join(" ")}] ` : "";
    throw new Error(ctx + (data.error || (res.status + " " + res.statusText)));
  }
  return data;
}

/* ============================================================
   GitHub 讀／寫——讀跟寫是兩條不同的路：
   - 讀（getFile/listDir）：Internal-Pages／asstudiowebsite 都是公開
     repo（GitHub Pages 本來就對外公開服務），讀公開內容不需要密鑰，
     優先直接打 GitHub 公開 API（ghFetchPublic），完全不吃 Netlify
     Function 的用量——這是 2026-08-25 從「每次讀寫都經過 Netlify」
     改過來的，因為單筆案例存檔背後常態性要讀 20 幾次（尤其
     regenerateCaseLinksManifest 要重讀每一筆案例、每個章節），佔了
     Netlify 用量的大宗，而這些內容全部都是公開資料，繞道直接讀完全
     不影響安全性。未登入的公開 API 有「每小時 60 次」的上限，真的
     在同一小時內讀到觸頂（或離線、被瀏覽器擋掉之類的暫時性問題）
     時，才退回原本「經過 Netlify github-proxy」的路徑重試一次——這條
     備援路徑一樣算 Netlify 用量，只在直接讀取真的不通時才會用到，
     不是預設路徑。
   - 寫（putFile/deleteFile/uploadAsset）：一定要用藏在 Netlify 環境
     變數裡的服務帳號 token 才能寫，登入的人沒有自己的 GitHub 帳號/
     權限，這部分沒有「直接打公開 API」這個選項，固定走 Netlify
     github-proxy，沒有變。
   ============================================================ */
function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

function decodeGhFileData(data){
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  return { sha: data.sha, content };
}

// repo 是選填的白名單參數：不帶就維持讀/寫 Internal-Pages（原本的
// 行為），只有「新增子頁面」相關流程需要讀/寫 asstudiowebsite 那邊的
// .dc.html 骨架時才會帶 "asstudiowebsite"。網路離線、或這個請求本身
// 出問題（不是 GitHub 回應了 404/403 這種「有回應但失敗」，而是連
// fetch 都丟例外）時回傳 null，讓呼叫端知道要退回 Netlify，而不是把
// 例外整個往外丟——直接讀取失敗本來就有備援，不該讓使用者看到「直接
// 讀取那條路」的技術性錯誤訊息。
async function ghFetchPublic(path, repo){
  const url = `https://api.github.com/repos/as-studio001/${repo || "Internal-Pages"}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=main&_=${Date.now()}`;
  try{
    return await fetch(url, { cache: "no-store" });
  }catch(networkErr){
    return null;
  }
}

async function ghGetFile(path, repo){
  const res = await ghFetchPublic(path, repo);
  const data = (res && res.ok) ? await res.json() : await callFunction("github-proxy", { action: "getFile", path, repo });
  const { sha, content } = decodeGhFileData(data);
  return { sha, content, json: JSON.parse(content) };
}

// 跟 ghGetFile 一樣，只是不假設檔案內容是 JSON——用來讀 .dc.html 這種原始
// 檔案（例如「新增子頁面」要抓現成的 .dc.html 樣板來源檔時），硬要塞進
// ghGetFile 的 JSON.parse 會直接噴錯。
async function ghGetFileRaw(path, repo){
  const res = await ghFetchPublic(path, repo);
  const data = (res && res.ok) ? await res.json() : await callFunction("github-proxy", { action: "getFile", path, repo });
  return decodeGhFileData(data);
}

// 目錄不存在時，GitHub 的公開 API 回 404——跟 github-proxy.js 原本的
// listDir 行為一致，當作「這個資料夾目前是空的」回傳空陣列，不是錯誤
// （例如自訂章節/子頁面功能都還沒有人用過時，對應的資料夾根本不存在）。
async function ghListDir(path, repo){
  const res = await ghFetchPublic(path, repo);
  if(res && res.status === 404) return [];
  if(res && res.ok) return res.json();
  return callFunction("github-proxy", { action: "listDir", path, repo });
}

async function ghPutFile(path, base64Content, message, sha, repo){
  return callFunction("github-proxy", { action: "putFile", path, content: base64Content, message, sha, repo });
}

async function ghDeleteFile(path, message, sha, repo){
  return callFunction("github-proxy", { action: "deleteFile", path, message, sha, repo });
}

function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* 上傳前先用 canvas 縮圖＋重新壓縮成 JPEG——相機原始檔案動輒
   4000~8000px、好幾 MB，GitHub API 又要求轉成 base64（體積再漲
   1/3），不壓縮的話上傳會很慢。已經夠小的檔案（本來就在合理尺寸內、
   體積也不大）就直接用原檔，不要為了壓縮反而讓小圖檔案變大或失真。
   壓縮失敗（例如瀏覽器不支援的格式）就退回原始檔案，不讓上傳整個失敗。*/
function compressImageFile(file, maxDimension, quality){
  return new Promise((resolve) => {
    if(!file.type || !file.type.startsWith("image/") || file.type === "image/svg+xml" || file.type === "image/gif"){
      resolve(file);
      return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDimension / Math.max(img.naturalWidth, img.naturalHeight));
      if(scale >= 1 && file.size < 1.5 * 1024 * 1024){
        resolve(file);
        return;
      }
      const width = Math.max(1, Math.round(img.naturalWidth * scale));
      const height = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        if(!blob){ resolve(file); return; }
        const newName = file.name.replace(/\.\w+$/, "") + ".jpg";
        resolve(new File([blob], newName, { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function sanitizeFilename(name){
  return name.replace(/[^\w.\-一-鿿]+/g, "_");
}

/* 上傳一張照片到指定資料夾（案例照片放 images/<slug>/，主網站案例卡片
   放 images/site/），檔名衝突就自動加時間戳記，回傳最終路徑 */
async function uploadAsset(file, folder){
  const compressed = await compressImageFile(file, 2400, 0.82);
  assertUploadSize(compressed);
  const filename = sanitizeFilename(compressed.name);
  const b64 = await readFileAsBase64(compressed);
  // 一般照片經過壓縮後通常遠小於 1MB，走 GitHub 原本那支「Contents API」
  // 就好；影片／GIF 沒辦法壓縮瘦身，體積比較大時改用後端的 Git Data API
  // 路徑（見 github-proxy.js 的 uploadViaBlob），才不會卡在 Contents API
  // 單檔上限。用「壓縮後檔案是不是明顯偏大」判斷，不是只看副檔名——同樣
  // 邏輯，門檻抓保守一點（900KB），寧可小檔案也走比較慢的那條路，不要
  // 大檔案誤走進小檔案那條路失敗。
  const useBlob = compressed.size > 900 * 1024;
  const data = await callFunction("github-proxy", { action: "uploadAsset", folder, filename, content: b64, useBlob });
  return data.path;
}

/* 章節「顯示在主網站章節」卡片本來直接拿案例自己的主視覺大圖當縮圖
   （大圖是給整頁 16:9 全幅用的，動輒好幾百 KB~1MB+），首頁 CASES 那排
   卡片只需要一個小小的 4:3 縮圖，卻要下載一整張大圖，是「首頁載入照片
   很久」的原因之一。存檔勾選章節時改成另外產生一份專用縮圖（用 canvas
   縮到卡片實際會用到的尺寸再壓縮），卡片改連到這份縮圖，不再共用原始
   大圖。大圖沒換過就不重新產生，避免每次存檔都多壓一次、多留一份檔案。*/
function loadImageSameOrigin(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("縮圖來源圖片讀取失敗"));
    img.src = url;
  });
}

async function makeCardThumbnailBlob(heroUrl, maxDimension, quality){
  const img = await loadImageSameOrigin(heroUrl);
  const scale = Math.min(1, maxDimension / Math.max(img.naturalWidth, img.naturalHeight));
  const width = Math.max(1, Math.round(img.naturalWidth * scale));
  const height = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  canvas.getContext("2d").drawImage(img, 0, 0, width, height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
}

/* 只有「這個案例還沒產生過卡片縮圖」或「大圖換過了」才重新產生+上傳，
   結果（縮圖路徑、對應的大圖路徑）記回 ed.item，讓下次存檔可以直接
   判斷不用重做。呼叫端要記得把回傳結果寫回 ed.item 再存檔。*/
async function ensureCardThumbnail(ed){
  const heroPath = ed.item.hero;
  if(!heroPath) return null;
  if(ed.item.cardThumbnail && ed.item.cardThumbnailHero === heroPath){
    return ed.item.cardThumbnail;
  }
  const heroUrl = `https://as-studio001.github.io/Internal-Pages/${heroPath}`;
  const blob = await makeCardThumbnailBlob(heroUrl, 900, 0.78);
  if(!blob) return null;
  const b64 = await readFileAsBase64(blob);
  const data = await callFunction("github-proxy", {
    action: "uploadAsset", folder: "images/site", filename: `card-${ed.item.slug}.jpg`, content: b64,
  });
  ed.item.cardThumbnail = data.path;
  ed.item.cardThumbnailHero = heroPath;
  return data.path;
}

/* ============================================================
   路徑式讀寫（處理任意深度的巢狀資料，例如 "photos.2.caption"、
   "detailPhotos.1.caption"），文字輸入用「打字當下直接寫回
   state，不整個重畫畫面」，只有新增/刪除/上傳這種「結構改變」的操作
   才會呼叫 rerenderEditor() 整個重畫，這樣打字就不會卡頓、游標也不會
   跳掉。
   ============================================================ */
function getPath(obj, path){
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, value){
  const keys = path.split(".");
  let o = obj;
  for(let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
}

function reorderPhotos(ed, basePath, from, to){
  const list = getPath(ed.item, basePath);
  if(!list || from === to || from < 0 || to < 0 || from >= list.length || to >= list.length) return;
  const [moved] = list.splice(from, 1);
  list.splice(to, 0, moved);
}

// 跟這個後台自己一樣是 as-studio001.github.io 底下的路徑，同一個
// origin，postMessage 收發不會被同源政策擋）。帶 ?preview=1 會讓
// HeroText.tsx（asarch 那邊的元件）打開可拖曳/可縮放/可接收 postMessage
// 的編輯模式，一般訪客網址不會帶這個參數，完全不受影響。
const HERO_PREVIEW_URL = "https://as-studio001.github.io/asarch/?preview=1";

// iframe 內部「模擬視窗」固定用這個尺寸渲染（不管外層框框實際顯示
// 多大），代表「典型桌機」的畫面比例（16:9）——這個尺寸必須固定，
// 不能跟著外層框框的長寬比變動：底圖照片用 object-cover（照容器長寬比
// 裁切/縮放）、文字位置用 vh（相對視窗高度）這兩樣東西都是「畫面比例
// 不同，算出來的結果就不同」，如果讓 iframe 內部的模擬比例跟著外層
// 框框（會因為瀏覽器視窗寬度、面板換行而變）跑，照片的裁切方式跟文字
// 的相對位置就會跟著漂移，變成「預覽看到的相對位置」跟「真正桌機訪客
// 看到的相對位置」對不起來——這正是 2026-08-25 發現的問題，比黑邊本身
// 更嚴重（黑邊只是難看，這個是位置真的不準，沒辦法拿來精準對位）。
// 固定 1600×900 之後改用「鋪滿＋裁切多出來的部分」（見
// layoutHeroPreview 的 Math.max），不會再留黑邊，只是框框長寬比抓得
// 不夠好時，畫面上下或左右可能看不到 1600×900 的每一個角落，但看得到
// 的部分，位置一定跟真正桌機訪客看到的一致。
const HERO_PREVIEW_REF_W = 1600;
const HERO_PREVIEW_REF_H = 900;

// 管理員交接用的問答機器人——原本是 Gemini Gem，2026-08-26 改成
// NotebookLM 筆記本。Google 的網頁（不管是 gemini.google.com 還是
// notebooklm.google.com）一律回 X-Frame-Options: DENY，不能嵌進
// iframe，沒有繞過的方法。改成用 window.open() 開一個獨立的小視窗
// （不是嵌在頁面裡，是瀏覽器另開一個真正的頂層視窗，不受
// X-Frame-Options 限制），固定用同一個視窗名稱（"asStudioAdminBot"）
// ——這樣按第二次不會又開一個重複的視窗，瀏覽器會直接把原本那個視窗
// 帶到最前面，效果類似一個常駐在旁邊的小助手視窗，同時後台這頁本身
// 不會被導離開、不會遺失正在編輯的內容。
const ADMIN_BOT_URL = "https://notebook.google.com/notebook/0798b1eb-5d49-44c4-ab3d-f2d8a0ecb61a?authuser=1";

// renderTopBar() 在後台每個畫面（案例列表、案例編輯器、主網站內容、
// 子頁面、主網頁、使用者管理……）都會被各自獨立呼叫一次，每次都是整段
// innerHTML 重新產生——如果比照 logoutBtn 那樣在每個呼叫端各自
// getElementById 綁一次事件，這顆按鈕就要在十幾個地方各補一行，漏掉
// 哪個畫面就會在那個畫面按不動。改用事件代理（掛在 document 上、只掛
// 一次，靠事件冒泡判斷點到的是不是這顆按鈕），不管哪個畫面重畫幾次、
// 按鈕本身的 DOM 元素換了幾輪，都不用另外重新綁定。
// 這個小視窗裡顯示的是 gemini.google.com 自己的網頁（跨網域），我們的
// 程式碼完全碰不到裡面的內容/樣式/Logo，能調整的只有「視窗本身」這一
// 層：用完整的視窗參數字串（不是只給 width/height）讓瀏覽器把它當成
// 一個乾淨的小工具視窗開（沒有分頁列、書籤列、選單列——這是瀏覽器
// 依「有沒有給齊這些參數」判斷要不要用精簡外觀，不是每個都會生效，
// 但給比不給更有機會拿到乾淨的外觀），並且固定停靠在目前螢幕的右下角
// （用 screen.availWidth/availHeight 現場算，不管使用者的螢幕多大都會
// 貼齊右側），感覺比較像一個常駐在旁邊、貼齊螢幕右緣的側欄，不是隨機
// 彈在畫面正中間的一般分頁。2026-08-26 依使用者截圖指定的位置調整：
// 從「420×760、貼右下角、留 24px 邊距」改成「貼齊螢幕右緣、上緣到
// 下緣幾乎整個滿版」，寬度不變，高度改用整個可用高度。
document.addEventListener("click", (e) => {
  if(!e.target.closest("#adminBotBtn")) return;
  const w = 420;
  const availW = screen.availWidth || window.innerWidth;
  const availH = screen.availHeight || window.innerHeight;
  const h = Math.round(availH);
  const left = Math.max(0, Math.round(availW - w));
  const top = 0;
  const features = `width=${w},height=${h},left=${left},top=${top},toolbar=no,location=no,menubar=no,status=no,scrollbars=yes,resizable=yes,noopener`;
  window.open(ADMIN_BOT_URL, "asStudioAdminBot", features);
});

// 四個章節的案例卡片都是「照片＋連結＋標題」格式，勾選後會自動把案例
// 加進對應章節的 cases[]。原型展覽另外還有 3 張相簿彈窗卡片（ADA建築展／
// 構竹林鐵／台北藝廊展），那 3 張結構不同（點下去開相簿，不是外部連結），
// 是寫死在 asarch 原始碼裡的，這裡的自動連結只會動到 cases[] 陣列本身，
// 不會影響那 3 張。
//
// hamburger 旗標決定這個章節的案例連結要不要一併同步進漢堡選單清單
// （見 regenerateCaseLinksManifest）——原型數位是 false：它自己的跳轉
// 卡片可以像其他章節一樣勾選「建築案例」來連結、修改照片/標題時一樣會
// 自動同步到章節卡片（不會再資料脫節），但特意不進漢堡選單，跟其他三
// 個章節分開處理。
// preferExternal：原型數位這個章節的定位本身就是「展示數位／外部版本」
// （裡面其他卡片全部連到外部的 Wix 展覽網站），所以掛在這個章節底下的
// 卡片，只要案例有填外部網站連結，就該連到那個外部網址，即使是一般
// 子網頁（有自己完整內頁）也一樣——這是唯一一個「同一個案例、不同章節
// 連到不同網址」的例外，見 caseHrefForChapter()。
const CASE_CARD_CHAPTERS = [
  { name: "chapter-restore", label: "原型修復", file: "content/site/chapter-restore.json", hamburger: true },
  { name: "chapter-exhibit", label: "原型展覽", file: "content/site/chapter-exhibit.json", hamburger: true },
  { name: "chapter-detail", label: "原型細部", file: "content/site/chapter-detail.json", hamburger: true },
  { name: "chapter-digital", label: "原型數位", file: "content/site/chapter-digital.json", hamburger: false, preferExternal: true },
];

async function loadCaseList(){
  const entries = await ghListDir("content/projects");
  const files = entries.filter(e => e.type === "file" && e.name.endsWith(".json"));
  const items = await Promise.all(files.map(async f => {
    try{
      const { json } = await ghGetFile(f.path);
      return { slug: json.slug || f.name.replace(/\.json$/, ""), title: json.title || "", ledeMeta: json.ledeMeta || "", hero: json.hero || "", type: json.type || "subpage", published: json.published !== false, externalUrl: json.externalUrl || "" };
    }catch(e){
      return { slug: f.name.replace(/\.json$/, ""), title: "（讀取失敗）", ledeMeta: "", hero: "", type: "subpage", published: true, externalUrl: "" };
    }
  }));
  state.cases = items;
}

async function loadSubpageList(){
  const entries = await ghListDir("content/subpages");
  const files = entries.filter(e => e.type === "file" && e.name.endsWith(".json"));
  const items = await Promise.all(files.map(async f => {
    const slug = f.name.replace(/\.json$/, "");
    const page = SUBPAGE_PAGES[slug];
    try{
      const { json } = await ghGetFile(f.path);
      return { slug, title: json.title || (page && page.label) || slug };
    }catch(e){
      return { slug, title: "（讀取失敗）" };
    }
  }));
  state.subpages = items;
}

const app = document.getElementById("app");

function render(){
  if(SETUP_INCOMPLETE){
    app.innerHTML = `
      <div class="wrap">
        <div class="login-screen">
          <h1>後台尚未設定完成</h1>
          <p>需要先設定 Supabase 專案跟寫入 GitHub 用的後端服務，請聯絡管理者完成設定。</p>
        </div>
      </div>
    `;
    return;
  }
  if(isInviteOrRecoveryLink()){
    renderSetPassword();
    return;
  }
  if(!authSession || !state.user){
    renderLogin();
    return;
  }
  if(state.editingCase){ renderCaseEditor(); return; }
  if(state.editingSite){ renderSiteEditor(); return; }
  if(state.editingSubpage){ renderSubpageEditor(); return; }
  if(state.editingHomepage){ renderHomepageEditor(); return; }
  renderList();
}

function renderLogin(){
  app.innerHTML = `
    <div class="wrap">
      <div class="login-screen">
        <h1>後台管理</h1>
        <p>用 email 跟密碼登入。要讓新的人可以進來，登入後到「使用者管理」分頁輸入對方 email 發送邀請信即可，不用申請 GitHub 帳號。</p>
        <input type="email" id="loginEmail" placeholder="email" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password">
        <button class="btn primary" id="loginBtn">登入</button>
        <button type="button" class="back-link" id="forgotPasswordBtn">忘記密碼？</button>
      </div>
    </div>
  `;
  document.getElementById("forgotPasswordBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    if(!email){ toast("請先在上面填 email，再點忘記密碼", true); return; }
    try{
      setLoading(true, "寄送重設密碼信中…");
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if(error) throw error;
      toast("重設密碼信已寄出，請到信箱點連結設定新密碼");
    }catch(err){
      toast(err.message || "寄送失敗", true);
    }finally{
      setLoading(false);
    }
  });
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if(!email || !password){ toast("請輸入 email 跟密碼", true); return; }
    try{
      setLoading(true, "登入中…");
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      authSession = data.session;
      state.user = { email: data.user.email };
      setLoading(true, "載入案例清單中…");
      await loadCaseList();
      render();
    }catch(err){
      toast(err.message || "登入失敗", true);
    }finally{
      setLoading(false);
    }
  });
}

/* 第一次點邀請信連結、或點了「忘記密碼」連結時，Supabase 會帶著
   type=invite / type=recovery 的網址跳回這個頁面——不管哪一種都先強制
   設一次密碼才能繼續，設完就跟一般登入一樣進到後台。 */
function renderSetPassword(){
  app.innerHTML = `
    <div class="wrap">
      <div class="login-screen">
        <h1>設定密碼</h1>
        <p>請先設定密碼，之後就用 email + 這組密碼登入後台。</p>
        <input type="password" id="newPassword" placeholder="設定密碼（至少 6 個字）" autocomplete="new-password">
        <button class="btn primary" id="setPasswordBtn">設定密碼並進入後台</button>
      </div>
    </div>
  `;
  document.getElementById("setPasswordBtn").addEventListener("click", async () => {
    const password = document.getElementById("newPassword").value;
    if(!password || password.length < 6){ toast("密碼至少要 6 個字", true); return; }
    try{
      setLoading(true, "設定密碼中…");
      const { data, error } = await sb.auth.updateUser({ password });
      if(error) throw error;
      const { data: sessionData } = await sb.auth.getSession();
      authSession = data.session || sessionData.session;
      // 密碼真的設完了，這個 flag 的任務結束——不清掉的話 render() 會
      // 一直誤判「這還是邀請信連結」，卡在設定密碼畫面出不去。
      AUTH_LINK_TYPE = null;
      history.replaceState(null, "", location.pathname);
      if(!authSession){ toast("設定成功，請重新登入", false); render(); return; }
      state.user = { email: authSession.user.email };
      setLoading(true, "載入案例清單中…");
      await loadCaseList();
      render();
    }catch(err){
      toast(err.message || "設定密碼失敗", true);
    }finally{
      setLoading(false);
    }
  });
}

function renderTabContent(){
  const el = document.getElementById("tabContent");
  if(state.tab === "cases"){ el.innerHTML = casesListHtml(); bindListEvents(); return; }
  if(state.tab === "users"){ el.innerHTML = usersListHtml(); bindUsersEvents(); return; }
  if(state.tab === "subpages"){ el.innerHTML = subpagesListHtml(); bindListEvents(); return; }
  if(state.tab === "homepage"){ el.innerHTML = homepageListHtml(); bindHomepageListEvents(); return; }
  el.innerHTML = siteListHtml();
  bindListEvents();
}

async function loadUsers(){
  const data = await callFunction("list-users", {});

function usersListHtml(){
  if(state.users == null) return `<div class="empty-note">載入中…</div>`;
  return `
    <div class="field-block">
      <div class="label">邀請新使用者</div>
      <div style="display:flex;gap:10px;max-width:420px">
        <input type="email" id="inviteEmail" placeholder="email" style="flex:1">
        <button class="btn primary" id="inviteBtn">發送邀請</button>
      </div>
      <div class="field-hint">對方會收到一封邀請信，點連結設定密碼後就能登入這個後台。</div>
    </div>
    <div class="field-block">
      <div class="label">目前有權限的人</div>
      ${state.users.length === 0 ? `<div class="empty-note">目前沒有使用者</div>` : `
        <div class="photo-layout-groups">
          ${state.users.map((u) => `
            <div class="photo-layout-row">
              <span>${esc(u.email)}</span>
              ${u.invited ? `<span class="field-hint" style="margin:0">（尚未接受邀請）</span>` : ""}
              <button type="button" class="row-remove-btn" data-remove-user="${esc(u.id)}" title="移除">×</button>
            </div>
          `).join("")}
        </div>
      `}
    </div>
  `;
}

function bindUsersEvents(){
  if(state.users == null){
    loadUsers().then(renderTabContent).catch((err) => toast(err.message || "載入使用者失敗", true));
    return;
  }
  document.getElementById("inviteBtn").addEventListener("click", async () => {
    const email = normalizeFullwidth(document.getElementById("inviteEmail").value.trim());
    if(!email){ toast("請輸入 email", true); return; }
    try{
      setLoading(true, "發送邀請中…");
      await callFunction("invite-user", { email });
      toast("邀請信已發送");
      state.users = null;
      renderTabContent();
    }catch(err){
      toast(err.message || "發送邀請失敗", true);
    }finally{
      setLoading(false);
    }
  });
  app.querySelectorAll("[data-remove-user]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if(!confirm("確定要移除這個使用者的權限嗎？")) return;
      try{
        setLoading(true, "移除中…");
        await callFunction("remove-user", { userId: btn.dataset.removeUser });
        state.users = null;
        renderTabContent();
      }catch(err){
        toast(err.message || "移除失敗", true);
      }finally{
        setLoading(false);
      }
    });
  });
}

}

function casesListHtml(){
  if(!state.cases) return `<div class="empty-note">載入中…</div>`;
  const indexed = state.cases.map((c, i) => ({ c, i }));
  const subpageCards = indexed.filter(({ c }) => c.type !== "external").map(({ c, i }) => caseCardHtml(c, i)).join("");
  const externalCards = indexed.filter(({ c }) => c.type === "external").map(({ c, i }) => caseCardHtml(c, i)).join("");
  return `
    <div class="item-grid">

// 存檔／章節連結／漢堡選單同步邏輯），差別只在編輯畫面：一般子網頁維持
// 原本完整的內頁欄位；外部連結網頁只給照片／標題／簡短說明／外部網址，
// 其餘欄位留空值，這樣就算有人手動跳去看它自己的內頁（?case=slug）也
// 不會因為缺欄位而壞掉，只是內容是空的。
function blankCase(type){
  if(type === "external"){
    return { slug: "", title: "", ledeMeta: "", hero: "", externalUrl: "", published: true, type: "external" };
  }
  return {
    slug: "", title: "", ledeMeta: "", tag: "", hero: "",
    paragraphs: [""], photos: [],
    externalUrl: "", externalUrlCover: "", youtubeUrl: "",
    map: { address: "", lat: null, lng: null, zoom: 17 },
    detailPhotos: [], drawings: [],
    published: true,
    type: "subpage",
  };
}

function openCaseEditor(item, sha, isNew){
  state.editingCase = { item, sha, isNew, pendingUploads: {}, linkedChapters: [], linkedChapterHrefs: [] };
  render();
  if(!isNew && item.slug) loadLinkedChapters(item);
}
function closeCaseEditor(){ state.editingCase = null; render(); }

// 一個案例的跳轉網址一般情況下一律連自己的內頁，不管有沒有在④填了
// 「外部網站連結」——那個欄位預設只負責這個案例自己內頁裡的「網站」
// 區塊，不該連帶把首頁的章節卡片也導去別的網站，不然訪客從首頁點進來
// 會直接被帶去別的網址，看不到這個案例真正的內頁內容。
// 只有兩種情況例外，會改用外部網址：①這個案例本身就是「外部連結網頁」
// （type === "external"，本來就沒有內頁內容，存在的唯一目的就是跳出
// 去）；②掛在 preferExternal 的章節底下（目前只有「原型數位」——那個
// 章節本身就是「數位／外部版本」展示區，其他卡片全部連到外部網站，
// 同一個案例掛在那裡也該跟著連出去，即使它自己另外有完整內頁）。
function caseHrefForChapter(item, meta){
  const wantsExternal = item.type === "external" || (meta && meta.preferExternal);
  if(wantsExternal){
    const trimmed = (item.externalUrl || "").trim();
    if(trimmed) return trimmed;
  }
  return `https://as-studio001.github.io/Internal-Pages/?case=${item.slug}`;
}

// 沿用給不需要分辨章節的地方用（漢堡選單清單一律連內頁，因為能進漢堡
// 選單的章節都不是 preferExternal）。
function caseTargetHref(slug, externalUrl, type){
  return caseHrefForChapter({ slug, externalUrl, type }, null);
}

/* 打開一個既有案例時，順便去問每個章節的 JSON 裡有沒有已經連結這個
   案例的卡片，讓「顯示在主網站章節」的勾選框正確反映現況（而不是每次
   打開都預設全部沒勾），這樣移除章節連結也可以直接在這裡做。同一個
   案例在不同章節可能連的是不同網址（見 caseHrefForChapter），所以每個
   章節各自算一次、各自記住當下用的是哪個網址（linkedChapterHrefs）——
   之後存檔時，如果外部連結網址被改掉了，才知道每個章節原本的卡片是
   用哪個網址連結的，可以正確換掉而不是留下孤兒卡片。 */
async function loadLinkedChapters(item){
  const found = [];
  for(const meta of CASE_CARD_CHAPTERS){
    try{
      const { json } = await ghGetFile(meta.file);
      const href = caseHrefForChapter(item, meta);
      if((json.cases || []).some((c) => c.href === href)) found.push({ name: meta.name, href });
    }catch(e){ /* 忽略單一章節讀取失敗，不擋住整個編輯畫面 */ }
  }
  if(state.editingCase && state.editingCase.item.slug === item.slug){
    state.editingCase.linkedChapterHrefs = found;
    state.editingCase.linkedChapters = found.map((f) => f.name);
    if(!state.editingCase.isNew) rerenderCurrentEditor();
  }
}

   文字／頂部大圖／輪播縮圖／右側大照片／案例卡片），存檔時才決定
   slug/檔名，不用先打好標題才能開始編輯。 */
function blankChapter(){

const RESERVED_CHAPTER_NAMES = new Set(["chapter-restore", "chapter-detail", "chapter-exhibit", "chapter-digital"]);

async function loadCustomChapters(){
  const entries = await ghListDir("content/site");
  const files = entries.filter((e) => e.type === "file" && /^chapter-.*\.json$/.test(e.name) && !RESERVED_CHAPTER_NAMES.has(e.name.replace(/\.json$/, "")));
  const items = await Promise.all(files.map(async (f) => {
    const slug = f.name.replace(/\.json$/, "");
    try{
      const { json } = await ghGetFile(f.path);
      return { slug, title: (json.title && (json.title["zh-Hant"] || json.title.en)) || slug };
    }catch(e){ return { slug, title: "（讀取失敗）" }; }
  }));
  state.customChapters = items;
}

/* 跟 regenerateCaseLinksManifest 同一套做法：把目前所有自訂章節的檔名
   整理成一份索引，asarch 首頁在瀏覽器端抓這份索引，才知道除了那 4 個
   固定章節之外還有哪些新章節要一起顯示（純資料抓取沒辦法直接列目錄，
   一定要有這份索引檔）。 */
async function regenerateExtraChaptersManifest(){
  try{
    await loadCustomChapters();
    const body = JSON.stringify({ chapters: state.customChapters.map((c) => c.slug) }, null, 2) + "\n";
    let sha = null;
    try{
      const existing = await ghGetFile("content/site/extra-chapters.json");
      sha = existing.sha;
    }catch(e){ /* 檔案還不存在就當新建，sha 留 null */ }
    await ghPutFile("content/site/extra-chapters.json", utf8ToBase64(body), "Regenerate extra-chapters index via admin", sha);
  }catch(e){
    console.error("regenerateExtraChaptersManifest failed", e);
  }
}

function resolveSrc(pendingUploads, srcValue){
  if(pendingUploads && pendingUploads[srcValue]) return pendingUploads[srcValue].previewUrl;
  return rawUrl(srcValue);
}

function coverDropHtml(fieldPath, imgSrc, small){
  return `
    <div class="cover-drop ${imgSrc ? "has-image" : ""} ${small ? "small" : ""}" data-cover-field="${esc(fieldPath)}">
      ${imgSrc
        ? `${mediaThumbHtml(imgSrc)}<div class="replace-hint">點擊或拖曳圖片／影片以更換</div>`
        : `<div class="placeholder">${iconUpload()}<span>點擊或拖曳圖片／影片／GIF</span></div>`
      }
      <input type="file" accept="image/*,video/*" style="display:none">
    </div>
  `;
}

function bindCoverDropEvents(ed, fieldPath, folder){
  const dropEl = app.querySelector(`[data-cover-field="${CSS.escape(fieldPath)}"]`);
  if(!dropEl) return;
  const fileInput = dropEl.querySelector("input[type=file]");
  dropEl.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if(fileInput.files[0]) handleCoverFile(ed, fieldPath, fileInput.files[0]);
  });
  ["dragover","dragenter"].forEach(evt => dropEl.addEventListener(evt, e => { e.preventDefault(); dropEl.classList.add("drag-over"); }));
  ["dragleave","drop"].forEach(evt => dropEl.addEventListener(evt, e => { e.preventDefault(); dropEl.classList.remove("drag-over"); }));
  dropEl.addEventListener("drop", e => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(isImageOrVideoFile(file)) handleCoverFile(ed, fieldPath, file);
  });
}

function handleCoverFile(ed, fieldPath, file){
  const tempKey = "PENDING::" + uid();
  ed.pendingUploads[tempKey] = { file, previewUrl: URL.createObjectURL(file) };
  setPath(ed.item, fieldPath, tempKey);
  rerenderCurrentEditor();
}

function photoListHtml(ed, basePath, listId, showCaption){
  const list = getPath(ed.item, basePath) || [];

function bindPhotoList(ed, basePath, listId, folder, refresh){
  const doRefresh = refresh || rerenderCurrentEditor;
  const wrap = document.getElementById(listId);
  if(!wrap) return;
  wrap.querySelectorAll("[data-remove-photo]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.removePhoto, 10);
      getPath(ed.item, basePath).splice(i, 1);
      doRefresh();
    });
  });
  const addBtn = wrap.querySelector("[data-add-photo]");
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = "image/*,video/*"; fileInput.multiple = true; fileInput.style.display = "none";
  addBtn.after(fileInput);
  addBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => addPhotoFiles(ed, basePath, Array.from(fileInput.files), doRefresh));
  ["dragover","dragenter"].forEach(evt => wrap.addEventListener(evt, e => { e.preventDefault(); wrap.classList.add("drag-over"); }));
  ["dragleave","drop"].forEach(evt => wrap.addEventListener(evt, e => { e.preventDefault(); wrap.classList.remove("drag-over"); }));
  wrap.addEventListener("drop", e => {
    const files = Array.from(e.dataTransfer.files || []).filter(isImageOrVideoFile);
    if(files.length) addPhotoFiles(ed, basePath, files, doRefresh);
  });

  // 清單裡的照片本身也能互相拖曳交換順序（跟從電腦拖新照片進來是不同的
  // 拖曳，靠 dataTransfer 有沒有真的檔案區分，兩邊互不干擾）
  let dragRowIndex = null;
  wrap.querySelectorAll(".photo-row").forEach((row) => {
    row.addEventListener("dragstart", () => { dragRowIndex = parseInt(row.dataset.photoIndex, 10); });
    row.addEventListener("dragover", (e) => { e.preventDefault(); e.stopPropagation(); row.classList.add("drag-target"); });
    row.addEventListener("dragleave", () => row.classList.remove("drag-target"));
    row.addEventListener("drop", (e) => {
      e.stopPropagation();
      row.classList.remove("drag-target");
      const toIndex = parseInt(row.dataset.photoIndex, 10);
      if(dragRowIndex == null || dragRowIndex === toIndex) return;
      reorderPhotos(ed, basePath, dragRowIndex, toIndex);
      dragRowIndex = null;
      doRefresh();
    });
  });
}

function addPhotoFiles(ed, basePath, files, refresh){
  const list = getPath(ed.item, basePath);
  files.forEach(file => {
    const tempKey = "PENDING::" + uid();
    ed.pendingUploads[tempKey] = { file, previewUrl: URL.createObjectURL(file) };
    list.push({ src: tempKey, caption: "" });
  });
  (refresh || rerenderCurrentEditor)();
}

    Array.from(fileInput.files).forEach(file => {
      const tempKey = "PENDING::" + uid();
      ed.pendingUploads[tempKey] = { file, previewUrl: URL.createObjectURL(file) };
      list.push(tempKey);
    });
    rerenderCurrentEditor();
  });
}

/* 把 ed.item 裡所有指向 pendingUploads 的暫時 key，實際上傳到對應資料夾，換成正式路徑 */
/* 存檔時要上傳的照片一次全部排隊、限制同時最多 4 張一起傳（不是一張
   傳完才傳下一張），存一個有好幾張新照片的案例會快很多；GitHub API
   還是有速率限制，4 個同時跑是安全、不會被擋掉的量。 */
async function flushPendingUploads(ed, folder){
  const keys = Object.keys(ed.pendingUploads);
  if(keys.length === 0) return;
  const concurrency = Math.min(4, keys.length);
  let cursor = 0;
  let done = 0;
  setLoading(true, `壓縮並上傳圖片中… (0/${keys.length})`);
  async function worker(){
    while(cursor < keys.length){
      const key = keys[cursor++];
      const finalPath = await uploadAsset(ed.pendingUploads[key].file, folder);
      replaceValueDeep(ed.item, key, finalPath);
      delete ed.pendingUploads[key];
      done++;
      setLoading(true, `壓縮並上傳圖片中… (${done}/${keys.length})`);
    }
  }
  await Promise.all(Array.from({ length: concurrency }, worker));
}
function replaceValueDeep(obj, oldVal, newVal){
  if(Array.isArray(obj)){ obj.forEach(v => replaceValueDeep(v, oldVal, newVal)); return; }
  if(obj && typeof obj === "object"){
    Object.keys(obj).forEach(k => {
      if(obj[k] === oldVal) obj[k] = newVal;
      else if(typeof obj[k] === "object") replaceValueDeep(obj[k], oldVal, newVal);
    });
  }
}

   才能存檔上線，用得到的欄位都完成後其實就可以存檔了（其他都選填）。
   即時更新：iframe 裡編輯（cms-edit）或打段落文字都會呼叫
   refreshNewCaseGuide 重新算一次哪幾項完成了。 */
function newCaseGuideHtml(ed){
  if(!ed.isNew) return "";
  const c = ed.item;
  const steps = [
    { done: !!(c.title && c.title.trim()), label: "填案名（下面第 1 區塊，直接點預覽裡的標題文字打字）" },
    { done: !!c.hero, label: "上傳大圖（第 1 區塊，點大圖的位置）" },
    { done: (c.paragraphs || []).some((p) => p && p.trim()), label: "寫內文段落（第 2 區塊）" },
    { done: (c.photos || []).length > 0, label: "上傳內文照片（第 2 區塊，至少 1 張）" },
  ];
  const doneCount = steps.filter((s) => s.done).length;
  const allDone = doneCount === steps.length;
  return `
    <div class="new-case-guide ${allDone ? "all-done" : ""}">
      <div class="new-case-guide-title">${allDone ? "✓ 這個案例可以存檔上架了" : `新案例上架步驟（${doneCount}/${steps.length}）`}</div>
      <ul class="new-case-guide-list">
        ${steps.map((s) => `<li class="${s.done ? "done" : ""}">${s.done ? "✓" : "○"} ${s.label}</li>`).join("")}
      </ul>
      <div class="field-hint">以上都完成後，捲到最下面按「儲存並發布」就會正式上線。分類標籤、顯示在主網站章節、More in Detail、基地位置都是選填，之後隨時可以回來補。</div>
    </div>
  `;
}

   選單同步邏輯（saveCaseEditor 用 c.type 判斷要走哪個畫面，儲存流程

// 類型分錯的話，兩種編輯畫面都有一顆按鈕可以直接換過去，不用刪掉重建。
// 標題／簡短說明／照片／網址代號這些兩種類型共有的欄位會留著；換成
// 外部連結網頁會把內文/照片牆/位置這些一般子網頁專屬欄位整個丟掉（換
// 回來的話就是空的，不是保留），換成一般子網頁則會把 externalUrl 清掉
// ——不清掉的話，即使畫面看起來是「一般子網頁」，存檔時章節卡片／
// 漢堡選單其實還是會照 externalUrl 跳出去，兩邊會對不起來。換完只是
// 切換編輯畫面，還沒真的存檔，使用者看過內容確認沒問題再自己按儲存。
function convertCaseType(ed, newType){
  const c = ed.item;
  if(newType === "external"){
    if(!confirm("切換成「外部連結網頁」嗎？內文段落、照片牆、設計研究、位置這些欄位的內容會被丟掉（還沒存檔，這步只是切換編輯畫面）。")) return;
    ed.item = {
      slug: c.slug || "", title: c.title || "", ledeMeta: c.ledeMeta || "",
      hero: c.hero || "", heroPosition: c.heroPosition || null, externalUrl: c.externalUrl || "",
      published: c.published !== false, type: "external",
    };
  } else {
    if(!confirm("切換成「一般子網頁」嗎？外部連結網址會被清掉，改成連到這個案例自己的內頁（還沒存檔，這步只是切換編輯畫面）。")) return;
    ed.item = {
      slug: c.slug || "", title: c.title || "", ledeMeta: c.ledeMeta || "", tag: "",
      hero: c.hero || "", heroPosition: c.heroPosition || null,
      paragraphs: [""], photos: [],
      map: { address: "", lat: null, lng: null, zoom: 17 },
      detailPhotos: [], drawings: [],
      published: c.published !== false, type: "subpage",
    };
  }
  rerenderCurrentEditor();
}
