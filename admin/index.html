<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理 — AS. studio</title>
<style>
:root{
  --paper:   #fbfaf8;
  --ink:     #201f1d;
  --muted:   #8a8781;
  --line:    #eae7e1;
  --accent:  #6b6355;
  --danger:  #b23b3b;
  --f-heading: 'Trebuchet MS', 'Yu Gothic', 'Meiryo', sans-serif;
  --f-body:    'Yu Gothic Light', 'Yu Gothic', 'Meiryo', sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
h1,h2,h3{ font-family:var(--f-heading); font-weight:700; letter-spacing:-0.01em; margin:0; }
input,textarea,select{ font-family:inherit; font-size:14px; }

.wrap{ max-width:1000px; margin:0 auto; padding:0 24px; }

.top-bar{ border-bottom:1px solid var(--line); padding:18px 0; margin-bottom:28px; }
.top-bar .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.top-bar .site-title{ font-family:var(--f-heading); font-weight:700; font-size:18px; }
.top-bar .site-title a{ text-decoration:none; color:var(--muted); font-weight:400; font-size:13px; margin-left:10px; }
.top-bar .user-box{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
.top-bar .user-box img{ width:26px; height:26px; border-radius:50%; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px; border-radius:5px; border:1px solid var(--line);
  background:#fff; color:var(--ink); font-size:13.5px; font-weight:600;
  transition:all .15s ease;
}
.btn:hover{ border-color:var(--ink); }
.btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn.primary:hover{ background:#000; }
.btn.danger{ color:var(--danger); border-color:#e6c9c9; }
.btn.danger:hover{ background:#fdf1f1; border-color:var(--danger); }
.btn.ghost{ border-color:transparent; background:none; color:var(--muted); padding:9px 10px; }
.btn.ghost:hover{ color:var(--ink); }
.btn.small{ padding:6px 12px; font-size:12.5px; }
.btn:disabled{ opacity:.5; cursor:default; }
.btn svg{ width:15px; height:15px; flex-shrink:0; }

.login-screen{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; text-align:center; padding:40px 20px;
}
.login-screen h1{ font-size:24px; }
.login-screen p{ color:var(--muted); max-width:360px; font-size:14px; line-height:1.7; }
.login-screen input{
  width:260px; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  background:#fff; color:var(--ink); font-size:14px;
}
.login-screen input:focus{ outline:none; border-color:var(--ink); }

.tab-nav{ display:flex; gap:6px; margin-bottom:28px; border-bottom:1px solid var(--line); }
.tab-nav button{
  padding:11px 18px; background:none; border:none; border-bottom:2px solid transparent;
  font-size:14.5px; font-weight:600; color:var(--muted); margin-bottom:-1px;
}
.tab-nav button.active{ color:var(--ink); border-color:var(--ink); }
.tab-nav button:hover{ color:var(--ink); }

.item-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:20px; padding-bottom:60px; }
.item-card{
  border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer;
  background:#fff; transition:box-shadow .15s ease, transform .15s ease;
}
.item-card:hover{ box-shadow:0 6px 18px rgba(32,31,29,0.1); transform:translateY(-2px); }
.item-card .thumb{ aspect-ratio:4/3; background:#efece5; overflow:hidden; }
.item-card .thumb img{ width:100%; height:100%; object-fit:cover; }
.item-card .thumb.empty{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
.item-card .info{ padding:12px 14px; }
.item-card .info .t{ font-size:14px; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-card .info .m{ font-size:12px; color:var(--muted); }
.add-card{
  border:1.5px dashed var(--line); border-radius:8px; aspect-ratio:4/3;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  color:var(--muted); cursor:pointer; background:none;
}
.add-card:hover{ border-color:var(--ink); color:var(--ink); }
.add-card svg{ width:26px; height:26px; }
.add-card span{ font-size:13px; font-weight:600; }

.editor{ padding-bottom:80px; }
.editor-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:12px; flex-wrap:wrap; }

/* 子頁面編輯器：左邊表單、右邊預覽，兩欄並排——右欄用 position:sticky 固定
   貼在畫面上，左邊表單往下捲動編輯到很後面的段落時，右邊預覽畫面還是留在
   看得到的地方，不用改完又捲回最上面才能對照效果。畫面窄的時候（例如筆電
   內建螢幕、或分割視窗）改回上下堆疊，並排會太擠反而更難用。 */
.wrap.wrap-wide{ max-width:1440px; }
.subpage-editor-columns{ display:flex; gap:32px; align-items:flex-start; }
.subpage-editor-left{ flex:1 1 0; min-width:0; }
.subpage-editor-right{ flex:1 1 0; min-width:0; position:sticky; top:20px; }
@media (max-width:1000px){
  .subpage-editor-columns{ flex-direction:column; }
  .subpage-editor-right{ position:static; width:100%; }
}
.back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13.5px; background:none; border:none; padding:0; }
.back-link:hover{ color:var(--ink); }
.field-block{ margin-bottom:26px; }
.field-block > label, .field-block > .label{
  display:block; font-family:var(--f-heading); font-weight:700; font-size:13px;
  letter-spacing:.02em; margin-bottom:8px; color:var(--ink);
}
.field-hint{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; }

.preview-section{ margin-bottom:44px; padding-bottom:36px; border-bottom:1px solid var(--line); }
.preview-section:last-of-type{ border-bottom:none; }
.preview-section-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.preview-section-head .label{ font-family:var(--f-heading); font-weight:700; font-size:15px; letter-spacing:.02em; color:var(--ink); }
.preview-section-num{
  display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
  background:var(--ink); color:#fff; font-size:12px; font-weight:700; flex-shrink:0;
}
.case-live-preview{ width:100%; border:1px solid var(--line); border-radius:8px; background:#0a0a0a; }
.field-block input[type=text], .field-block input[type=number], .field-block textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  background:#fff; color:var(--ink); resize:vertical;
}
.field-block input:focus, .field-block textarea:focus{ outline:none; border-color:var(--ink); }
.field-block textarea{ min-height:90px; line-height:1.7; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.three-col{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.four-col{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
@media (max-width:640px){ .two-col, .three-col, .four-col{ grid-template-columns:1fr; } }

.cover-drop{
  /* 一定要給明確的 width（不能只給 max-width）：這個容器沒有照片時，
     裡面唯一的內容 .placeholder 是 position:absolute（不算進版面計算），
     容器本身沒有任何「正常流」的內容可以撐出寬度——在 flex 版面裡（滑塊／
     得獎清單這幾個表單都是用 display:flex 把縮圖跟旁邊的文字欄位並排）
     沒有明確寬度的 flex item，寬度會塌縮到幾乎是 0px，整個上傳區塊變成
     使用者完全看不到、點不到的一個小點——曾經因為這樣被誤以為「沒有地方
     可以放照片」，其實只是版面塌陷，不是真的少了功能。 */
  aspect-ratio:16/9; width:100%; max-width:520px; border-radius:8px; overflow:hidden;
  background:#efece5; border:1.5px dashed var(--line); position:relative; cursor:pointer;
}
.cover-drop.has-image{ border-style:solid; }
.cover-drop img{ width:100%; height:100%; object-fit:cover; }
.cover-drop .placeholder{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; color:var(--muted); font-size:13px;
}
.cover-drop .placeholder svg{ width:26px; height:26px; }
.cover-drop:hover{ border-color:var(--ink); }
.cover-drop.drag-over{ border-color:var(--ink); background:rgba(107,99,85,0.08); }
.cover-drop .replace-hint{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(20,19,17,0.55); color:#fff; font-size:12.5px; opacity:0; transition:opacity .15s ease;
}
.cover-drop.has-image:hover .replace-hint{ opacity:1; }
.cover-drop.small{ width:200px; max-width:200px; aspect-ratio:4/3; flex-shrink:0; }

/* simple text list (paragraphs) */
.text-list-row{ display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
.text-list-row textarea{ flex:1; min-height:70px; }
.row-remove-btn{
  flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
  background:#fff; color:var(--muted); font-size:16px; line-height:1;
}
.row-remove-btn:hover{ color:var(--danger); border-color:var(--danger); }

/* photo list (with per-photo caption) */
.photo-list{ display:flex; flex-direction:column; gap:10px; }
.photo-list-drop{ border-radius:8px; transition:background .15s ease; }
.photo-list-drop.drag-over{ background:rgba(107,99,85,0.08); outline:1.5px dashed var(--ink); outline-offset:6px; }
.photo-row{ display:flex; gap:12px; align-items:center; transition:outline-color .15s ease; outline:2px solid transparent; outline-offset:2px; }
.photo-row.drag-target{ outline-color:var(--ink); }
.photo-row .drag-handle{ cursor:grab; color:var(--muted); font-size:16px; flex-shrink:0; }
.photo-row .thumb{ width:84px; height:63px; flex-shrink:0; border-radius:5px; overflow:hidden; background:#efece5; border:1px solid var(--line); }
.photo-row .thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-row input[type=text]{ flex:1; }
.add-photo-btn{
  align-self:flex-start; display:inline-flex; align-items:center; gap:8px;
  padding:9px 14px; border-radius:6px; border:1.5px dashed var(--line); background:none; color:var(--muted); font-size:13px; font-weight:600;
}
.add-photo-btn:hover{ border-color:var(--ink); color:var(--ink); }
.add-photo-btn svg{ width:16px; height:16px; }

/* step card (designResearch / process) */
.step-card{ border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; background:#fff; }
.step-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.step-card-head .step-label{ font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em; }
.add-step-btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:6px;
  border:1.5px dashed var(--line); background:none; color:var(--muted); font-size:13.5px; font-weight:600;
}
.add-step-btn:hover{ border-color:var(--ink); color:var(--ink); }

/* 拖曳排序（子頁面「內文段落」：段落之間、段落內的小標題／內文／照片之間都可以
   拖曳調整順序）——原生 HTML5 Drag and Drop，不依賴外部套件，見 makeSortable() */
.section-drag-handle, .block-drag-handle{
  cursor:grab; color:var(--muted); font-size:17px; line-height:1; user-select:none; flex-shrink:0;
  padding:6px 8px; margin:-6px -8px; border-radius:4px; transition:background-color .15s ease, color .15s ease;
}
.section-drag-handle:hover, .block-drag-handle:hover{ background:rgba(32,31,29,0.06); color:var(--ink); }
.section-drag-handle:active, .block-drag-handle:active{ cursor:grabbing; }
.section-card.dragging, .block-row.dragging{ opacity:.4; }
.block-row{ border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; background:var(--paper); }
.block-row-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.block-row-head .block-row-label{ font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.04em; }

/* 5-language block */
.lang5-block{ border:1px solid var(--line); border-radius:8px; padding:14px; background:#fff; }
.lang5-row{ margin-bottom:8px; }
.lang5-others{ margin-top:10px; }
.lang5-others summary{
  cursor:pointer; font-size:12px; color:var(--muted); font-weight:600; list-style:none; padding:6px 0;
}
.lang5-others summary::-webkit-details-marker{ display:none; }
.lang5-others summary::before{ content:"▸ "; }
.lang5-others[open] summary::before{ content:"▾ "; }
.lang5-others .translate-btn{ margin-top:8px; }
.lang5-row label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:3px; }
.lang5-row textarea{ min-height:56px; }
.translate-btn{
  margin-bottom:12px; padding:7px 14px; background:var(--ink); color:#fff; border:none; border-radius:5px;
  font-size:12.5px; font-weight:600;
}
.translate-btn:hover{ background:#000; }
.translate-btn:disabled{ opacity:.5; }

.case-card-editor{ border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; background:#fff; }
.case-card-editor-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }

#photoToolbar{
  border:1px solid var(--line); border-radius:8px; padding:14px 16px; background:#fff;
}
.photo-toolbar-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; }

.empty-note{ color:var(--muted); font-size:13px; font-style:italic; }
.chapter-picker{ display:flex; flex-wrap:wrap; gap:10px; }
.chapter-picker label{
  display:flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--line);
  border-radius:20px; font-size:13.5px; background:#fff; cursor:pointer;
}
.chapter-picker label:has(input:checked){ border-color:var(--ink); background:rgba(32,31,29,0.05); font-weight:600; }
.chapter-picker input{ margin:0; }

.save-bar{
  position:sticky; bottom:0; margin-top:32px; padding:16px 0; background:var(--paper);
  border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
}
.save-status{ font-size:12.5px; color:var(--muted); }
.save-status.err{ color:var(--danger); }

#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:6px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:999; max-width:90vw; text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.err{ background:var(--danger); }

#loadingOverlay{
  position:fixed; inset:0; background:rgba(251,250,248,0.85); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:998; font-size:14px; color:var(--muted);
}
#loadingOverlay.show{ display:flex; }

.spinner{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--ink);
  animation:spin .7s linear infinite; display:inline-block; margin-right:8px; vertical-align:-3px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingOverlay"><span class="spinner"></span><span id="loadingText">處理中…</span></div>
<div id="toast"></div>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   設定
   ============================================================ */
// 一定要在 supabase.createClient() 之前就先讀走網址上的 type=invite／
// type=recovery——supabase-js 自己也會偵測同一段網址 hash 來建立
// session，而且建立好之後會把 hash 清掉，如果我們自己判斷「這是不是
// 邀請信連結」的邏輯是等 createClient 呼叫完才去讀 location.hash，常常
// 會讀到已經被清空的網址，導致邀請信點進來直接跳過設密碼、直接登入。
let AUTH_LINK_TYPE = (/type=(invite|recovery)/.exec(location.hash) || [])[1] || null;

const REPO_OWNER = "as-studio001";
const REPO_NAME = "Internal-Pages";
const REPO_BRANCH = "main";
const RAW_BASE = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/`;

// 登入改成 email／密碼（Supabase），不用個人 GitHub 帳號——後台自己
// 「使用者管理」分頁就能寄邀請信、移除權限，不用再去 GitHub 網站設定
// Collaborators。實際寫入 GitHub 的動作也改成呼叫下面 FUNCTIONS_BASE
// 這個小後端服務（用同一組服務帳號 token 代為執行），因為登入的人
// 不再有自己的 GitHub 帳號可以直接寫。
// SUPABASE_URL / SUPABASE_ANON_KEY 是公開用的（Supabase 官方設計上
// anon key 本來就會放在前端程式碼裡，不是密鑰），FUNCTIONS_BASE 是
// 放這些 function 的 Netlify 站網址。三個都要換成實際的值才能用。
const SUPABASE_URL = "https://enjbqfgepvkpwlfqbldi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuamJxZmdlcHZrcHdsZnFibGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTUyODQsImV4cCI6MjEwMjg3MTI4NH0.7YAlMUGocaXenA6RPdDPNu60g48GgW0Nq8xAwxThilo";
const FUNCTIONS_BASE = "https://glittering-dodol-8e2041.netlify.app/.netlify/functions";

// 設定還沒填真正的值之前（SUPABASE_URL 還是預留字串）不要讓
// createClient 直接丟例外炸掉整支 script，不然連「尚未設定」的提示都
// 顯示不出來，畫面會整個空白。
const SETUP_INCOMPLETE = /^REPLACE_WITH_/.test(SUPABASE_URL) || /^REPLACE_WITH_/.test(SUPABASE_ANON_KEY) || /^REPLACE_WITH_/.test(FUNCTIONS_BASE);
const sb = SETUP_INCOMPLETE ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function rawUrl(path){
  if(!path) return "";
  if(/^https?:\/\//.test(path)) return path;
  return RAW_BASE + path.split("/").map(encodeURIComponent).join("/");
}
function esc(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}
function uid(){ return Math.random().toString(36).slice(2, 9); }

/* ============================================================
   Toast / loading
   ============================================================ */
let toastTimer = null;
function toast(msg, isErr){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(toastTimer);
  // 錯誤訊息留久一點（尤其是帶技術細節的那種，例如「新增子頁面」失敗時的
  // [action @repo path] 錯誤），一般成功提示還是照原本 3.2 秒，不然畫面上
  // 一直卡著提示框也很煩。
  toastTimer = setTimeout(() => el.classList.remove("show"), isErr ? 15000 : 3200);
}
function setLoading(on, text){
  document.getElementById("loadingText").textContent = text || "處理中…";
  document.getElementById("loadingOverlay").classList.toggle("show", !!on);
}

/* ============================================================
   Auth（Supabase email／密碼；後台自己的「使用者管理」分頁寄邀請信）
   ============================================================ */
let authSession = null;

if(sb){
  sb.auth.onAuthStateChange((_event, session) => {
    authSession = session;
  });
}

function isInviteOrRecoveryLink(){
  return !!AUTH_LINK_TYPE;
}

async function callFunction(name, payload){
  const res = await fetch(`${FUNCTIONS_BASE}/${name}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + (authSession ? authSession.access_token : ""),
    },
    body: JSON.stringify(payload || {}),
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    // 把 action/repo/path 標在錯誤訊息前面（例如 "[getFile @asstudiowebsite
    // 原型原點.dc.html]"），跨 repo 動作變多之後，光看「Not Found」很難猜
    // 是哪一步、對哪個 repo/路徑失敗，這樣使用者回報錯誤畫面就能直接定位。
    const ctxParts = [];
    if(payload && payload.action) ctxParts.push(payload.action);
    if(payload && payload.repo) ctxParts.push("@" + payload.repo);
    if(payload && payload.path) ctxParts.push(payload.path);
    const ctx = ctxParts.length ? `[${ctxParts.join(" ")}] ` : "";
    throw new Error(ctx + (data.error || (res.status + " " + res.statusText)));
  }
  return data;
}

/* ============================================================
   GitHub 寫入——透過 Netlify function 代為執行（登入的人沒有自己的
   GitHub 帳號/權限，統一用同一組藏在後端的服務帳號 token）
   ============================================================ */
function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

// repo 是選填的白名單參數（見 github-proxy.js 的 ALLOWED_REPOS）：不帶就
// 維持寫 Internal-Pages（原本的行為），只有「新增子頁面」順便建立
// asstudiowebsite 那邊的 .dc.html 骨架時才會帶 "asstudiowebsite"。
async function ghGetFile(path, repo){
  const data = await callFunction("github-proxy", { action: "getFile", path, repo });
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  return { sha: data.sha, content, json: JSON.parse(content) };
}

// 跟 ghGetFile 一樣，只是不假設檔案內容是 JSON——用來讀 .dc.html 這種原始
// 檔案（例如「新增子頁面」要抓現成的 .dc.html 樣板來源檔時），硬要塞進
// ghGetFile 的 JSON.parse 會直接噴錯。
async function ghGetFileRaw(path, repo){
  const data = await callFunction("github-proxy", { action: "getFile", path, repo });
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  return { sha: data.sha, content };
}

async function ghListDir(path){
  return callFunction("github-proxy", { action: "listDir", path });
}

async function ghPutFile(path, base64Content, message, sha, repo){
  return callFunction("github-proxy", { action: "putFile", path, content: base64Content, message, sha, repo });
}

async function ghDeleteFile(path, message, sha){
  return callFunction("github-proxy", { action: "deleteFile", path, message, sha });
}

function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function sanitizeFilename(name){
  return name.replace(/[^\w.\-一-鿿]+/g, "_");
}

/* 上傳一張照片到指定資料夾（案例照片放 images/<slug>/，主網站案例卡片
   放 images/site/），檔名衝突就自動加時間戳記，回傳最終路徑 */
async function uploadAsset(file, folder){
  const filename = sanitizeFilename(file.name);
  const b64 = await readFileAsBase64(file);
  const data = await callFunction("github-proxy", { action: "uploadAsset", folder, filename, content: b64 });
  return data.path;
}

/* ============================================================
   路徑式讀寫（處理任意深度的巢狀資料，例如 "photos.2.caption"、
   "designResearch.0.photos.1.caption"），文字輸入用「打字當下直接寫回
   state，不整個重畫畫面」，只有新增/刪除/上傳這種「結構改變」的操作
   才會呼叫 rerenderEditor() 整個重畫，這樣打字就不會卡頓、游標也不會
   跳掉。
   ============================================================ */
function getPath(obj, path){
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, value){
  const keys = path.split(".");
  let o = obj;
  for(let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
}

function reorderPhotos(ed, basePath, from, to){
  const list = getPath(ed.item, basePath);
  if(!list || from === to || from < 0 || to < 0 || from >= list.length || to >= list.length) return;
  const [moved] = list.splice(from, 1);
  list.splice(to, 0, moved);
}

async function loadCaseList(){
  const entries = await ghListDir("content/projects");
  const files = entries.filter(e => e.type === "file" && e.name.endsWith(".json"));
  const items = await Promise.all(files.map(async f => {
    try{
      const { json } = await ghGetFile(f.path);
      return { slug: json.slug || f.name.replace(/\.json$/, ""), title: json.title || "", ledeMeta: json.ledeMeta || "", hero: json.hero || "" };
    }catch(e){
      return { slug: f.name.replace(/\.json$/, ""), title: "（讀取失敗）", ledeMeta: "", hero: "" };
    }
  }));
  state.cases = items;
}

async function loadSubpageList(){
  const entries = await ghListDir("content/subpages");
  const files = entries.filter(e => e.type === "file" && e.name.endsWith(".json"));
  const items = await Promise.all(files.map(async f => {
    const slug = f.name.replace(/\.json$/, "");
    const page = SUBPAGE_PAGES[slug];
    try{
      const { json } = await ghGetFile(f.path);
      return { slug, title: json.title || (page && page.label) || slug };
    }catch(e){
      return { slug, title: "（讀取失敗）" };
    }
  }));
  state.subpages = items;
}

function renderSetPassword(){
  app.innerHTML = `
    <div class="wrap">
      <div class="login-screen">
        <h1>設定密碼</h1>
        <p>請先設定密碼，之後就用 email + 這組密碼登入後台。</p>
        <input type="password" id="newPassword" placeholder="設定密碼（至少 6 個字）" autocomplete="new-password">
        <button class="btn primary" id="setPasswordBtn">設定密碼並進入後台</button>
      </div>
    </div>
  `;
  document.getElementById("setPasswordBtn").addEventListener("click", async () => {
    const password = document.getElementById("newPassword").value;
    if(!password || password.length < 6){ toast("密碼至少要 6 個字", true); return; }
    try{
      setLoading(true, "設定密碼中…");
      const { data, error } = await sb.auth.updateUser({ password });
      if(error) throw error;
      const { data: sessionData } = await sb.auth.getSession();
      authSession = data.session || sessionData.session;
      // 密碼真的設完了，這個 flag 的任務結束——不清掉的話 render() 會
      // 一直誤判「這還是邀請信連結」，卡在設定密碼畫面出不去。
      AUTH_LINK_TYPE = null;
      history.replaceState(null, "", location.pathname);
      if(!authSession){ toast("設定成功，請重新登入", false); render(); return; }
      state.user = { email: authSession.user.email };
      setLoading(true, "載入案例清單中…");
      await loadCaseList();
      render();
    }catch(err){
      toast(err.message || "設定密碼失敗", true);
    }finally{
      setLoading(false);
    }
  });
}

/* 打開一個既有案例時，順便去問三個章節的 JSON 裡有沒有已經連結這個
   案例的卡片，讓「顯示在主網站章節」的勾選框正確反映現況（而不是每次
   打開都預設全部沒勾），這樣移除章節連結也可以直接在這裡做 */
async function loadLinkedChapters(slug){
  const href = `https://as-studio001.github.io/Internal-Pages/?case=${slug}`;
  const found = [];
  for(const meta of CASE_CARD_CHAPTERS){
    try{
      const { json } = await ghGetFile(meta.file);
      if((json.cases || []).some((c) => c.href === href)) found.push(meta.name);
    }catch(e){ /* 忽略單一章節讀取失敗，不擋住整個編輯畫面 */ }
  }
  if(state.editingCase && state.editingCase.item.slug === slug){
    state.editingCase.linkedChapters = found;
    if(!state.editingCase.isNew) rerenderCurrentEditor();
  }
}

function resolveSrc(pendingUploads, srcValue){
  if(pendingUploads && pendingUploads[srcValue]) return pendingUploads[srcValue].previewUrl;
  return rawUrl(srcValue);
}

function coverDropHtml(fieldPath, imgSrc, small){
  return `
    <div class="cover-drop ${imgSrc ? "has-image" : ""} ${small ? "small" : ""}" data-cover-field="${esc(fieldPath)}">
      ${imgSrc
        ? `<img src="${esc(imgSrc)}" alt=""><div class="replace-hint">點擊或拖曳圖片以更換</div>`
        : `<div class="placeholder">${iconUpload()}<span>點擊或拖曳圖片</span></div>`

    </div>
  `;

function bindCoverDropEvents(ed, fieldPath, folder){
  const dropEl = app.querySelector(`[data-cover-field="${CSS.escape(fieldPath)}"]`);
  if(!dropEl) return;
  const fileInput = dropEl.querySelector("input[type=file]");
  dropEl.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if(fileInput.files[0]) handleCoverFile(ed, fieldPath, fileInput.files[0]);
  });
  ["dragover","dragenter"].forEach(evt => dropEl.addEventListener(evt, e => { e.preventDefault(); dropEl.classList.add("drag-over"); }));
  ["dragleave","drop"].forEach(evt => dropEl.addEventListener(evt, e => { e.preventDefault(); dropEl.classList.remove("drag-over"); }));
  dropEl.addEventListener("drop", e => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file && file.type.startsWith("image/")) handleCoverFile(ed, fieldPath, file);
  });
}

function handleCoverFile(ed, fieldPath, file){
  const tempKey = "PENDING::" + uid();
  ed.pendingUploads[tempKey] = { file, previewUrl: URL.createObjectURL(file) };
  setPath(ed.item, fieldPath, tempKey);
  rerenderCurrentEditor();
}

function bindPhotoList(ed, basePath, listId, folder){
  const wrap = document.getElementById(listId);
  if(!wrap) return;
  wrap.querySelectorAll("[data-remove-photo]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.removePhoto, 10);
      getPath(ed.item, basePath).splice(i, 1);
      rerenderCurrentEditor();
    });
  });
  const addBtn = wrap.querySelector("[data-add-photo]");
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.multiple = true; fileInput.style.display = "none";
  addBtn.after(fileInput);
  addBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => addPhotoFiles(ed, basePath, Array.from(fileInput.files)));
  ["dragover","dragenter"].forEach(evt => wrap.addEventListener(evt, e => { e.preventDefault(); wrap.classList.add("drag-over"); }));
  ["dragleave","drop"].forEach(evt => wrap.addEventListener(evt, e => { e.preventDefault(); wrap.classList.remove("drag-over"); }));
  wrap.addEventListener("drop", e => {
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith("image/"));
    if(files.length) addPhotoFiles(ed, basePath, files);
  });

  // 清單裡的照片本身也能互相拖曳交換順序（跟從電腦拖新照片進來是不同的
  // 拖曳，靠 dataTransfer 有沒有真的檔案區分，兩邊互不干擾）
  let dragRowIndex = null;
  wrap.querySelectorAll(".photo-row").forEach((row) => {
    row.addEventListener("dragstart", () => { dragRowIndex = parseInt(row.dataset.photoIndex, 10); });
    row.addEventListener("dragover", (e) => { e.preventDefault(); e.stopPropagation(); row.classList.add("drag-target"); });
    row.addEventListener("dragleave", () => row.classList.remove("drag-target"));
    row.addEventListener("drop", (e) => {
      e.stopPropagation();
      row.classList.remove("drag-target");
      const toIndex = parseInt(row.dataset.photoIndex, 10);
      if(dragRowIndex == null || dragRowIndex === toIndex) return;
      reorderPhotos(ed, basePath, dragRowIndex, toIndex);
      if(basePath === "photos") delete ed.item.photoLayout;
      dragRowIndex = null;
      rerenderCurrentEditor();
    });
  });
}

/* 把 ed.item 裡所有指向 pendingUploads 的暫時 key，實際上傳到對應資料夾，換成正式路徑 */
async function flushPendingUploads(ed, folder){
  const keys = Object.keys(ed.pendingUploads);
  for(let i = 0; i < keys.length; i++){
    const key = keys[i];
    setLoading(true, `上傳圖片中… (${i+1}/${keys.length})`);
    const finalPath = await uploadAsset(ed.pendingUploads[key].file, folder);
    replaceValueDeep(ed.item, key, finalPath);
    delete ed.pendingUploads[key];
  }
}
function replaceValueDeep(obj, oldVal, newVal){
  if(Array.isArray(obj)){ obj.forEach(v => replaceValueDeep(v, oldVal, newVal)); return; }
  if(obj && typeof obj === "object"){
    Object.keys(obj).forEach(k => {
      if(obj[k] === oldVal) obj[k] = newVal;
      else if(typeof obj[k] === "object") replaceValueDeep(obj[k], oldVal, newVal);
    });
  }
}

function rerenderCurrentEditor(){

/* ============================================================
   案例即時預覽的編輯（點文字改文字、點照片換照片）——iframe 裡真的
   在跑 index.html + render.js，跟真正上線的頁面是同一套渲染邏輯，
   不是另外做一份長得像的介面。文字用 contenteditable 直接改，改完
   iframe 內部自己就會顯示新文字，不需要通知後台重畫；照片沒辦法
   「直接改」，點下去會回報給這裡，由後台負責挑檔案、暫存預覽網址，
   再把整份內容重新 po 回 iframe 重畫一次。
   ============================================================ */
window.addEventListener("message", (e) => {
  if(!e.data) return;

  const ed = state.editingCase;
  if(!ed) return;
  if(e.data.type === "cms-edit"){
    handleCaseEdit(ed, e.data);
    return;
  }
  if(e.data.type === "cms-rendered"){
    // 四個分區各自都是完整的一份頁面，隨便挑一個（固定用「內容」那個）
    // 重畫完的當下去要自動排版就好，不用四個都各要一次
    const contentFrame = document.getElementById("preview_content");
    if(ed.pendingAutoLayoutRequest && contentFrame && e.source === contentFrame.contentWindow){
      ed.pendingAutoLayoutRequest = false;
      contentFrame.contentWindow.postMessage({ type: "cms-compute-auto-layout" }, "*");
    }
    // 每個分區各自的 iframe 只在自己第一次重畫完之後把不相關的部分藏起來
    // （之後的重畫不用再藏一次，藏起來的狀態本來就會一直維持著）
    CASE_PREVIEW_BLOCKS.forEach((block) => {
      const frame = document.getElementById("preview_" + block.key);
      if(frame && e.source === frame.contentWindow && !ed._previewFocused[block.key]){
        ed._previewFocused[block.key] = true;
        frame.contentWindow.postMessage({ type: "cms-focus-section", key: block.key }, "*");
      }
    });
    return;
  }
  if(e.data.type === "cms-content-height"){
    // 裁切完之後把 iframe 的框高貼著剩下的內容調整，不要留一大截空白，
    // 之後內容變動（多打一段文字之類）也會再收到一次、跟著重新調整
    CASE_PREVIEW_BLOCKS.forEach((block) => {
      const frame = document.getElementById("preview_" + block.key);
      if(frame && e.source === frame.contentWindow){
        frame.style.height = Math.max(120, e.data.height) + "px";
      }
    });
    return;
  }
  if(e.data.type === "cms-auto-layout"){
    ed.item.photoLayout = e.data.layout;
    refreshPhotoToolbar(ed);
    return;
  }
});

function postCaseProjectToIframe(ed){
  const data = resolveCaseForPreview(ed.item, ed.pendingUploads);
  CASE_PREVIEW_BLOCKS.forEach((block) => {
    const iframe = document.getElementById("preview_" + block.key);
    if(iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: "cms-preview", project: data }, "*");
  });
}

function resolveCaseForPreview(item, pendingUploads){
  const clone = JSON.parse(JSON.stringify(item));
  const resolve = (v) => (pendingUploads[v] ? pendingUploads[v].previewUrl : v);
  clone.hero = resolve(clone.hero);
  (clone.photos || []).forEach((p) => { p.src = resolve(p.src); });
  (clone.drawings || []).forEach((p) => { p.src = resolve(p.src); });
  ["designResearch", "process"].forEach((kind) => {
    (clone[kind] || []).forEach((step) => {
      (step.photos || []).forEach((p) => { p.src = resolve(p.src); });
    });
  });
  return clone;
}

/* 在即時預覽裡點照片換掉之後，下面清單裡對應那張縮圖也要跟著換，
   不然要等使用者剛好觸發別的重畫（例如新增另一張照片）才會更新，
   看起來像沒生效 */
function syncCompactThumb(containerId, photoIndex, newSrc){
  const img = document.querySelector(`#${containerId} [data-photo-index="${photoIndex}"] .thumb img`);
  if(img) img.src = newSrc;
}

/* ============================================================
   照片排版：預設完全自動（跟以前一樣，系統依照片比例決定並排/全幅、
   平均分散在文字裡），使用者不用管。只有想微調時才進來調——「這組
   照片要接在第幾段文字後面」「兩張並排時左右比例怎麼分」，其餘（單張
   全幅、多張直式照片並排…）維持自動判斷，不用使用者操心。
   ============================================================ */
function getValidPhotoLayout(ed){
  const layout = ed.item.photoLayout;
  const photos = ed.item.photos || [];
  if(!Array.isArray(layout) || layout.length === 0) return null;
  const seen = new Set();
  for(const g of layout){
    if(!Array.isArray(g.photos) || g.photos.length === 0) return null;
    for(const i of g.photos){
      if(typeof i !== "number" || i < 0 || i >= photos.length || seen.has(i)) return null;
      seen.add(i);
    }
  }
  return seen.size === photos.length ? layout : null;
}

/* 照片排版還沒產生過、或因為照片張數變了而失效時，跟 iframe 要一份
   自動排版當起點（要等 iframe 那份照片比例真的量測完才能算，所以先
   立 flag，等 cms-rendered 回報再送 cms-compute-auto-layout） */
function ensurePhotoLayout(ed){
  if((ed.item.photos || []).length < 2) return;
  if(getValidPhotoLayout(ed)) return;
  ed.pendingAutoLayoutRequest = true;
  postCaseProjectToIframe(ed);
}

const PAIR_RATIO_LABELS = ["左大右小", "右大左小", "接近對半"];

/* 點預覽裡某張內文照片之後跳出的小工具列（換照片／獨立全版／跟下一張
   併排＋選比例）——版面配置固定就這幾種，點選就好，不是自由拖拉調整
   大小，避免排版跑掉。 */
function replacePhotoAt(ed, index){
  pickImageFile((file) => {
    const key = "PENDING::" + uid();
    const previewUrl = URL.createObjectURL(file);
    ed.pendingUploads[key] = { file, previewUrl };
    ed.item.photos[index].src = key;
    postCaseProjectToIframe(ed);
    syncCompactThumb("photosList", index, previewUrl);
  });
}

/* 把某張照片從目前的排版分組裡拆出來，回傳「拆完之後」的分組清單跟
   它原本接在第幾段文字後（後面設定 solo/pair 都要沿用這個位置，不然
   一調整排版，插入位置就跳掉） */
function extractPhotoFromLayout(layout, indices){
  // indices[0] 是「主要那張」（使用者實際點的那張照片）——插入位置優先
  // 沿用它原本所在的分組，不是隨便挑一個沾到邊的分組
  let afterParagraph = 0;
  let foundPrimary = false;
  const rest = [];
  for(const g of layout){
    const hit = g.photos.some((i) => indices.includes(i));
    if(hit){
      if(!foundPrimary || g.photos.includes(indices[0])){
        afterParagraph = g.afterParagraph;
        if(g.photos.includes(indices[0])) foundPrimary = true;
      }
      const remaining = g.photos.filter((i) => !indices.includes(i));
      if(remaining.length > 0){
        const newGroup = Object.assign({}, g, { photos: remaining });
        if(remaining.length !== 2) delete newGroup.pairRatio;
        rest.push(newGroup);
      }
    } else {
      rest.push(g);
    }
  }
  return { rest, afterParagraph };
}

function setPhotoSolo(ed, index){
  const photos = ed.item.photos || [];
  const layout = getValidPhotoLayout(ed) || photos.map((_, i) => ({ photos: [i], afterParagraph: 0 }));
  const { rest, afterParagraph } = extractPhotoFromLayout(layout, [index]);
  rest.push({ photos: [index], afterParagraph });
  ed.item.photoLayout = rest;
}

function setPhotoPairWithNext(ed, index, ratio){
  const photos = ed.item.photos || [];
  const next = index + 1;
  if(next >= photos.length) return;
  const layout = getValidPhotoLayout(ed) || photos.map((_, i) => ({ photos: [i], afterParagraph: 0 }));
  const { rest, afterParagraph } = extractPhotoFromLayout(layout, [index, next]);
  rest.push({ photos: [index, next], afterParagraph, pairRatio: ratio });
  ed.item.photoLayout = rest;
}

function movePhotoGroup(ed, index, delta){
  const paragraphs = ed.item.paragraphs || [];
  const layout = getValidPhotoLayout(ed);
  if(!layout) return;
  const g = layout.find((gr) => gr.photos.includes(index));
  if(!g) return;
  g.afterParagraph = Math.max(0, Math.min(paragraphs.length, g.afterParagraph + delta));
}

function photoToolbarHtml(ed){
  const index = ed.selectedPhotoIndex;
  if(index == null) return "";
  const photos = ed.item.photos || [];
  if(index >= photos.length){ ed.selectedPhotoIndex = null; return ""; }
  const hasNext = index + 1 < photos.length;
  const layout = getValidPhotoLayout(ed);
  const myGroup = layout && layout.find((g) => g.photos.includes(index));
  const isPaired = !!(myGroup && myGroup.photos.length === 2);
  const currentRatio = isPaired ? myGroup.pairRatio : null;
  return `
    <div class="label">第 ${index + 1} 張照片</div>
    <div class="photo-toolbar-actions">
      <button type="button" class="btn" data-photo-action="replace">🖼 換這張照片</button>
      <button type="button" class="btn ${!isPaired ? "primary" : ""}" data-photo-action="solo">獨立全版</button>
      ${hasNext ? PAIR_RATIO_LABELS.map((label, i) => `
        <button type="button" class="btn ${isPaired && currentRatio === i ? "primary" : ""}" data-photo-action="pair" data-ratio="${i}">跟下一張併排：${label}</button>
      `).join("") : `<span class="field-hint" style="margin:0">已經是最後一張，沒有下一張可以併排</span>`}
    </div>
    <div class="photo-toolbar-actions">
      <button type="button" class="btn ghost" data-photo-action="moveBack">◀ 往前一段文字</button>
      <button type="button" class="btn ghost" data-photo-action="moveForward">往後一段文字 ▶</button>
      <button type="button" class="back-link" data-photo-action="close">關閉</button>
    </div>
    <div class="field-hint">單張全幅、多張直式照片並排等版型系統會自動判斷，這裡只控制獨立／併排比例、跟接在哪段文字後面</div>
  `;
}

function refreshPhotoToolbar(ed){
  const block = document.getElementById("photoToolbar");
  if(!block) return;
  if(ed.selectedPhotoIndex == null){
    block.style.display = "none";
    block.innerHTML = "";
    return;
  }
  block.style.display = "";
  block.innerHTML = photoToolbarHtml(ed);
  bindPhotoToolbar(ed);
}

function bindPhotoToolbar(ed){
  const block = document.getElementById("photoToolbar");
  if(!block) return;
  block.querySelectorAll("[data-photo-action]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const index = ed.selectedPhotoIndex;
      const action = btn.dataset.photoAction;
      if(action === "close"){ ed.selectedPhotoIndex = null; refreshPhotoToolbar(ed); return; }
      if(action === "replace"){ replacePhotoAt(ed, index); return; }
      if(action === "solo"){ setPhotoSolo(ed, index); postCaseProjectToIframe(ed); refreshPhotoToolbar(ed); return; }
      if(action === "pair"){ setPhotoPairWithNext(ed, index, Number(btn.dataset.ratio)); postCaseProjectToIframe(ed); refreshPhotoToolbar(ed); return; }
      if(action === "moveBack"){ movePhotoGroup(ed, index, -1); postCaseProjectToIframe(ed); refreshPhotoToolbar(ed); return; }
      if(action === "moveForward"){ movePhotoGroup(ed, index, 1); postCaseProjectToIframe(ed); refreshPhotoToolbar(ed); return; }
    });
  });
}

function pickImageFile(cb){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.addEventListener("change", () => { if(input.files[0]) cb(input.files[0]); });
  input.click();
}

function handleCaseEdit(ed, data){
  if(data.field === "title"){ ed.item.title = data.value; return; }
  if(data.field === "ledeMeta"){ ed.item.ledeMeta = data.value; return; }
  if(data.field === "paragraph"){
    ed.item.paragraphs = ed.item.paragraphs || [];
    ed.item.paragraphs[data.index] = data.value;
    const ta = document.getElementById("paragraphsText");
    if(ta) ta.value = ed.item.paragraphs.join("\n\n");
    return;
  }
  if(data.field === "hero-replace"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      ed.pendingUploads[key] = { file, previewUrl: URL.createObjectURL(file) };
      ed.item.hero = key;
      postCaseProjectToIframe(ed);
    });
    return;
  }
  if(data.field === "photo-select"){
    // 點內文照片不是馬上換照片，是先選定這張、跳出工具列（換照片／
    // 獨立全版／跟下一張併排…），排版微調直接在這份預覽上做
    ed.selectedPhotoIndex = data.index;
    refreshPhotoToolbar(ed);
    return;
  }
  if(data.field === "photo-reorder"){
    // 直接把預覽裡的照片拖到另一張上交換順序——位置全部變了，舊的
    // 分組/併排比例設定沒意義了，清掉讓它重新自動排一次
    reorderPhotos(ed, "photos", data.from, data.to);
    delete ed.item.photoLayout;
    ed.selectedPhotoIndex = null;
    rerenderCurrentEditor();
    return;
  }
  if(data.field === "step-body"){
    ed.item[data.kind][data.stepIndex].body = data.value;
    const ta = app.querySelector(`[data-path="${data.kind}.${data.stepIndex}.body"]`);
    if(ta) ta.value = data.value;
    return;
  }
  if(data.field === "step-photo-replace"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      const previewUrl = URL.createObjectURL(file);
      ed.pendingUploads[key] = { file, previewUrl };
      if(data.kind === "drawings"){
        ed.item.drawings[data.photoIndex].src = key;
        syncCompactThumb("drawingsList", data.photoIndex, previewUrl);
      } else {
        ed.item[data.kind][data.stepIndex].photos[data.photoIndex].src = key;
        syncCompactThumb(`${data.kind}_${data.stepIndex}_photos`, data.photoIndex, previewUrl);
      }
      postCaseProjectToIframe(ed);
    });
    return;
  }
  // 以下這幾種是「新增全新內容」——直接在即時預覽裡按「+」就能開始，
  // 不用先跑去下面的清單新增第一筆才有東西可以點。走跟清單上那些
  // 「新增」按鈕完全一樣的路徑（rerenderCurrentEditor 整個重畫，
  // iframe 會跟著重新載入、自動同步最新內容）。
  if(data.field === "paragraph-add"){
    ed.item.paragraphs = ed.item.paragraphs || [];
    ed.item.paragraphs.push("");
    rerenderCurrentEditor();
    return;
  }
  if(data.field === "photo-add"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      ed.pendingUploads[key] = { file, previewUrl: URL.createObjectURL(file) };
      ed.item.photos = ed.item.photos || [];
      ed.item.photos.push({ src: key, caption: "" });
      rerenderCurrentEditor();
    });
    return;
  }
  if(data.field === "step-add"){
    ed.item[data.kind] = ed.item[data.kind] || [];
    ed.item[data.kind].push({ body: "", photos: [] });
    rerenderCurrentEditor();
    return;
  }
  if(data.field === "drawing-add"){
    pickImageFile((file) => {
      const key = "PENDING::" + uid();
      ed.pendingUploads[key] = { file, previewUrl: URL.createObjectURL(file) };
      ed.item.drawings = ed.item.drawings || [];
      ed.item.drawings.push({ src: key, caption: "" });
      rerenderCurrentEditor();
    });
    return;
  }
}

function renderCaseEditor(){
  const ed = state.editingCase;
  app.innerHTML = `${renderTopBar()}<div class="wrap">${caseEditorHtml(ed)}</div>`;
  document.getElementById("logoutBtn").addEventListener("click", logout);
  document.getElementById("backBtn").addEventListener("click", closeCaseEditor);
  const deleteBtn = document.getElementById("deleteBtn");
  if(deleteBtn) deleteBtn.addEventListener("click", deleteCurrentCase);

  bindPathInputs(ed, app);

  // 四個分區各自一個 iframe，各自載入完就送目前內容過去，並且只在「這個
  // iframe 自己第一次」渲染完後捲到自己負責的區塊——不用使用者自己找，
  // 之後使用者在裡面手動滾動看別的部分也不會被強制拉回去。
  // 每次整頁重畫（開啟編輯器、或新增段落/照片這類會整個重畫的操作）都是
  // 全新的 4 個 iframe，「已經裁切過」的狀態要重置，不然新 iframe 永遠
  // 不會裁切、會整頁露出來
  ed._previewFocused = {};
  CASE_PREVIEW_BLOCKS.forEach((block) => {
    const frame = document.getElementById("preview_" + block.key);
    if(!frame) return;
    frame.addEventListener("load", () => postCaseProjectToIframe(ed));
  });

  document.getElementById("paragraphsText").addEventListener("input", (e) => {
    ed.item.paragraphs = e.target.value
      .split(/\n\s*\n/)
      .map((s) => s.trim())
      .filter(Boolean);
    postCaseProjectToIframe(ed);
  });

  const folder = () => `images/${ed.item.slug || "tmp"}`;
  bindPhotoList(ed, "photos", "photosList", folder());
  bindPhotoList(ed, "drawings", "drawingsList", folder());
  bindStepsFor(ed, "designResearch", "designResearchList", folder());
  bindStepsFor(ed, "process", "processList", folder());

  refreshPhotoToolbar(ed);
  ensurePhotoLayout(ed);

  document.getElementById("saveBtn").addEventListener("click", () => saveCaseEditor(ed));
}

/* 新案例不用自己打網址代號（slug）——這是給網址跟照片資料夾用的內部
   代號，一般使用者不需要理解這個概念，存檔時用案名自動翻成英文、轉成
   網址格式，重複的話自動加編號 */
// existingSlugs：要避開撞名的既有 slug 清單；fallbackBase：翻譯失敗時用的
// 預設前綴（案例用「case」、子頁面用「page」）。案例／子頁面兩種「新增」流程
// 共用同一套「用標題自動翻譯出英文網址代號」邏輯，只是各自傳進不同的既有
// 清單跟預設前綴。
async function generateUniqueSlug(title, existingSlugs, fallbackBase){
  let base = "";
  try{
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=en&dt=t&q=" + encodeURIComponent(title);
    const r = await fetch(url);
    const j = await r.json();
    base = (j[0] || []).map((seg) => seg[0]).join("");
  }catch(e){ /* 翻譯失敗就退回用預設前綴的編號 */ }
  base = base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  if(!base) base = fallbackBase || "item";
  const existing = new Set(existingSlugs || []);
  let slug = base;
  let i = 2;
  while(existing.has(slug)){
    slug = `${base}-${i}`;
    i++;
  }
  return slug;
}

async function saveCaseEditor(ed){
  if(!ed.item.title){ toast("請至少填寫案名", true); return; }

  let slug;
  if(ed.isNew){
    try{
      setLoading(true, "產生案例編號中…");
      slug = await generateUniqueSlug(ed.item.title, (state.cases || []).map((c) => c.slug), "case");
    }catch(err){
      toast("建立案例失敗：" + err.message, true);
      setLoading(false);
      return;
    }
  } else {
    slug = document.getElementById("f_slug").value.trim();
  }
  ed.item.slug = slug;

  const selectedChapters = Array.from(app.querySelectorAll("[data-add-to-chapter]:checked")).map((el) => el.dataset.addToChapter);
  const originalChapters = ed.linkedChapters || [];
  const toAdd = selectedChapters.filter((c) => !originalChapters.includes(c));
  const toRemove = originalChapters.filter((c) => !selectedChapters.includes(c));

  try{
    setLoading(true, "儲存中…");
    await flushPendingUploads(ed, `images/${slug}`);
    const json = JSON.stringify(ed.item, null, 2) + "\n";
    await ghPutFile(`content/projects/${slug}.json`, utf8ToBase64(json), `Update case ${slug} via admin`, ed.sha);

    if(toAdd.length || toRemove.length){
      setLoading(true, "同步主網站章節中…");
      const href = `https://as-studio001.github.io/Internal-Pages/?case=${slug}`;
      const card = {
        image: `https://as-studio001.github.io/Internal-Pages/${ed.item.hero}`,
        href,
        label: { "zh-Hant": ed.item.title },
      };
      for(const chName of toAdd){
        const meta = CASE_CARD_CHAPTERS.find((c) => c.name === chName);
        if(meta) await addCaseCardToChapter(meta, card);
      }
      for(const chName of toRemove){
        const meta = CASE_CARD_CHAPTERS.find((c) => c.name === chName);
        if(meta) await removeCaseCardFromChapter(meta, href);
      }
    }

    toast("已發布，網站幾分鐘內會更新");
    setLoading(true, "重新載入清單中…");
    await loadCaseList();
    closeCaseEditor();
  }catch(err){
    toast("儲存失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

/* 把一張案例卡片加進某個章節的 cases 清單（存在相同連結就跳過，避免
   重複存檔時一直疊加同一張卡片） */
async function addCaseCardToChapter(meta, card){
  const { json, sha } = await ghGetFile(meta.file);
  json.cases = json.cases || [];
  if(json.cases.some((c) => c.href === card.href)) return;
  json.cases.push(card);
  const body = JSON.stringify(json, null, 2) + "\n";
  await ghPutFile(meta.file, utf8ToBase64(body), `Add case card via admin`, sha);
}

/* 取消勾選某個章節時，把對應的卡片從那個章節移除——這樣「顯示在主網站
   章節」這排勾選框就是雙向的：勾上會加、取消勾選會移除，不用再跑去
   「主網站內容」手動刪 */
async function removeCaseCardFromChapter(meta, href){
  const { json, sha } = await ghGetFile(meta.file);
  const cases = json.cases || [];
  const next = cases.filter((c) => c.href !== href);
  if(next.length === cases.length) return;
  json.cases = next;
  const body = JSON.stringify(json, null, 2) + "\n";
  await ghPutFile(meta.file, utf8ToBase64(body), `Remove case card via admin`, sha);
}

async function deleteCurrentCase(){
  if(!confirm("確定要刪除這個案例嗎？這個動作沒辦法復原。")) return;
  const ed = state.editingCase;
  try{
    setLoading(true, "刪除中…");
    await ghDeleteFile(`content/projects/${ed.item.slug}.json`, `Delete case ${ed.item.slug} via admin`, ed.sha);
    toast("已刪除");
    await loadCaseList();
    closeCaseEditor();
  }catch(err){
    toast("刪除失敗：" + err.message, true);
  }finally{
    setLoading(false);
  }
}

/* ============================================================
   子頁面編輯器（原型教學等，content/subpages/<slug>.json）——做法比照
   「主網站內容」章節編輯器，不是案例編輯器：一般的表單欄位（拖拉/點擊
   上傳照片、文字輸入框），不是即時預覽 iframe。子頁面的 .dc.html 原始
   檔在另一個 repo（asstudiowebsite），沒辦法像案例編輯器那樣直接嵌一個
   會即時重繪的頁面進來，而且維護者操作習慣也是比較直覺的表單，所以照
   章節編輯器的模式做：coverDropHtml／bindCoverDropEvents（單張照片拖拉
   上傳，跟 heroPhoto／mainPhoto 同一個元件）、imageListHtml／bindImageList
   （多張照片清單，跟章節 thumbnails 同一個元件）、data-path 文字欄位
   （bindPathInputs 直接寫回 ed.item，不用整頁重畫）。

   這次只把「橫向滑塊畫廊」跟「內文段落」做進來（見 teaching.json 的
   schema），時間軸／手風琴／案例輪播／得獎清單這些只有少數子頁才有的
   特殊模組還沒做，之後要做哪一頁再個別設計。
   ============================================================ */
// uploadAsset() 只回傳相對於「這個後台」repo 的路徑（例如
// "images/subpages/teaching/xxx.jpg"），子頁面實際部署在另一個 repo／
// 網域（asstudiowebsite），畫廊照片的舊資料則是相對於「子頁面自己網站」
// 的路徑（例如 "uploads/實習.jpg"）——兩種相對路徑的基準網址不一樣，不能
// 都用 resolveSrc()／rawUrl()（那個只認得 Internal-Pages 自己的網址），
// 這裡另外寫一個專門給子頁面用的版本，正確分流三種情況。
function resolveSubpagePhotoSrc(ed, value){
  if(!value) return "";
  if(ed.pendingUploads[value]) return ed.pendingUploads[value].previewUrl;
  if(/^https?:\/\//.test(value)) return value;
  return `${SUBPAGE_SITE_BASE}/${value.split("/").map(encodeURIComponent).join("/")}`;
}

// 存檔前把「剛剛才上傳、現在是相對於後台 repo 的路徑」轉成完整網址，
// 否則子頁面渲染時會把它當成相對於子頁面自己網站的路徑去抓、404——
// 已經是完整網址、或子頁面自己網站既有的相對路徑（不是這次上傳產生的）
// 都不受影響，用固定的資料夾前綴（跟 saveSubpageEditor 傳給
// flushPendingUploads 的 folder 一致）判斷是不是「這次上傳的」。
const SUBPAGE_ASSET_PREFIX = "images/subpages/";
function absolutizeSubpageAssetPaths(obj){
  if(Array.isArray(obj)){
    obj.forEach((v, i) => {
      if(typeof v === "string" && v.startsWith(SUBPAGE_ASSET_PREFIX)) obj[i] = "https://as-studio001.github.io/Internal-Pages/" + v;
      else if(v && typeof v === "object") absolutizeSubpageAssetPaths(v);
    });
    return;
  }
  if(obj && typeof obj === "object"){
    Object.keys(obj).forEach((k) => {
      const v = obj[k];
      if(typeof v === "string" && v.startsWith(SUBPAGE_ASSET_PREFIX)) obj[k] = "https://as-studio001.github.io/Internal-Pages/" + v;
      else if(v && typeof v === "object") absolutizeSubpageAssetPaths(v);
    });
  }
}

// 捲動目標下拉選單的選項：用內文段落（sections）目前的中文標題當選項文字，
// 值還是存段落的 id（跟原本文字框存的東西一樣，畫面上只是換成挑標題、
// 不用自己記/打 id）。如果目前存的 target 對不到任何一段（例如段落被刪
// 掉、改過 id），額外加一個選項把原始值原封不動列出來，不會靜默把資料
// 洗掉，讓維護者自己決定要不要換掉。
function sectionOptionLabel(s, si){
  if(s.type === "heading") return s.text || "（空白標題）";
  return (SECTION_TYPE_LABELS[s.type] || s.type) + " #" + si;
}

// 捲動目標下拉選單的選項：內容段落（不含 sections[0] 照片滑塊本身，捲到自己
// 沒有意義）都可以當目標，標題段落用它自己的文字當選項文字比較好認，其他
// 類型用「類型名稱 + 第幾段」代替（它們沒有單一一行文字可以代表自己）。
function galleryTargetOptionsHtml(ed, currentTarget){
  const secs = getPath(ed.item, "sections") || [];
  const contentSecs = secs.slice(1).map((s, i) => ({ s, si: i + 1 }));
  const known = contentSecs.some(({ s }) => s.id === currentTarget);
  const options = [`<option value="">（不捲動）</option>`];
  contentSecs.forEach(({ s, si }) => {
    options.push(`<option value="${esc(s.id)}" ${s.id === currentTarget ? "selected" : ""}>${esc(sectionOptionLabel(s, si))}</option>`);
  });
  if(currentTarget && !known){
    options.push(`<option value="${esc(currentTarget)}" selected>${esc(currentTarget)}（找不到對應段落）</option>`);
  }
  return options.join("");
}

// 通用的「拖曳調整順序」小工具：container 底下每個符合 itemSelector 的直接
// 子元素都可以被拖曳，但只能從 handleSelector 那個把手開始拖（用 dragstart
// 時判斷事件目標是不是在把手裡面，不是就 preventDefault 擋掉），避免點文字框
// /文字時不小心也觸發拖曳。拖曳中即時把元素在 DOM 裡搬動位置，讓使用者立刻
// 看到排列結果；放開滑鼠（drop）才讀最終的 DOM 順序（每個項目的 data-sort-key）
// 回傳給 onReorder 去更新實際資料。不依賴任何外部套件，純 HTML5 原生 API。
function makeSortable(container, itemSelector, handleSelector, onReorder){
  if(!container) return;
  let dragEl = null;
  const items = () => Array.from(container.children).filter((el) => el.matches(itemSelector));
  // 讀目前 DOM 的順序存起來，drop 觸發時呼叫一次；如果 drop 沒觸發（見下面
  // dragend 的說明），dragEl 還留著，dragend 收尾時也會呼叫到這裡，用「畫面
  // 上已經拖成的樣子」補救性存一次，避免看起來排好了、資料卻沒真的存到。
  const commitOrder = () => {
    if(!dragEl) return;
    onReorder(items().map((el) => el.dataset.sortKey));
  };
  items().forEach((el) => {
    // 一開始不是 draggable，只有真的按住「把手」才暫時打開，放開/拖完就關掉——
    // 子頁面編輯器有兩層拖曳（段落本身、段落內的小標題/內文/照片互相嵌套），
    // 如果兩層同時都是 draggable=true，瀏覽器對「巢狀 draggable 元素」原生支援
    // 並不穩定（實測會整個卡住、dragover/drop 完全不觸發），所以任何時刻最多
    // 只讓使用者剛按下把手的那一層變成 draggable，兩層不會同時成立。
    // 另外每個事件都呼叫 e.stopPropagation()：nested 兩層各自都掛了同一組
    // 監聽器，drag 事件會往上冒泡，不擋住的話內層的 dragstart/dragover/drop
    // 會連外層（例如段落卡片本身）的同一套邏輯也一起觸發，把外層的 dragEl
    // 弄亂。
    el.draggable = false;
    const handle = el.querySelector(handleSelector);
    if(handle){
      handle.addEventListener("mousedown", (e) => { el.draggable = true; e.stopPropagation(); });
    }
    el.addEventListener("dragstart", (e) => {
      e.stopPropagation();
      dragEl = el;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", ""); }catch(err){ /* Firefox 需要至少設一次資料才會真的啟動拖曳 */ }
    });
    el.addEventListener("dragend", (e) => {
      e.stopPropagation();
      // 保險機制：正常情況 drop 事件會先呼叫 commitOrder() 把新順序存起來、
      // 順便把 dragEl 清空，這裡的 commitOrder() 因為 dragEl 已經是 null
      // 直接跳過，不會重複存兩次。但如果放開滑鼠那一刻游標剛好落在沒有正確
      // 接受 drop 的位置（drop 事件沒觸發），dragEl 這時還留著——因為
      // dragover 全程都在即時搬動 DOM，畫面上其實已經是排序後的樣子，資料
      // 卻還沒存到，兩邊會兜不起來（使用者以為排好了，其實存檔會存回舊順序）。
      // 這裡補呼叫一次 commitOrder()，用「畫面上已經拖成的樣子」存一次，
      // 確保放開滑鼠之後，看起來的樣子永遠等於真的存下來的東西。
      commitOrder();
      el.draggable = false;
      el.classList.remove("dragging");
      dragEl = null;
    });
    el.addEventListener("mouseup", (e) => { el.draggable = false; e.stopPropagation(); });
    // dragenter 也要擋（不只 dragover）：瀏覽器在游標剛進入一個新元素的那一刻
    // 先發 dragenter，沒被擋下來的話，有些情況下那個元素還沒被視為合法的放置
    // 目標，要等下一次 dragover 才會生效——兩個都擋才穩，尤其在項目高度差很大
    // （拖過去的路徑上一路都在同一個很高的項目範圍內，dragover 事件很密集但
    // 都對著同一個元素）時比較不會出現放開滑鼠卻沒有觸發 drop 的狀況。
    el.addEventListener("dragenter", (e) => {
      if(!dragEl || dragEl === el) return;
      e.preventDefault();
      e.stopPropagation();
    });
    el.addEventListener("dragover", (e) => {
      if(!dragEl || dragEl === el) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = el.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      el.parentNode.insertBefore(dragEl, before ? el : el.nextSibling);
    });
  });
  container.addEventListener("dragenter", (e) => { if(dragEl) e.preventDefault(); });
  container.addEventListener("dragover", (e) => { if(dragEl) e.preventDefault(); });
  container.addEventListener("drop", (e) => {
    if(!dragEl) return;
    e.preventDefault();
    e.stopPropagation();
    commitOrder();
    dragEl = null; // 已經處理過，等一下 dragend 的 commitOrder() 會因為 dragEl 是 null 直接跳過
  });
}

// 段落是「一段一種功能」的扁平清單，不是「段落包多個區塊」——小標題／內文／
// 照片／垂直時間軸／水平時間軸／案例資訊卡／得獎清單，每段自己選一種，可以
// 自由新增任意數量、任意順序。sections[0] 固定是照片滑塊（gallery-slider），
// 不在這份可新增的類型清單裡，也不能被拖到別的位置或刪除——見
// gallerySectionCardHtml，它的排版跟編輯方式都跟其他段落完全不同，獨立處理。
const SECTION_TYPE_LABELS = {
  heading: "小標題",
  body: "內文",
  photos: "照片",
  "timeline-vertical": "垂直時間軸",
  "timeline-horizontal": "水平時間軸",
  "case-card": "案例資訊卡",
  "award-list": "得獎清單"
};
const SECTION_TYPE_OPTIONS = Object.keys(SECTION_TYPE_LABELS);

function blankSection(type){
  const id = "sc-section-custom-" + Date.now() + "-" + uid();
  if(type === "photos") return { id, type, layout: "grid", images: [] };
  if(type === "timeline-vertical" || type === "timeline-horizontal") return { id, type, items: [] };
  if(type === "case-card") return { id, type, title: "", photos: [], specZh: "", specEn: "" };
  if(type === "award-list") return { id, type, items: [] };
  return { id, type, text: "" };
}

// 垂直/水平時間軸段落裡「一筆一筆」的年份/標題/說明（或時期/事件/說明）——
// 跟照片滑塊、段落都是同一種「可新增/移除的清單」模式，獨立成小函式，兩種
// 時間軸共用同一份，差別只在傳進來的欄位定義（fields）。
function timelineItemsHtml(si, items, fields){
  const rows = items.map((it, ii) => `
    <div class="step-card" data-item-index="${ii}" style="margin-bottom:10px;">
      <div class="step-card-head">
        <span class="step-label">第 ${ii + 1} 筆</span>
        <button type="button" class="row-remove-btn" data-remove-titem="${ii}" title="移除">×</button>
      </div>
      ${fields.map(([key, label]) => `
        <div class="field-block" style="margin-bottom:8px;">
          <label>${label}</label>
          <input type="text" data-path="sections.${si}.items.${ii}.${key}" value="${esc(it[key] || "")}">
        </div>
      `).join("")}
    </div>
  `).join("");
  return `
    <div id="timelineItems_${si}">
      ${rows}
      <button type="button" class="add-photo-btn" data-add-titem="1">${iconUpload()}<span>新增一筆</span></button>
    </div>
  `;
}

function bindTimelineItems(ed, si){
  const container = document.getElementById(`timelineItems_${si}`);
  if(!container) return;
  const section = getPath(ed.item, `sections.${si}`);
  const items = section.items || (section.items = []);
  container.querySelectorAll("[data-remove-titem]").forEach((btn) => {
    btn.addEventListener("click", () => {
      items.splice(parseInt(btn.dataset.removeTitem, 10), 1);
      rerenderCurrentEditor();
    });
  });
  const addBtn = container.querySelector("[data-add-titem]");
  if(addBtn) addBtn.addEventListener("click", () => {
    items.push({});
    rerenderCurrentEditor();
  });
}

// 得獎清單逐筆的表單：num/year/name/tier/link 都是文字輸入框，photo 用跟
// 滑塊同一套 coverDropHtml 單張換圖元件。
function awardListItemsHtml(ed, si, items){
  const rows = items.map((it, ii) => `
    <div class="step-card award-item-row" data-item-index="${ii}" data-sort-key="${ii}" style="margin-bottom:10px;">
      <div class="step-card-head">
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="award-item-drag-handle" title="拖曳調整順序" style="cursor:grab; opacity:.5;">⠿</span>
          <span class="step-label">第 ${ii + 1} 筆${it.name ? "　" + esc(it.name) : ""}</span>
        </span>
        <button type="button" class="row-remove-btn" data-remove-awarditem="${ii}" title="移除">×</button>
      </div>
      <div style="display:flex; gap:14px; align-items:flex-start;">
        ${coverDropHtml(`sections.${si}.items.${ii}.photo`, resolveSubpagePhotoSrc(ed, it.photo), true)}
        <div style="flex:1">
          <div class="two-col">
            <div>
              <label>編號</label>
              <input type="text" data-path="sections.${si}.items.${ii}.num" value="${esc(it.num || "")}">
            </div>
            <div>
              <label>年份</label>
              <input type="text" data-path="sections.${si}.items.${ii}.year" value="${esc(it.year || "")}">
            </div>
          </div>
          <div class="field-block" style="margin-top:10px;">
            <label>獎項名稱</label>
            <input type="text" data-path="sections.${si}.items.${ii}.name" value="${esc(it.name || "")}">
          </div>
          <div class="two-col" style="margin-top:10px;">
            <div>
              <label>級別（例如「首獎」「佳作」，選填）</label>
              <input type="text" data-path="sections.${si}.items.${ii}.tier" value="${esc(it.tier || "")}">
            </div>
            <div>
              <label>連結網址（選填，沒填就顯示純文字）</label>
              <input type="text" data-path="sections.${si}.items.${ii}.link" value="${esc(it.link || "")}" placeholder="https://...">
            </div>
          </div>
        </div>
      </div>
    </div>
  `).join("");
  return `
    <div id="awardItems_${si}">
      ${rows}
      <button type="button" class="add-photo-btn" data-add-awarditem="1">${iconUpload()}<span>新增一筆</span></button>
    </div>
  `;
}

function bindAwardListItems(ed, si){
  const container = document.getElementById(`awardItems_${si}`);
  if(!container) return;
  const section = getPath(ed.item, `sections.${si}`);
  const items = section.items || (section.items = []);
  const folder = `${SUBPAGE_ASSET_PREFIX}${ed.slug}`;
  items.forEach((it, ii) => bindCoverDropEvents(ed, `sections.${si}.items.${ii}.photo`, folder));
  container.querySelectorAll("[data-remove-awarditem]").forEach((btn) => {
    btn.addEventListener("click", () => {
      items.splice(parseInt(btn.dataset.removeAwarditem, 10), 1);
      rerenderCurrentEditor();
    });
  });
  const addBtn = container.querySelector("[data-add-awarditem]");
  if(addBtn) addBtn.addEventListener("click", () => {
    items.push({ num: String(items.length + 1).padStart(2, "0"), year: "", name: "", tier: "", photo: "", link: "" });
    rerenderCurrentEditor();
  });
  // 拖曳調整清單順序：每筆的表單欄位（data-path、縮圖 id...）都是照它在陣列
  // 裡的位置（ii）編出來的，拖完一定要整頁重畫才會全部對到新順序，跟段落／
  // 時間軸拖曳排序是同一個道理。
  makeSortable(container, ".award-item-row", ".award-item-drag-handle", (newOrder) => {
    const reordered = newOrder.map((idxStr) => items[parseInt(idxStr, 10)]);
    items.length = 0;
    items.push(...reordered);
    rerenderCurrentEditor();
  });
}

// 每段的表單欄位，依 type 分派——heading/body 是文字輸入、photos/case-card
// 是圖片清單、timeline-*/award-list 是逐筆可增減清單。
function sectionFieldsHtml(ed, si, s){
  const type = s.type;
  if(type === "heading"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>標題文字</label>
        <input type="text" data-path="sections.${si}.text" value="${esc(s.text || "")}">
      </div>
      <div class="field-block" style="margin-bottom:0;">
        <label>大小</label>
        <select data-path="sections.${si}.level" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
          <option value="h2" ${s.level !== "h3" ? "selected" : ""}>一般標題</option>
          <option value="h3" ${s.level === "h3" ? "selected" : ""}>小標題（穿插在中間用的子標題）</option>
        </select>
      </div>
    `;
  }
  if(type === "body"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>內文文字</label>
        <textarea data-path="sections.${si}.text" style="min-height:120px">${esc(s.text || "")}</textarea>
      </div>
      <div class="field-block" style="margin-bottom:0;">
        <label>樣式</label>
        <select data-path="sections.${si}.style" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
          <option value="" ${s.style !== "emphasis" ? "selected" : ""}>一般內文</option>
          <option value="emphasis" ${s.style === "emphasis" ? "selected" : ""}>強調段（結語，字級更大、粗體、灰階）</option>
        </select>
      </div>
    `;
  }
  if(type === "photos"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>排版方式</label>
        <select data-path="sections.${si}.layout" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
          <option value="grid" ${s.layout !== "stack" ? "selected" : ""}>格狀排列（適合多張照片）</option>
          <option value="stack" ${s.layout === "stack" ? "selected" : ""}>直式堆疊（適合手繪圖這類要看清楚全圖的直式圖）</option>
        </select>
      </div>
      ${imageListHtml(ed, `sections.${si}.images`, `sectionPhotos_${si}`)}
    `;
  }
  if(type === "timeline-vertical") return timelineItemsHtml(si, s.items || [], [["year", "年份"], ["title", "標題"], ["desc", "說明"]]);
  if(type === "timeline-horizontal") return timelineItemsHtml(si, s.items || [], [["period", "時期"], ["event", "事件"], ["desc", "說明"]]);
  if(type === "case-card"){
    return `
      <div class="field-block" style="margin-bottom:10px;">
        <label>案名</label>
        <input type="text" data-path="sections.${si}.title" value="${esc(s.title || "")}">
      </div>
      <div class="field-block" style="margin-bottom:10px;">
        <div class="label">照片（選填，展開卡片時顯示在規格文字上方）</div>
        ${imageListHtml(ed, `sections.${si}.photos`, `sectionCardPhotos_${si}`)}
      </div>
      <div class="field-block" style="margin-bottom:10px;">
        <label>中文規格（一行一項，例如「建築類型 / 住宅」，換行就會分行顯示）</label>
        <textarea data-path="sections.${si}.specZh" style="min-height:100px">${esc(s.specZh || "")}</textarea>
      </div>
      <div class="field-block">
        <label>英文規格（選填）</label>
        <textarea data-path="sections.${si}.specEn" style="min-height:100px">${esc(s.specEn || "")}</textarea>
      </div>
    `;
  }
  if(type === "award-list") return awardListItemsHtml(ed, si, s.items || []);
  return "";
}

// 照片滑塊固定當第 1 段：排版（橫向 hover-expand）、欄位都跟其他段落完全
// 不同，獨立一個卡片渲染，不透過 sectionFieldsHtml 那套 type 分派；也不能
// 被拖到別的位置或刪除，只有滑塊本身（items）可以自由增減。
function gallerySectionCardHtml(ed, gallerySection){
  const items = gallerySection.items || [];
  const rows = items.map((it, ii) => `
    <div class="step-card" data-gallery-index="${ii}">
      <div class="step-card-head">
        <span class="step-label">滑塊 ${ii + 1}</span>
        <button type="button" class="row-remove-btn" data-remove-gallery="${ii}" title="移除這個滑塊">×</button>
      </div>
      <div style="display:flex; gap:14px; align-items:flex-start;">
        ${coverDropHtml(`sections.0.items.${ii}.photo`, resolveSubpagePhotoSrc(ed, it.photo), true)}
        <div style="flex:1">
          <div class="two-col">
            <div>
              <label>編號</label>
              <input type="text" data-path="sections.0.items.${ii}.num" value="${esc(it.num || "")}">
            </div>
            <div>
              <label>捲動目標（點這個滑塊要捲到哪一段，選填）</label>
              <select data-path="sections.0.items.${ii}.target" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">${galleryTargetOptionsHtml(ed, it.target || "")}</select>
            </div>
          </div>
          <div class="two-col" style="margin-top:12px">
            <div>
              <label>中文標題</label>
              <input type="text" data-path="sections.0.items.${ii}.zh" value="${esc(it.zh || "")}">
            </div>
            <div>
              <label>英文副標</label>
              <input type="text" data-path="sections.0.items.${ii}.en" value="${esc(it.en || "")}">
            </div>
          </div>
        </div>
      </div>
    </div>
  `).join("");
  return `
    <div class="step-card section-card" data-section-fixed="gallery">
      <div class="step-card-head">
        <span class="step-label">第 1 段・照片滑塊（固定在最前面）</span>
      </div>
      <div id="galleryItemsList">
        ${rows}
        <button type="button" class="add-step-btn" data-add-gallery="1">${iconUpload()}<span>新增滑塊</span></button>
      </div>
    </div>
  `;
}

function bindGallerySection(ed){
  const gallerySection = getPath(ed.item, "sections.0");
  if(!gallerySection) return;
  const items = gallerySection.items || (gallerySection.items = []);
  const container = document.getElementById("galleryItemsList");
  if(!container) return;
  const folder = `${SUBPAGE_ASSET_PREFIX}${ed.slug}`;
  items.forEach((it, ii) => bindCoverDropEvents(ed, `sections.0.items.${ii}.photo`, folder));
  container.querySelectorAll("[data-remove-gallery]").forEach((btn) => {
    btn.addEventListener("click", () => {
      items.splice(parseInt(btn.dataset.removeGallery, 10), 1);
      rerenderCurrentEditor();
    });
  });
  const addBtn = container.querySelector("[data-add-gallery]");
  if(addBtn) addBtn.addEventListener("click", () => {
    const num = String(items.length + 1).padStart(2, "0");
    items.push({ num, zh: "", en: "", target: "", photo: "", textOverride: "#ffffff" });
    rerenderCurrentEditor();
  });
}

function sectionCardHtml(ed, si, s){
  const type = s.type;
  return `
    <div class="step-card section-card" data-section-index="${si}" data-sort-key="${si}">
      <div class="step-card-head">
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="section-drag-handle" title="拖曳調整段落順序">⠿</span>
          <span class="step-label">第 ${si + 1} 段・${SECTION_TYPE_LABELS[type] || type}</span>
        </span>
        <button type="button" class="row-remove-btn" data-remove-section="${si}" title="移除這段">×</button>
      </div>
      ${sectionFieldsHtml(ed, si, s)}
    </div>
  `;
}

function sectionsHtml(ed){
  const secs = getPath(ed.item, "sections") || [];
  const gallerySection = secs[0];
  const contentSections = secs.slice(1);
  const galleryCard = gallerySection ? gallerySectionCardHtml(ed, gallerySection) : "";
  const contentCards = contentSections.map((s, i) => sectionCardHtml(ed, i + 1, s)).join("");
  return `
    ${galleryCard}
    <div id="contentSectionsList">${contentCards}</div>
    <div style="display:flex; gap:8px; align-items:center; margin-top:10px;">
      <select id="addSectionType" style="padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);">
        ${SECTION_TYPE_OPTIONS.map((t) => `<option value="${t}">${SECTION_TYPE_LABELS[t]}</option>`).join("")}
      </select>
      <button type="button" class="add-step-btn" data-add-section="1">${iconUpload()}<span>新增段落</span></button>
    </div>
  `;
}

function bindSections(ed){
  const secs = getPath(ed.item, "sections") || [];
  const contentSections = secs.slice(1);
  const folder = `${SUBPAGE_ASSET_PREFIX}${ed.slug}`;
  const contentContainer = document.getElementById("contentSectionsList");

  contentSections.forEach((s, i) => {
    const si = i + 1;
    if(s.type === "photos") bindImageList(ed, `sections.${si}.images`, `sectionPhotos_${si}`, folder);
    if(s.type === "case-card") bindImageList(ed, `sections.${si}.photos`, `sectionCardPhotos_${si}`, folder);
    if(s.type === "timeline-vertical" || s.type === "timeline-horizontal") bindTimelineItems(ed, si);
    if(s.type === "award-list") bindAwardListItems(ed, si);
  });

  if(contentContainer){
    contentContainer.querySelectorAll("[data-remove-section]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if(!confirm("確定要移除這一段嗎？")) return;
        secs.splice(parseInt(btn.dataset.removeSection, 10), 1);
        rerenderCurrentEditor();
      });
    });
    // 段落彼此之間的順序調整：sections[0]（照片滑塊）固定不參與這個拖曳容器，
    // 永遠留在最前面；「第 N 段」標籤跟每段表單欄位的 id 都是按陣列位置編
    // 出來的，拖完一定要整頁重畫。
    makeSortable(contentContainer, ".section-card", ".section-drag-handle", (newOrder) => {
      const reordered = newOrder.map((idxStr) => secs[parseInt(idxStr, 10)]);
      secs.length = 1;
      secs.push(...reordered);
      rerenderCurrentEditor();
    });
  }

  const addSectionBtn = document.querySelector("[data-add-section]");
  if(addSectionBtn) addSectionBtn.addEventListener("click", () => {
    const select = document.getElementById("addSectionType");
    const type = select ? select.value : "body";
    secs.push(blankSection(type));
    rerenderCurrentEditor();
  });
}

function subpageEditorHtml(ed){
  const page = SUBPAGE_PAGES[ed.slug];
  const previewUrl = page ? `${SUBPAGE_SITE_BASE}/${encodeURIComponent(page.file)}` : null;
  const noPreviewHint = ed.isNew
    ? `<div class="field-hint">這是還沒發布過的新子頁面，還沒有對應的網頁程式碼可以預覽——請先在左邊填好內容並「儲存並發布」，存檔時會自動在 asstudiowebsite 建立對應的 .dc.html 頁面，之後再回來就會有預覽畫面。</div>`
    : `<div class="field-hint">找不到這個子頁面對應的檔名（SUBPAGE_PAGES 沒有這筆對照）。如果這是剛新增、第一次存檔的子頁面：可能是存檔當時 asstudiowebsite 那邊已經自動建立好 .dc.html 了、只是這裡的 SUBPAGE_PAGES 對照表還要手動補一筆才能開啟預覽；也可能是當時建立 .dc.html 那個步驟本身就失敗了（存檔按鈕按下去之後有沒有跳出「儲存失敗」的紅色提示可以回想一下）。不確定的話，直接去 asstudiowebsite 這個 repo 看有沒有多出一個同名的 .dc.html 檔案最準。</div>`;
  return `
    <div class="editor">
      <div class="editor-head">
        <button class="back-link" id="backBtn">← 回到子頁面列表</button>
      </div>
      <div class="subpage-editor-columns">
        <div class="subpage-editor-left">
          <div class="field-block">
            <label>標題</label>
            <input type="text" data-path="title" value="${esc(ed.item.title || "")}" placeholder="例如：原型原點">
            ${ed.isNew ? `<div class="field-hint">網址代號會在第一次「儲存並發布」時，依標題自動翻譯產生（跟新增案例一樣），存檔前不用自己填。</div>` : ""}
          </div>
          <div class="field-block">
            <div class="label">段落（第 1 段固定是照片滑塊，其餘可以自由新增/刪除/拖曳排序，每段只做一件事：小標題、內文、照片……）</div>
            <div id="sectionsList">${sectionsHtml(ed)}</div>
          </div>

          <div class="save-bar">
            <span class="save-status" id="saveStatus"></span>
            <button class="btn primary" id="saveSubpageBtn">儲存並發布</button>
          </div>
        </div>
        <div class="subpage-editor-right">
          ${previewUrl ? `
            <div class="field-block" style="margin-bottom:10px;">
              <div class="label" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
                <span>頁面預覽</span>
                <button type="button" class="btn ghost" id="refreshPreviewBtn">↻ 重新整理</button>
              </div>
            </div>
            <div class="field-hint" style="margin-bottom:10px">目前已經發布上線的頁面，不會即時反映還沒按「儲存並發布」的修改；存檔後 GitHub Pages 需要幾分鐘重新部署，等一下再按「重新整理」才看得到最新結果。</div>
            <iframe id="subpagePublishedPreview" src="${esc(previewUrl)}" style="width:100%; height:80vh; min-height:520px; border:1px solid var(--line); border-radius:8px;"></iframe>
          ` : noPreviewHint}
        </div>
      </div>
    </div>
  `;
}

function renderSubpageEditor(){
  const ed = state.editingSubpage;
  app.innerHTML = `
    ${renderTopBar()}
    <div class="wrap wrap-wide">${subpageEditorHtml(ed)}</div>
  `;
  document.getElementById("backBtn").addEventListener("click", closeSubpageEditor);
  bindPathInputs(ed, app);
  bindGallerySection(ed);
  bindSections(ed);
  const refreshBtn = document.getElementById("refreshPreviewBtn");
  if(refreshBtn) refreshBtn.addEventListener("click", () => {
    const frame = document.getElementById("subpagePublishedPreview");
    if(!frame) return;
    // 跨網域（admin 跟子頁面網站不同源）不能直接呼叫 iframe 內部的 reload()，
    // 改成在網址後面加一個每次都不同的參數逼瀏覽器真的重新抓一次，不要因為
    // 網址字串完全沒變、又剛好命中瀏覽器快取而看起來像沒重新整理。
    const base = frame.dataset.baseSrc || frame.src;
    frame.dataset.baseSrc = base;
    const sep = base.includes("?") ? "&" : "?";
    frame.src = base + sep + "_r=" + Date.now();
  });
  document.getElementById("saveSubpageBtn").addEventListener("click", () => saveSubpageEditor(ed));
}

// 這份內嵌複本要記得跟著手動更新，不然新建的子頁面會停留在舊版樣板。
const SUBPAGE_DC_TEMPLATE_SOURCE_SLUG = "origin";
const SUBPAGE_DC_TEMPLATE_SOURCE_HTML = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"><\/script>

<body>
<!-- PAGE TRANSITION PRELOADER (arriving from homepage)：跟首頁自己第一次進站播放的
     是同一支影片（uploads/網頁前導片.mp4），只在真的從首頁節點點進來時才播——由首頁
     點擊節點當下設定的 sessionStorage 旗標 scTransitionIn 決定，直接重新整理/直接
     輸入網址/瀏覽器上一頁都不會播（讀不到旗標就立刻移除遮罩） -->
<div id="sc-arrival-overlay" style="position:fixed; inset:0; z-index:99999; background:#ffffff; display:flex; align-items:center; justify-content:center; transition:opacity 0.6s ease;">
  <video id="sc-arrival-video" autoplay muted playsinline preload="auto" style="width:100%; height:100%; object-fit:cover;">
    <source src="uploads/網頁前導片.mp4" type="video/mp4">
  </video>
</div>
<script>
(function () {
  var overlay = document.getElementById('sc-arrival-overlay');
  var vid = document.getElementById('sc-arrival-video');
  if (!overlay || !vid) return;

  var flag;
  try { flag = sessionStorage.getItem('scTransitionIn'); } catch (err) { flag = null; }
  if (flag !== '1') { overlay.remove(); return; }
  try { sessionStorage.removeItem('scTransitionIn'); } catch (err) {}

  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    overlay.style.opacity = '0';
    setTimeout(function () { overlay.remove(); }, 600);
  }
  vid.addEventListener('ended', reveal);
  vid.addEventListener('error', reveal);
  setTimeout(reveal, 15000);
})();
