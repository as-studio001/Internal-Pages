<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案例名稱　建築事務所</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     此區塊為暫代的頂部導覽,合併進主頁時請直接替換為主頁的 header
     ============================================================ -->
<header class="site-header">
  <div class="site-header__left">
    <button class="site-menu-btn" type="button" aria-label="選單">☰</button>
    <a href="#" class="site-logo">as</a>
  </div>
  <div class="site-header__right">
    <nav class="site-nav">
      <a href="#">Team</a>
      <a href="#">Film</a>
      <a href="#">Contact</a>
    </nav>
    <button class="site-lang-btn" type="button" aria-label="切換語言">🌐</button>
  </div>
</header>

<main>

  <!-- 標題區：純文字，不疊在圖片上（照 snohetta / herzogdemeuron 的做法） -->
  <header class="page-head grid">
    <p class="eyebrow c-12" id="hero-tag"></p>
    <h1 class="c-10" id="hero-title"></h1>
    <p class="lede-meta c-8" id="lede-meta"></p>
  </header>

  <!-- 全幅大圖：接在標題文字之後 -->
  <section class="hero-photo" id="hero-photo">
    <div class="ph" data-ph="1"></div>
  </section>

  <!-- 內文：文字與照片交錯 -->
  <div class="content grid" id="content"></div>

  <!-- 設計研究：模型照片、手稿，跟施工過程分開收納，一樣是不分類、文字接縮圖 -->
  <section class="research-section">
    <div class="grid">
      <div class="c-12">
        <p class="section-label">設計研究</p>
        <div id="research-steps"></div>
      </div>
    </div>
  </section>

  <!-- 施工過程：不分類，文字接一排小縮圖，照 herzogdemeuron.com 專案頁的 Process 段落做法 -->
  <section class="process-section">
    <div class="grid">
      <div class="c-12">
        <p class="section-label">施工過程</p>
        <div id="process-steps"></div>
      </div>
    </div>
  </section>

  <!-- 圖面：平面圖、剖面圖、立面圖等技術圖說，跟施工過程的照片分開獨立收納 -->
  <section class="drawings-section">
    <div class="grid">
      <div class="c-12">
        <p class="section-label">圖面</p>
        <div class="drawings-grid" id="drawings-grid"></div>
      </div>
    </div>
  </section>

  <!-- 基地位置地圖：全幅、照 rshp.com/projects/project-map 的圖標樣式，排在最下面 -->
  <section class="map-full">
    <p class="map-full__label">位置</p>
    <div class="map-full__canvas" id="site-map"></div>
    <div class="map-full__info">
      <p class="map__address" id="map-address"></p>
      <p class="map__coords" id="map-coords"></p>
    </div>
  </section>

</main>

<!-- ============================================================
     此區塊為暫代的頁尾,合併進主頁時請直接替換為主頁的 footer
     ============================================================ -->
<footer class="site-footer">
  <p>© 2026 STUDIO NAME</p>
</footer>

<!-- 燈箱 Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox__close" id="lightbox-close" aria-label="關閉">×</button>
  <img class="lightbox__img" id="lightbox-img" src="" alt="">
  <p class="lightbox__caption" id="lightbox-caption"></p>
</div>

<!-- ============================================================
     data-sample.js＝之後每個新案例「唯一需要修改」的檔案
     只要複製這個檔案、換掉文字與圖片路徑,版型會自動套用
     ============================================================ -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data-sample.js"></script>
<script src="js/render.js"></script>
</body>
</html>
